<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14251c">
<title>小游戏合集</title>
<style>
  :root{
    --bg0:#0f1f18; --bg1:#16302a; --fg:#f3f7f2; --dim:rgba(243,247,242,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* 别再给 body 写 height:100%：那样 body 就是「定高」的 flex 容器，
     两张卡片作为列方向的 flex item 会被 flex-shrink 压扁，
     再撞上 .card 的 overflow:hidden，菜单最下面的「开始玩」直接被裁掉；
     页面又刚好不溢出，于是怎么上滑都滚不动。
     现在 body 只给 min-height，内容多高它就多高，滚动交还给文档。 */
  html{height:100%}
  body{
    background:
      radial-gradient(120% 70% at 50% -10%, #1d4437 0%, transparent 60%),
      radial-gradient(90% 60% at 100% 100%, #123243 0%, transparent 55%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
    color:var(--fg);
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100%;
    min-height:100dvh;
    display:flex; justify-content:center;
    padding:calc(22px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  /* flex:0 0 auto + 子项 flex:none：内容说了算，不许被压扁 */
  main{flex:0 0 auto;width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}

  header{flex:none;padding:6px 4px 10px}
  h1{font-size:25px;letter-spacing:.5px;font-weight:800}
  h1 span{color:#7ee9a8}
  .sub{margin-top:6px;font-size:13px;color:var(--dim);line-height:1.5}

  .card{
    flex:none;
    display:block;text-decoration:none;color:inherit;
    border-radius:20px;overflow:hidden;position:relative;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 10px 26px rgba(0,0,0,.28);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:active{transform:scale(.985)}
  @media (hover:hover){ .card:hover{transform:translateY(-2px);border-color:rgba(126,233,168,.4);box-shadow:0 16px 34px rgba(0,0,0,.36)} }

  .thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;display:block}
  .thumb svg{width:100%;height:100%;display:block}
  .badge{
    position:absolute;left:12px;top:12px;
    font-size:11px;font-weight:700;letter-spacing:.4px;
    padding:4px 9px;border-radius:999px;
    background:rgba(8,22,16,.5);color:#eaf7ee;backdrop-filter:blur(6px);
  }
  .info{padding:13px 15px 15px}
  .info h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px}
  .info p{margin-top:6px;font-size:12.5px;line-height:1.6;color:var(--dim)}
  .go{
    display:inline-flex;align-items:center;gap:5px;margin-top:11px;
    font-size:12.5px;font-weight:700;color:#0f1f18;
    background:linear-gradient(180deg,#8ff0b4,#4fd07f);
    padding:7px 14px;border-radius:999px;
  }
  footer{flex:none;margin-top:6px;text-align:center;font-size:11.5px;color:rgba(243,247,242,.4);line-height:1.7;padding-bottom:6px}
  .apk{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:9px 18px;border-radius:999px;
    font-size:12.5px;font-weight:700;color:#d8f5e4;text-decoration:none;
    background:rgba(255,255,255,.07);border:1px solid rgba(126,233,168,.35)}
  .apk:active{background:rgba(126,233,168,.16)}
</style>
</head>
<body>
<main>
  <header>
    <h1>小游戏<span>合集</span></h1>
    <p class="sub">挑一个开始，手机浏览器直接玩 · 不用装东西</p>
  </header>

  <a class="card" href="./jump/index.html">
    <div class="thumb">
      <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="skyJ" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8fd0e6"/><stop offset=".5" stop-color="#cfe9d4"/><stop offset="1" stop-color="#fbe3bd"/>
          </linearGradient>
        </defs>
        <rect width="320" height="180" fill="url(#skyJ)"/>
        <circle cx="258" cy="36" r="21" fill="#fff4c8" opacity=".85"/>
        <circle cx="258" cy="36" r="34" fill="#fff4c8" opacity=".18"/>
        <path d="M0 122 Q56 84 118 116 T232 112 T320 120 V180 H0Z" fill="#9ec9b4"/>
        <path d="M0 136 Q74 104 146 132 T320 134 V180 H0Z" fill="#7bb497"/>
        <g fill="#3b7a48">
          <path d="M44 136 l13 -30 l13 30z"/><path d="M74 138 l9 -21 l9 21z"/>
          <path d="M196 134 l11 -25 l11 25z"/><path d="M226 137 l8 -18 l8 18z"/>
        </g>
        <rect y="136" width="320" height="44" fill="#4f9c42"/>
        <rect y="136" width="320" height="4" fill="#8ed36a"/>
        <rect x="52" y="132" width="42" height="48" rx="2" fill="#a56e3c"/>
        <rect x="52" y="132" width="42" height="6" fill="#cba06b"/>
        <rect x="146" y="132" width="34" height="48" rx="2" fill="#93b3b8"/>
        <rect x="146" y="132" width="34" height="6" fill="#9fe0ef"/>
        <rect x="238" y="132" width="46" height="48" rx="2" fill="#a56e3c"/>
        <rect x="238" y="132" width="46" height="6" fill="#cba06b"/>
        <g transform="translate(66,96)">
          <rect x="-11" y="0" width="22" height="27" rx="7" fill="#f2703f"/>
          <rect x="-8" y="-7" width="7" height="8" rx="3" fill="#ff9a72"/>
          <rect x="1" y="-7" width="7" height="8" rx="3" fill="#ff9a72"/>
          <circle cx="-4.6" cy="9" r="2.6" fill="#2b2320"/>
          <circle cx="4.6" cy="9" r="2.6" fill="#2b2320"/>
        </g>
        <path d="M96 100 Q150 46 206 92" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="5 6" opacity=".8" stroke-linecap="round"/>
        <ellipse cx="207" cy="134" rx="11" ry="4" fill="#9ef07a" opacity=".85"/>
      </svg>
      <span class="badge">跳跃 · 休闲</span>
    </div>
    <div class="info">
      <h2>跳一跳 · 森林</h2>
      <p>按住蓄力、松开起跳。简单模式走抛物线，困难模式取消抛物线、改成贴地直线冲刺；柱子越跳越窄，还有会左右移动的钢柱。每天一套同题挑战、10 个成就，攒分解锁皮肤。</p>
      <span class="go">开始玩 →</span>
    </div>
  </a>

  <a class="card" href="./monkey/index.html">
    <div class="thumb">
      <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="skyM" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7fd8ef"/><stop offset=".55" stop-color="#bdeef6"/><stop offset="1" stop-color="#f4e6c4"/>
          </linearGradient>
          <linearGradient id="seaM" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3fb6d8"/><stop offset="1" stop-color="#1e86ad"/>
          </linearGradient>
        </defs>
        <rect width="320" height="180" fill="url(#skyM)"/>
        <circle cx="252" cy="40" r="22" fill="#ffe9a8"/>
        <ellipse cx="70" cy="44" rx="30" ry="12" fill="#fff" opacity=".75"/>
        <ellipse cx="92" cy="38" rx="20" ry="10" fill="#fff" opacity=".75"/>
        <rect y="104" width="320" height="34" fill="url(#seaM)"/>
        <path d="M0 112 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#8fe6f7" stroke-width="2" opacity=".6"/>
        <path d="M0 138 q60 -14 160 -6 t160 6 V180 H0Z" fill="#f0dbaa"/>
        <g stroke="#8a6a3f" stroke-width="7" stroke-linecap="round">
          <path d="M62 142 q-4 -26 4 -44"/>
        </g>
        <g fill="#3f9c58">
          <ellipse cx="52" cy="94" rx="22" ry="9" transform="rotate(-18 52 94)"/>
          <ellipse cx="80" cy="92" rx="22" ry="9" transform="rotate(14 80 92)"/>
          <ellipse cx="66" cy="82" rx="20" ry="8"/>
          <ellipse cx="44" cy="104" rx="18" ry="7" transform="rotate(-32 44 104)"/>
          <ellipse cx="88" cy="104" rx="18" ry="7" transform="rotate(30 88 104)"/>
        </g>
        <circle cx="66" cy="88" r="4" fill="#8a5a24"/>
        <g transform="translate(196,110)">
          <circle cx="-13" cy="-9" r="6.5" fill="#a9702f"/>
          <circle cx="13" cy="-9" r="6.5" fill="#a9702f"/>
          <ellipse cx="0" cy="0" rx="14" ry="16" fill="#8a5a24"/>
          <ellipse cx="0" cy="3" rx="10" ry="9" fill="#e8c79a"/>
          <circle cx="-4.4" cy="-2" r="2.3" fill="#2b2320"/>
          <circle cx="4.4" cy="-2" r="2.3" fill="#2b2320"/>
          <path d="M-4 5 q4 4 8 0" stroke="#6b4320" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <rect x="-7" y="15" width="4.5" height="9" rx="2" fill="#8a5a24"/>
          <rect x="2.5" y="15" width="4.5" height="9" rx="2" fill="#8a5a24"/>
        </g>
        <path d="M132 128 q26 -20 48 -4" fill="none" stroke="#e9b93f" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="132" cy="128" r="3.4" fill="#e9b93f"/>
      </svg>
      <span class="badge">跑酷 · 冒险</span>
    </div>
    <div class="info">
      <h2>海滩猴子大冒险</h2>
      <p>带着猴子在沙滩上一路向前，跳过障碍、收集道具，看看能跑多远。</p>
      <span class="go">开始玩 →</span>
    </div>
  </a>

  <footer>
    两个都是单文件网页游戏 · 分数和记录存在本机浏览器里<br>返回到这里按浏览器返回键就行<br>
    <a class="apk" href="https://github.com/qwdnj/jump-forest-game/releases/latest">⬇ 下载 APK 安装包</a>
  </footer>
</main>
<script>
/* 装进 APK 里跑的是 file:///android_asset/…，这时候：
   1. 「下载 APK」按钮没意义 —— 已经装上了；
   2. 回去靠的是手机返回键，不是浏览器返回键。
   网页版（GitHub Pages）保持原样。 */
(function () {
  if (location.protocol !== 'file:') return;
  // 从游戏退回选单时，把外壳（APK）的横屏还回去，别让菜单横着
  if (window.GameShell && typeof window.GameShell.setGameMode === 'function') {
    try { window.GameShell.setGameMode(false); } catch (e) {}
  }
  var btn = document.querySelector('.apk');
  if (btn) btn.style.display = 'none';
  var foot = document.querySelector('footer');
  if (foot) {
    foot.innerHTML = '两个都是单文件网页游戏 · 分数和记录存在这台手机上<br>按手机返回键回到这里';
  }
})();
</script>
</body>
</html>
