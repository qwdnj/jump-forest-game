name: 生成签名密钥（一次性）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成固定密钥库并记录证书指纹
        run: |
          set -e
          mkdir -p android/keystore
          keytool -genkeypair -v \
            -keystore android/keystore/gamebox.p12 -storetype PKCS12 \
            -storepass gamebox -keypass gamebox -alias gamebox \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=GameBox,O=dsh,C=CN"
          keytool -list -v -keystore android/keystore/gamebox.p12 -storepass gamebox \
            | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f' \
            > android/keystore/cert-sha256.txt
          echo "证书 SHA-256：$(cat android/keystore/cert-sha256.txt)"
          ls -la android/keystore

      - name: 提交密钥库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/keystore
          git commit -m "加入固定签名密钥（每次构建同一签名，可覆盖安装）" || echo "没有变化"
          git push
