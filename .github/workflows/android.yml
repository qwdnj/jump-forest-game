name: 构建 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 把网页装进 APK 的 assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp -r jump monkey android/app/src/main/assets/
          ls -la android/app/src/main/assets

      - name: 自检 assets 里的链接
        run: node tools/check-assets.js android/app/src/main/assets

      - name: 冒烟测试页面脚本
        run: |
          node tools/smoke.js \
            android/app/src/main/assets/index.html \
            android/app/src/main/assets/jump/index.html \
            android/app/src/main/assets/monkey/index.html

      - name: 编译 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 看看包有多大
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "APK 大小：$(wc -c < "$APK") 字节"
          unzip -l "$APK"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gamebox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 小游戏合集 APK
          body: |
            自动构建的安装包，内含《跳一跳 · 森林》和《海滩猴子大冒险》。

            v1.1.0：原生启动页、返回键防手滑、渲染进程崩溃自动恢复、
            长按防误触、错误重试页；R8 压缩 + 图标瘦身，包体更小。
            安装时需要在手机上允许「安装未知来源应用」。
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
