name: 构建 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 把网页装进 APK 的 assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp -r jump monkey android/app/src/main/assets/
          ls -la android/app/src/main/assets

      - name: 自检 assets 里的链接
        run: node tools/check-assets.js android/app/src/main/assets

      - name: 冒烟测试页面脚本
        run: |
          node tools/smoke.js \
            android/app/src/main/assets/index.html \
            android/app/src/main/assets/jump/index.html \
            android/app/src/main/assets/monkey/index.html

      - name: 难度 / 皮肤回归测试
        run: node tools/mode-test.js android/app/src/main/assets/jump/index.html

      - name: 每日挑战 / 成就 / 暂停快照回归测试
        run: node tools/daily-test.js android/app/src/main/assets/jump/index.html

      - name: 帧率显示回归测试
        run: node tools/perf-test.js android/app/src/main/assets/jump/index.html android/app/src/main/assets/monkey/index.html

      - name: 勋章系统回归测试
        run: node tools/medal-test.js android/app/src/main/assets/jump/index.html

      - name: 编译 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 看看包有多大
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "APK 大小：$(wc -c < "$APK") 字节"
          unzip -l "$APK"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gamebox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 小游戏合集 APK
          body: |
            自动构建的安装包，内含《跳一跳 · 森林》和《海滩猴子大冒险》。

            v1.5.0：跳一跳加入**勋章系统**。每局结束按分数评一枚**本局勋章**
            （铜 / 银 / 金 / 铂金 / 钻石，简单和困难两套门槛，困难门槛更低），
            结算页挂出本局勋章并告诉你「距下一枚还差几分」；等级章是阶梯，
            拿到钻石下面几级一起点亮。另有 4 枚**特别勋章**：
            完美主义者（单局 12 跳且完美率 ≥60%）、弹簧收藏家（单局 5 个弹簧柱）、
            每日勇者（每日挑战拿金章）、双面高手（简单和困难都拿过金章）。
            设置页新增「勋章」入口（和每日挑战 / 成就并排），里面有勋章墙：
            五枚等级章一行排开，四枚特别章两列卡片，点亮的显示日期。
            HUD 的「最高」前面会挂当前模式的历史最高勋章，右下角还有新章提示条。
            v1.4.1：海滩猴子大冒险的猴子补了一身**毛发细节** —— 头顶一圈短毛边、
            脸颊绒、耳廓毛、身体下沿毛边、身侧软毛、额头碎毛、尾巴尖炸毛；
            跳一跳的柱子改成**隔一根石砖柱**（错缝砖、灰缝、坑洼、砖缝苔藓、石板盖板），
            和木柱交替出现，弹簧柱/摆柱保留自己的材质。

            v1.4.0：两个游戏都做了**模型与画面升级**，并且加了**帧率显示**。
            跳一跳的角色改成「烘焙精灵 + 每帧四肢」：起跳收腿、下落张腿、冲刺后拖、
            蓄力下压都是真动作，有眼白/瞳孔/高光/眨眼，皮肤多了王冠、头巾、绒球帽等配件；
            柱子重画了木纹结疤、青苔、拉丝金属铆钉、弹簧节环和圆角盖板，太阳加了放射光芒，
            接触阴影换成软阴影贴图。海滩猴子大冒险的猴子整套模型重做（尾巴摆动、耳朵分层、
            眨眼、跑动摆臂、腾空举臂、起跳拉长），海岸加了渐变海面、浪花、波光、贝壳、
            远岛、海鸥、海天薄雾和暗角，木箱/椰树/螃蟹/金币全部重画。
            右上角（猴子是右下角）多了 **FPS 胶囊**：关闭 / FPS / FPS+毫秒三档，
            点一下就切，设置面板里也有开关；数字是真实帧间隔平滑出来的，不是写死的 60。

            v1.3.0：跳一跳加入**每日挑战** —— 同一天全球同一套平台（按日期播种），
            当天难度按日期轮换，今日最好成绩单独记、不占普通最高分；
            新增 **10 个成就**（完美主义 / 十连击 / 弹簧信使 / 险象环生 / 硬核玩家 …），
            解锁当场从顶部滑下提示条，设置面板里能看进度。
            顺手修了：弹簧柱上的完美落地漏算最高连击、设置面板横屏溢出、
            成就面板标题被关闭按钮压住；暂停/结算改成整屏快照 + ~30fps，
            静止画面不再满帧重画，更省电。

            v1.2.0：跳一跳加入**简单 / 困难**两种难度 —— 困难模式取消抛物线，
            改成贴柱顶等高直线冲刺（无落点预览、平台更窄、落地额外 +1 分），
            两种模式最高分分开记；新增**皮肤系统**，六款皮肤按最高分解锁
            （森林橘 / 薄荷青 / 小蜜蜂 / 小雪人 / 夜行者 / 黄金甲），
            暂停面板和结算页都多了「设置」入口。

            v1.1.1：选单页可以正常滚动了（以前两张卡片被 flex 压扁，
            「开始玩」被裁在屏幕外）；跳一跳的「全屏」按钮在 APK 里真正切横屏
            （WebView 没有 Fullscreen API，改由外壳切 Activity 方向）。

            v1.1.0：原生启动页、返回键防手滑、渲染进程崩溃自动恢复、
            长按防误触、错误重试页；R8 压缩 + 图标瘦身，包体更小。
            安装时需要在手机上允许「安装未知来源应用」。
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
