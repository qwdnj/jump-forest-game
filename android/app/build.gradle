plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.gamebox'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dsh.gamebox'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.2.0'
    }

    // 固定签名：密钥库由一次性的 Actions 任务生成，已提交在 android/keystore/。
    // 不固定的话 Gradle 每次构建都新生成 debug 密钥，新包就装不到旧包上（签名不一致）。
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/gamebox.p12')
            storeType 'PKCS12'
            storePassword 'gamebox'
            keyAlias 'gamebox'
            keyPassword 'gamebox'
        }
    }

    buildTypes {
        // 体积优化：debug 包也交给 R8 压缩代码、裁掉没用的资源。
        // 名字还是 app-debug.apk，CI 和 Release 那边都不用改。
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
