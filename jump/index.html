
<!DOCTYPE html>

<canvas id="game"></canvas>

<script>
(function () {
'use strict';

/* ============================================================
 *  1. 画布 / 尺寸 / 安全区
 * ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;   // DPR = 实际使用的像素比（屏幕 DPR × 降级系数）
let baseDPR = 1;             // 屏幕原始像素比（上限 2.5，避免 3x 屏过度铺像素）
let resScale = 1;            // 性能自适应系数：1 / 0.82 / 0.68
let safeTop = 0, safeBottom = 0;

function readSafeArea() {
  try {
    const cs = getComputedStyle(document.documentElement);
    const t = parseFloat(cs.getPropertyValue('--sat'));
    const b = parseFloat(cs.getPropertyValue('--sab'));
    safeTop = isNaN(t) ? 0 : t;
    safeBottom = isNaN(b) ? 0 : b;
  } catch (e) { safeTop = 0; safeBottom = 0; }
}

function resizeCanvas() {
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  baseDPR = Math.min(window.devicePixelRatio || 1, 2);
  DPR = baseDPR * resScale;

  const cw = Math.max(1, Math.round(W * DPR));
  const ch = Math.max(1, Math.round(H * DPR));
  // 尺寸没变就不赋值，避免无谓地清空画布
  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  readSafeArea();
}

/* ============================================================
 *  2. 配置
 * ============================================================ */
const CFG = {
  gravity: 2400,
  maxChargeMs: 900,
  minDist: 60,
  maxDist: 430,
  hitstopMs: 55,
  step: 1 / 120,
  trailDots: 14,
  trailLife: 0.32,
  springBonus: 3,
  poolMax: 300,
  fireflyBase: 16,
  duskScore: 60,         // 到达此分数时天色完全进入黄昏
  inputBufferMs: 170,    // 落地前这么久内按下，落地后自动开始蓄力
  previewHintJumps: 8,   // 前几次跳跃显示落点加分预览，之后只显示落点
  popupMax: 24,          // 飘字上限
  ringMax: 14,           // 光环上限
  leafCount: 15,
  starCount: 46
};

/* 提示：原先写在 CFG 里的 mercyPx / perfectR / springChance / swayChance
   已经挪进下面的 MODES —— 它们是按难度分开的，不能再只留一份。 */

/* ============================================================
 *  2b. 难度模式
 *  简单：老一套，抛物线跳跃 + 落点预览，平台宽、有救援余量。
 *  困难：取消抛物线 —— 起跳后贴着柱子顶面直线冲刺，冲到点就落，
 *        冲进缝里就掉；平台更窄、间距更大、没有落点预览、额外 +1 分。
 *  判定逻辑两套模式共用（resolveLanding），只是「什么时候落」不一样。
 * ============================================================ */
const MODES = {
  easy: {
    id: 'easy', name: '简单', sub: '抛物线跳跃', color: '#7ee9a8',
    arc: true,          // true = 抛物线，false = 直线冲刺
    preview: true,      // 蓄力时是否画完整落点预览
    bonus: 0,           // 每次落地额外加分
    mercyPx: 7,         // 边缘救援半径
    perfectR: 0.12,     // 完美判定半径 = 平台宽 × 比例
    widthMul: 1, gapMul: 1,
    springChance: 0.16, swayChance: 0.17
  },
  hard: {
    id: 'hard', name: '困难', sub: '直线冲刺', color: '#ffb060',
    arc: false,
    preview: false,
    bonus: 1,
    mercyPx: 1.5,
    perfectR: 0.09,
    widthMul: 0.84, gapMul: 1.14,
    springChance: 0.10, swayChance: 0.30
  }
};
const MODE_LIST = ['easy', 'hard'];
function MODE() { return MODES[modeKey] || MODES.easy; }

/* ============================================================
 *  2c. 皮肤
 *  每个皮肤只描述外观，绘制逻辑在 buildPlayerSprite / drawPlayer 里参数化。
 *  unlock = 历史最高分解锁（两种模式的最高分取大）。
 * ============================================================ */
const SKINS = [
  {
    id: 'orange', name: '森林橘', unlock: 0,
    body: ['#ff9a72', '#ef5f3c'], belly: 'rgba(255,255,255,0.28)',
    band: ['#e8543f', '#ffb3a3'], cheek: 'rgba(255,130,110,0.42)',
    ear: ['#ff9a72', '#ffc9b2'], ears: 'round', pattern: 'belt',
    face: '#ffd9c0', hat: null,
    eye: '#2b2320', trail: '#ffb08c', glow: null
  },
  {
    id: 'mint', name: '薄荷青', unlock: 0,
    body: ['#8ef0c8', '#2fa87e'], belly: 'rgba(255,255,255,0.34)',
    band: ['#2a8f74', '#9ff5d4'], cheek: 'rgba(80,220,180,0.32)',
    ear: ['#8ef0c8', '#dcfff2'], ears: 'leaf', pattern: 'belt',
    face: '#dbfff2', hat: null,
    eye: '#10382f', trail: '#9ff5d4', glow: null
  },
  {
    id: 'bee', name: '小蜜蜂', unlock: 15,
    body: ['#ffe066', '#f0b400'], belly: 'rgba(255,255,255,0.20)',
    band: ['#33302a', '#57503f'], cheek: 'rgba(255,170,60,0.34)',
    ear: ['#ffe066', '#fff6bd'], ears: 'antenna', pattern: 'stripe',
    face: '#fff3bd', hat: null,
    eye: '#2b2320', trail: '#ffe066', glow: 'rgba(255,225,90,0.18)'
  },
  {
    id: 'snow', name: '小雪人', unlock: 30,
    body: ['#ffffff', '#c6dff2'], belly: 'rgba(150,200,235,0.30)',
    band: ['#7fbde6', '#e8f6ff'], cheek: 'rgba(255,150,170,0.28)',
    ear: ['#ffffff', '#eef8ff'], ears: 'round', pattern: 'belt',
    face: '#ffffff', hat: 'beanie',
    eye: '#1e3b4a', trail: '#dbeeff', glow: 'rgba(190,230,255,0.20)'
  },
  {
    id: 'ninja', name: '夜行者', unlock: 50,
    body: ['#5f6779', '#282d3b'], belly: 'rgba(255,255,255,0.13)',
    band: ['#d94f4f', '#ff9a9a'], cheek: 'rgba(190,100,100,0.22)',
    ear: ['#4a5163', '#6f7889'], ears: 'round', pattern: 'belt',
    face: '#98a2b6', hat: 'band',
    eye: '#ffd54f', trail: '#9fb4d8', glow: 'rgba(120,150,200,0.16)'
  },
  {
    id: 'gold', name: '黄金甲', unlock: 80,
    body: ['#ffe28a', '#d99a16'], belly: 'rgba(255,255,255,0.32)',
    band: ['#a96b0b', '#fff2b8'], cheek: 'rgba(255,180,60,0.34)',
    ear: ['#ffe28a', '#fff6c8'], ears: 'round', pattern: 'belt',
    face: '#fff3c8', hat: 'crown',
    eye: '#4a2c05', trail: '#ffe9a8', glow: 'rgba(255,210,80,0.24)'
  }
];
const SKIN_TAU = Math.PI * 2;
function skinById(id) {
  for (let i = 0; i < SKINS.length; i++) if (SKINS[i].id === id) return SKINS[i];
  return null;
}
function SKIN() { return skinById(skinId) || SKINS[0]; }
function skinUnlocked(sk) { return !!sk && overallBest() >= (sk.unlock || 0); }

/* ============================================================
 *  在线排行榜配置
 *  1) 把服务端跑起来（示例见随附的 leaderboard-server-example.js）
 *  2) 把下面的 url 换成你的地址，enabled 改成 true
 *  协议：GET  返回 { "scores": [ { "name": "小明", "score": 42, "at": 1699999999999 } ] }
 *        POST 提交 { "name": "小明", "score": 42, "at": 1699999999999 }
 *  没配置时一切照旧，只用本机榜，不会报错也不会卡顿
 * ============================================================ */
const ONLINE = {
  enabled: false,
  url: '',
  timeoutMs: 4500
};

/* 不想改代码的话：用 ?api=你的地址 打开一次页面，地址就会记在本地，
   以后直接打开也能用。例如 index.html?api=https://xxx.workers.dev/board */
try {
  if (typeof location !== 'undefined' && location.search) {
    const m = /[?&]api=([^&]+)/.exec(location.search);
    if (m) localStorage.setItem('jf_api', decodeURIComponent(m[1]));
  }
  const savedApi = localStorage.getItem('jf_api');
  if (savedApi && /^https?:\/\//.test(savedApi)) {
    ONLINE.url = savedApi;
    ONLINE.enabled = true;
  }
} catch (e) {}

/* ============================================================
 *  3. 工具 & 屏幕方向
 * ============================================================ */
/* ---- 随机源：普通局用 Math.random，每日挑战换成固定种子 ---- */
/* 平台生成、弹簧/摆柱概率都走这里，所以「同一串种子 = 同一套平台」。
   粒子、落叶这些纯视觉的随机也顺便跟着走，省得两套随机源打架。 */
let rng = Math.random;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
/* key 为空 → Math.random（普通局）；给了 key → 同一天所有人拿到同一套平台 */
function setRunRng(key) { rng = key ? mulberry32(hashSeed('jf-daily|' + key)) : Math.random; }

function rand(a, b) { return a + rng() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* 字体字符串缓存：避免每帧拼字符串 + 重复解析 */
const FONT_FAMILY = '"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif';
const fontCache = Object.create(null);
function fontOf(size, weight) {
  const px = Math.round(size);
  const key = (weight || '') + px;
  let f = fontCache[key];
  if (f === undefined) {
    f = (weight ? weight + ' ' : '') + px + 'px ' + FONT_FAMILY;
    fontCache[key] = f;
  }
  return f;
}

/* UI 整体缩放：小屏不至于糊住画面，大屏不至于太小 */
function uiScale() { return clamp(Math.min(W, H) / 400, 0.82, 1.15); }
function rnd(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function isLandscape() { return W > H; }

function topY() {
  if (isLandscape()) {
    return Math.min(H * 0.70, H - 90);
  }
  return Math.max(H * 0.5, Math.min(H * 0.72, H - 140));
}

function camAnchor() {
  return isLandscape() ? 0.26 : 0.32;
}

function getBtnRadius() {
  return isLandscape() ? 17 : 20;
}

function makeLayerCanvas(w, h, scale) {
  const c = document.createElement('canvas');
  const d = Math.min(DPR, scale || 1.5);
  c.width = Math.max(1, Math.ceil(w * d));
  c.height = Math.max(1, Math.ceil(h * d));
  const g = c.getContext('2d');
  g.scale(d, d);
  return { c: c, g: g, w: w, h: h };
}

// 颜色插值（用于昼夜渐变）
function lerpHex(a, b, t) {
  const na = parseInt(a.slice(1), 16);
  const nb = parseInt(b.slice(1), 16);
  const ar = (na >> 16) & 255, ag = (na >> 8) & 255, ab = na & 255;
  const br = (nb >> 16) & 255, bg = (nb >> 8) & 255, bb = nb & 255;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

/* ============================================================
 *  4. 触觉反馈
 * ============================================================ */
let hapticsOn = true;
try { hapticsOn = localStorage.getItem('jf_haptic') !== '0'; } catch (e) {}

function vibrate(ms) {
  if (!hapticsOn) return;
  if (navigator.vibrate) {
    try { navigator.vibrate(ms); } catch (e) {}
  }
}

function setHaptics(on) {
  hapticsOn = !!on;
  try { localStorage.setItem('jf_haptic', hapticsOn ? '1' : '0'); } catch (e) {}
  if (hapticsOn) vibrate(12);
}

/* ============================================================
 *  5. 音效
 * ============================================================ */
let actx = null, chargeOsc = null, chargeGain = null, muted = false;
try { muted = localStorage.getItem('jf_mute') === '1'; } catch (e) {}

function setMuted(on) {
  muted = !!on;
  try { localStorage.setItem('jf_mute', muted ? '1' : '0'); } catch (e) {}
  if (muted) stopChargeSound();
}

function ensureAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume().catch(function () {});
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { actx = new AC(); } catch (e) { actx = null; }
}

function beep(freq, dur, type, vol, slideTo, delay) {
  if (!actx || muted) return;
  try {
    const t0 = actx.currentTime + (delay || 0);
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  } catch (e) {}
}

function startChargeSound() {
  if (!actx || muted) return;
  stopChargeSound();
  try {
    const t = actx.currentTime;
    chargeOsc = actx.createOscillator();
    chargeGain = actx.createGain();
    chargeOsc.type = 'sine';
    chargeOsc.frequency.setValueAtTime(160, t);
    chargeGain.gain.setValueAtTime(0.0001, t);
    chargeGain.gain.linearRampToValueAtTime(0.045, t + 0.06);
    chargeOsc.connect(chargeGain).connect(actx.destination);
    chargeOsc.start(t);
  } catch (e) { chargeOsc = null; chargeGain = null; }
}

function setChargeFreq(c) {
  if (!chargeOsc || !actx) return;
  try { chargeOsc.frequency.setTargetAtTime(160 + c * 620, actx.currentTime, 0.04); } catch (e) {}
}

function stopChargeSound() {
  if (!chargeOsc || !actx) { chargeOsc = null; chargeGain = null; return; }
  try {
    const t = actx.currentTime;
    chargeGain.gain.cancelScheduledValues(t);
    chargeGain.gain.setValueAtTime(Math.max(0.0001, chargeGain.gain.value), t);
    chargeGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    chargeOsc.stop(t + 0.09);
  } catch (e) {}
  chargeOsc = null;
  chargeGain = null;
}

const COMBO_SCALE = [880, 988, 1047, 1175, 1319, 1480, 1661, 1760];
function comboNote(c) {
  return COMBO_SCALE[Math.min(Math.max(c - 1, 0), COMBO_SCALE.length - 1)];
}

/* ============================================================
 *  6. 对象池
 * ============================================================ */
const particlePool = [];
const popupPool = [];
const ringPool = [];

function acquireParticle() { return particlePool.pop() || {}; }
function releaseParticle(p) { if (particlePool.length < CFG.poolMax) particlePool.push(p); }
function acquirePopup() { return popupPool.pop() || {}; }
function releasePopup(p) { if (popupPool.length < CFG.poolMax) popupPool.push(p); }
function acquireRing() { return ringPool.pop() || {}; }
function releaseRing(p) { if (ringPool.length < CFG.poolMax) ringPool.push(p); }

/* ============================================================
 *  7. 性能自适应
 * ============================================================ */
let perfLevel = 0;
let perfSum = 0, perfCount = 0, perfStart = 0, perfHold = 0;

const RES_SCALE = [1, 0.82, 0.68];   // 三档渲染分辨率

function applyPerfLevel() {
  const target = RES_SCALE[perfLevel];
  if (Math.abs(target - resScale) < 0.001) return;
  resScale = target;
  resizeCanvas();
  // 只重建真正跟分辨率绑定的精灵。
  // 以前这里整场 buildScene()：树林/山丘是几张上千像素长的画布，
  // 偏偏在设备已经开始掉帧的那一刻去重建，越卡越卡。
  playerSprite = buildPlayerSprite();
  cloudSprite = buildCloudSprite();
  platSpriteCache.clear();
  pauseSnap = null;                  // 分辨率变了，快照作废
  if (player && player.state === 'idle') player.y = topY();
}

function updatePerf(now, dt) {
  if (perfStart === 0) perfStart = now;
  perfSum += dt;
  perfCount++;
  if (now - perfStart < 2000) return;

  const avg = perfCount > 12 ? perfSum / perfCount : 0;
  if (perfHold > 0) {
    perfHold--;
  } else if (avg > 0.027 && perfLevel < 2) {
    perfLevel++;
    perfHold = 2;                     // 降级后先观察两轮，避免来回抖动
    applyPerfLevel();
  } else if (avg < 0.0145 && perfLevel > 0) {
    perfLevel--;
    perfHold = 2;
    applyPerfLevel();
  }
  perfSum = 0; perfCount = 0; perfStart = now;
}

/* ============================================================
 *  7b. 帧率显示
 *  fpsMode：0 隐藏 / 1 只显示 FPS / 2 FPS + 单帧耗时(ms)
 *  点 HUD 右上角的胶囊切换，设置面板里也能开关，选择记在本机。
 * ============================================================ */
const FPS_KEY = 'jf_fps_v1';
let fpsMode = 1;                 // 默认开着：这一版就是把帧率显示出来
try {
  const v = parseInt(localStorage.getItem(FPS_KEY), 10);
  if (v === 0 || v === 1 || v === 2) fpsMode = v;
} catch (e) {}
let fpsSmooth = 60, fpsFrameMs = 16.7;
let fpsShown = 60, fpsMsShown = 16.7, fpsSampleAt = 0;

function setFpsMode(m) {
  fpsMode = (m === 0 || m === 1 || m === 2) ? m : 1;
  try { localStorage.setItem(FPS_KEY, String(fpsMode)); } catch (e) {}
}

/* 用真实帧间隔做两次指数平滑：一次给 FPS，一次给毫秒。
   用平滑值而不是「这一帧多少」—— 屏幕刷新时掉一帧就跳红字，太神经质。 */
function sampleFps(now, dt) {
  if (dt > 0 && dt < 2) {
    const ms = dt * 1000;
    fpsFrameMs += (ms - fpsFrameMs) * 0.12;
    fpsSmooth += (1000 / ms - fpsSmooth) * 0.10;
  }
  if (now - fpsSampleAt > 240) {
    fpsSampleAt = now;
    fpsShown = Math.round(fpsSmooth);
    fpsMsShown = fpsFrameMs;
  }
}

function fpsColor() {
  if (fpsShown >= 55) return '#9ef07a';
  if (fpsShown >= 40) return '#ffd93b';
  return '#ff8a72';
}

function particleCap() {
  return perfLevel >= 2 ? 70 : (perfLevel >= 1 ? 150 : 260);
}
function fireflyTarget() {
  return perfLevel >= 2 ? 8 : (perfLevel >= 1 ? 12 : CFG.fireflyBase);
}

/* ============================================================
 *  8. 预渲染资源
 * ============================================================ */
let skyGrad = null, groundGrad = null, sunGrad = null, fogGrad = null;
let sunX = 0, sunY = 0, sunR = 0;
let sunCoreColor = '#fff8d0';
let hillFar = null, hillNear = null;
let treeFar = null, treeMid = null;
let groundTex = null, glowSprite = null;
let playerSprite = null, cloudSprite = null;
let vignette = null, starField = null, fgLayer = null;
let raySprite = null, shadowSprite = null;

function drawPineOn(g, x, baseY, h, color, trunk) {
  const w = h * 0.52;
  g.fillStyle = trunk;
  g.fillRect(x - h * 0.034, baseY - h * 0.26, h * 0.068, h * 0.26 + 1);
  g.fillStyle = color;
  const L = [
    [baseY - h * 0.16, baseY - h * 0.60, w],
    [baseY - h * 0.42, baseY - h * 0.83, w * 0.76],
    [baseY - h * 0.63, baseY - h * 1.00, w * 0.52]
  ];
  for (let i = 0; i < 3; i++) {
    const yb = L[i][0], yt = L[i][1], ww = L[i][2];
    g.beginPath();
    g.moveTo(x, yt);
    g.lineTo(x - ww / 2, yb);
    g.lineTo(x + ww / 2, yb);
    g.closePath();
    g.fill();
  }
}

function buildTreeLayer(spacing, hMin, hMax, color, trunk, seed) {
  const count = Math.max(4, Math.round(1600 / spacing));
  const stripW = spacing * count;
  const stripH = Math.ceil(hMax + 22);
  const L = makeLayerCanvas(stripW, stripH, 1.5);
  const g = L.g;
  const halfW = hMax * 0.26 + 6;
  const span = Math.max(1, stripW - halfW * 2);
  for (let i = 0; i < count; i++) {
    const r1 = rnd(i * 1.37 + seed);
    const r2 = rnd(i * 3.11 + seed);
    const x = halfW + ((i + 0.25 + r1 * 0.5) / count) * span;
    const h = hMin + r2 * (hMax - hMin);
    drawPineOn(g, x, stripH, h, color, trunk);
  }
  return { c: L.c, w: stripW, h: stripH };
}

function buildHillLayer(stripW, amp, ks, color) {
  const yMid = amp * 1.6;
  const h = Math.ceil(amp * 2.2);
  const L = makeLayerCanvas(stripW, h, 1.2);
  const g = L.g;
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(0, h);
  for (let x = 0; x <= stripW; x += 5) {
    const u = x / stripW;
    const v = Math.sin(u * Math.PI * 2 * ks[0]) * 0.5 +
              Math.sin(u * Math.PI * 2 * ks[1] + 1.7) * 0.3 +
              Math.sin(u * Math.PI * 2 * ks[2] + 0.9) * 0.12 + 0.55;
    g.lineTo(x, yMid - v * amp);
  }
  g.lineTo(stripW, h);
  g.closePath();
  g.fill();
  return { c: L.c, w: stripW, h: h, yMid: yMid };
}

function buildGroundTexture() {
  const s = 512;
  const L = makeLayerCanvas(s, s, 1.5);
  const g = L.g;
  for (let i = 0; i < 80; i++) {
    const x = rnd(i * 3.1 + 0.5) * s;
    const y = rnd(i * 7.7 + 1.2) * s;
    const r = 3 + rnd(i * 9.3 + 2.6) * 6;
    g.fillStyle = 'rgba(30, 80, 42, 0.18)';
    g.beginPath();
    g.ellipse(x, y, r * 1.7, r * 0.65, 0, 0, Math.PI * 2);
    g.fill();
  }
  g.strokeStyle = 'rgba(24, 62, 34, 0.30)';
  g.lineWidth = 2;
  g.lineCap = 'round';
  for (let i = 0; i < 30; i++) {
    const x = rnd(i * 5.3 + 3.1) * s;
    const y = rnd(i * 11.1 + 4.7) * s;
    g.beginPath();
    g.moveTo(x, y + 12);
    g.quadraticCurveTo(x + 4, y, x + 10, y - 8);
    g.stroke();
  }
  return { c: L.c, s: s };
}

function buildGlowSprite() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0.00, 'rgba(255, 253, 225, 0.55)');
  rg.addColorStop(0.35, 'rgba(255, 248, 195, 0.22)');
  rg.addColorStop(1.00, 'rgba(255, 248, 195, 0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, s, s);
  return c;
}

/* 云朵精灵：预渲染一朵标准云，运行时缩放绘制 */
function buildCloudSprite() {
  const d = Math.min(DPR, 2);
  const size = 180;
  const c = document.createElement('canvas');
  c.width = Math.ceil(size * d);
  c.height = Math.ceil(size * d);
  const g = c.getContext('2d');
  g.scale(d, d);

  const cx = size / 2;
  const cy = size / 2;
  const r = 44;

  g.fillStyle = '#ffffff';
  g.beginPath();
  g.arc(cx, cy, r * 0.62, 0, Math.PI * 2);
  g.arc(cx + r * 0.58, cy - r * 0.12, r * 0.46, 0, Math.PI * 2);
  g.arc(cx - r * 0.58, cy - r * 0.08, r * 0.42, 0, Math.PI * 2);
  g.arc(cx + r * 0.06, cy - r * 0.36, r * 0.46, 0, Math.PI * 2);
  g.fill();

  return { c: c, size: size, baseR: r };
}

/* 暗角：半分辨率即可（本身就是软渐变），每帧只需一次 drawImage */
function buildVignette() {
  const w = Math.max(2, Math.round(W * 0.5));
  const h = Math.max(2, Math.round(H * 0.5));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.scale(w / W, h / H);
  const rg = g.createRadialGradient(
    W * 0.5, H * 0.46, Math.min(W, H) * 0.20,
    W * 0.5, H * 0.50, Math.max(W, H) * 0.80
  );
  rg.addColorStop(0.00, 'rgba(8, 26, 16, 0)');
  rg.addColorStop(0.62, 'rgba(8, 26, 16, 0.10)');
  rg.addColorStop(1.00, 'rgba(8, 26, 16, 0.38)');
  g.fillStyle = rg;
  g.fillRect(0, 0, W, H);
  return c;
}

/* 星空：黄昏后渐显，位置固定，只闪烁不移动 */
function buildStars() {
  const arr = [];
  const n = perfLevel >= 2 ? 24 : CFG.starCount;
  for (let i = 0; i < n; i++) {
    const r1 = rnd(i * 4.7 + 2.1);
    const r2 = rnd(i * 9.1 + 5.3);
    const r3 = rnd(i * 2.3 + 7.7);
    arr.push({
      x: r1 * W,
      y: (0.04 + r2 * 0.46) * H,
      r: 0.6 + r3 * 1.6,
      ph: r1 * Math.PI * 2
    });
  }
  return arr;
}

/* 角色精灵：头 + 身体 + 五官底盘（瞳孔和四肢每帧画，见 drawHeroLimbs / drawHeroFace）。
   皮肤只换配色和头顶零件，轮廓保持一致，所以跳跃、挤压、旋转的手感对所有皮肤都一样。
   画布按 2~3 倍 DPR 烘焙，缩放之后轮廓也不糊。 */
function buildPlayerSprite() {
  const s = SKIN();
  const d = Math.max(2, Math.min(3, DPR * 1.6));
  const minX = -24, maxX = 24, minY = -62, maxY = 2;
  const w = maxX - minX, h = maxY - minY;
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * d);
  c.height = Math.ceil(h * d);
  const g = c.getContext('2d');
  g.scale(d, d);
  g.translate(-minX, -minY);
  g.lineJoin = 'round';
  g.lineCap = 'round';

  const light = s.body[0], dark = s.body[1];
  const face = s.face || '#ffe0c8';
  const deep = lerpHex(dark, '#000000', 0.42);

  /* ---------- 1. 头后面的零件：耳朵 / 叶子 / 触角 ---------- */
  if (s.ears === 'round' || s.ears === 'leaf') {
    const onlyRight = s.ears === 'leaf';   // 叶子皮肤左边换叶子，只留右耳
    for (let i = onlyRight ? 1 : 0; i < 2; i++) {
      const ex = (i === 0 ? -1 : 1) * 13.2;
      g.fillStyle = s.ear[0];
      g.beginPath();
      g.ellipse(ex, -41, 5.7, 6.1, 0, 0, SKIN_TAU);
      g.fill();
      g.fillStyle = s.ear[1];
      g.beginPath();
      g.ellipse(ex, -41, 2.8, 3.2, 0, 0, SKIN_TAU);
      g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.12)';
      g.lineWidth = 1;
      g.beginPath();
      g.ellipse(ex, -41, 5.4, 5.8, 0, 0, SKIN_TAU);
      g.stroke();
    }
  }

  if (s.ears === 'leaf') {
    g.fillStyle = s.band[0];
    g.beginPath();
    g.moveTo(-4.6, -50);
    g.quadraticCurveTo(-17.5, -56.5, -9.4, -61);
    g.quadraticCurveTo(-2, -54.5, -4.6, -50);
    g.fill();
    g.fillStyle = 'rgba(255,255,255,0.34)';
    g.beginPath();
    g.moveTo(-5.4, -51.6);
    g.quadraticCurveTo(-10.4, -55.6, -8.2, -58.8);
    g.quadraticCurveTo(-6, -55, -5.4, -51.6);
    g.fill();
  }

  if (s.ears === 'antenna') {
    g.strokeStyle = s.band[0];
    g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(-6.4, -50);
    g.quadraticCurveTo(-9.4, -55, -10, -59);
    g.moveTo(6.4, -50);
    g.quadraticCurveTo(9.4, -55, 10, -59);
    g.stroke();
    g.fillStyle = s.ear[1];
    g.beginPath();
    g.arc(-10, -60.6, 3.2, 0, SKIN_TAU);
    g.arc(10, -60.6, 3.2, 0, SKIN_TAU);
    g.fill();
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath();
    g.arc(-10.9, -61.4, 1.1, 0, SKIN_TAU);
    g.arc(9.1, -61.4, 1.1, 0, SKIN_TAU);
    g.fill();
  }

  /* ---------- 2. 身体 ---------- */
  const bg = g.createLinearGradient(-9, -30, 9, -7);
  bg.addColorStop(0, lerpHex(light, '#ffffff', 0.18));
  bg.addColorStop(0.52, light);
  bg.addColorStop(1, dark);
  g.fillStyle = bg;
  rr(g, -11.8, -30.5, 23.6, 22.5, 9.5);
  g.fill();

  // 下缘压暗：重心落到脚上
  g.save();
  rr(g, -11.8, -30.5, 23.6, 22.5, 9.5);
  g.clip();
  const bs = g.createLinearGradient(0, -16, 0, -8);
  bs.addColorStop(0, 'rgba(0,0,0,0)');
  bs.addColorStop(1, 'rgba(0,0,0,0.22)');
  g.fillStyle = bs;
  g.fillRect(-12, -16, 24, 8.5);
  g.restore();

  // 肚子亮块
  g.fillStyle = s.belly;
  rr(g, -7.8, -27.8, 15.6, 10.2, 5.1);
  g.fill();

  /* 条纹（小蜜蜂）/ 腰带 */
  if (s.pattern === 'stripe') {
    g.save();
    rr(g, -11.8, -30.5, 23.6, 22.5, 9.5);
    g.clip();
    g.fillStyle = s.band[0];
    g.fillRect(-12, -20.6, 24, 4.8);
    g.fillRect(-12, -12.2, 24, 4.8);
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.fillRect(-12, -21.8, 24, 1.3);
    g.fillRect(-12, -13.4, 24, 1.3);
    g.restore();
  } else {
    g.fillStyle = s.band[0];
    rr(g, -12.8, -15, 25.6, 6.4, 3.2);
    g.fill();
    g.fillStyle = s.band[1];
    rr(g, -12.8, -15, 25.6, 2.1, 1.6);
    g.fill();
    g.fillStyle = lerpHex(s.band[1], '#ffffff', 0.35);
    rr(g, -2.8, -15.4, 5.6, 6.8, 1.8);
    g.fill();
    g.fillStyle = 'rgba(0,0,0,0.16)';
    rr(g, -1.5, -14, 3, 3.6, 1.2);
    g.fill();
  }

  /* ---------- 3. 头 ---------- */
  const hg = g.createRadialGradient(-5.5, -46, 2, -1, -39, 21);
  hg.addColorStop(0, lerpHex(light, '#ffffff', 0.36));
  hg.addColorStop(0.55, light);
  hg.addColorStop(1, dark);
  g.fillStyle = hg;
  g.beginPath();
  g.arc(0, -39, 14.6, 0, SKIN_TAU);
  g.fill();

  // 脖子交界处的阴影
  g.fillStyle = 'rgba(0,0,0,0.10)';
  g.beginPath();
  g.ellipse(0, -27.6, 8.4, 2.6, 0, 0, SKIN_TAU);
  g.fill();

  // 脸盘
  g.fillStyle = face;
  g.beginPath();
  g.ellipse(0, -36.6, 10.9, 9.7, 0, 0, SKIN_TAU);
  g.fill();

  /* ---------- 4. 五官底盘（瞳孔 / 眨眼每帧画） ----------
     注意：ellipse() 是接在当前路径后面的，两只眼睛画在同一个 path 里再 stroke()，
     中间会被一条直线连起来。所以这里每只眼睛都单独 beginPath。 */
  for (let i = 0; i < 2; i++) {
    const ex = i ? 5.4 : -5.4;
    g.beginPath();
    g.ellipse(ex, -38.8, 4.2, 4.9, 0, 0, SKIN_TAU);
    g.fillStyle = '#ffffff';
    g.fill();
    g.beginPath();
    g.ellipse(ex, -38.8, 4.2, 4.9, 0, 0, SKIN_TAU);
    g.strokeStyle = 'rgba(48,28,20,0.22)';
    g.lineWidth = 0.9;
    g.stroke();

    // 上眼睑的一层阴影：眼睛不至于像贴上去的贴纸
    g.save();
    g.beginPath();
    g.ellipse(ex, -38.8, 4.2, 4.9, 0, 0, SKIN_TAU);
    g.clip();
    const lid = g.createLinearGradient(0, -43.7, 0, -38.4);
    lid.addColorStop(0, 'rgba(72,42,30,0.30)');
    lid.addColorStop(1, 'rgba(72,42,30,0)');
    g.fillStyle = lid;
    g.fillRect(ex - 4.4, -43.9, 8.8, 5.8);
    g.restore();
  }

  // 鼻子：一个小鼻头，脸上才有起伏
  g.fillStyle = 'rgba(120,58,38,0.26)';
  g.beginPath();
  g.ellipse(0, -35.1, 1.8, 1.2, 0, 0, SKIN_TAU);
  g.fill();

  // 眉毛
  g.strokeStyle = deep;
  g.globalAlpha = 0.5;
  g.lineWidth = 1.5;
  g.beginPath();
  g.moveTo(-8.6, -45.8);
  g.quadraticCurveTo(-5.4, -47.6, -2.6, -45.9);
  g.moveTo(8.6, -45.8);
  g.quadraticCurveTo(5.4, -47.6, 2.6, -45.9);
  g.stroke();
  g.globalAlpha = 1;

  // 腮红
  g.fillStyle = s.cheek;
  g.beginPath();
  g.ellipse(-9.7, -33.4, 3.5, 2.3, 0, 0, SKIN_TAU);
  g.ellipse(9.7, -33.4, 3.5, 2.3, 0, 0, SKIN_TAU);
  g.fill();

  // 嘴
  g.strokeStyle = lerpHex(deep, '#000000', 0.15);
  g.lineWidth = 1.3;
  g.beginPath();
  g.arc(0, -32.8, 3.5, Math.PI * 0.18, Math.PI * 0.82);
  g.stroke();

  /* ---------- 5. 帽子 / 头巾 ---------- */
  if (s.hat === 'crown') {
    g.fillStyle = '#ffd94a';
    g.beginPath();
    g.moveTo(-7.6, -52.2);
    g.lineTo(-7.6, -57.6);
    g.lineTo(-3.2, -54.6);
    g.lineTo(0, -59.6);
    g.lineTo(3.2, -54.6);
    g.lineTo(7.6, -57.6);
    g.lineTo(7.6, -52.2);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(146,92,6,0.65)';
    g.lineWidth = 1;
    g.stroke();
    g.fillStyle = '#ff5f5f';
    g.beginPath();
    g.arc(0, -55.6, 1.6, 0, SKIN_TAU);
    g.fill();
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.beginPath();
    g.arc(-3.2, -55.4, 1, 0, SKIN_TAU);
    g.arc(3.2, -55.4, 1, 0, SKIN_TAU);
    g.fill();
  } else if (s.hat === 'band') {
    g.fillStyle = s.band[0];
    rr(g, -14, -49.4, 28, 5.6, 2.8);
    g.fill();
    g.fillStyle = s.band[1];
    rr(g, -14, -49.4, 28, 1.8, 1.4);
    g.fill();
    g.strokeStyle = s.band[0];
    g.lineWidth = 2.2;
    g.beginPath();
    g.moveTo(13, -47.6);
    g.quadraticCurveTo(19.2, -45.2, 20.6, -40.2);
    g.moveTo(13, -46);
    g.quadraticCurveTo(18.2, -42.4, 18.8, -37.8);
    g.stroke();
  } else if (s.hat === 'beanie') {
    g.fillStyle = s.band[0];
    g.beginPath();
    g.arc(0, -45, 13, Math.PI * 1.02, Math.PI * 1.98);
    g.closePath();
    g.fill();
    g.fillStyle = s.band[1];
    rr(g, -14.2, -47.6, 28.4, 4.8, 2.4);
    g.fill();
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.arc(0, -58.4, 3.6, 0, SKIN_TAU);
    g.fill();
    g.fillStyle = 'rgba(190,225,255,0.75)';
    g.beginPath();
    g.arc(0, -58.4, 1.6, 0, SKIN_TAU);
    g.fill();
  }

  /* ---------- 6. 轮廓：下沿压暗，头才不会飘在身体上 ---------- */
  g.strokeStyle = 'rgba(88,38,22,0.20)';
  g.lineWidth = 2.6;
  g.beginPath();
  g.arc(0, -39, 13.3, Math.PI * 0.16, Math.PI * 0.84);
  g.stroke();

  if (!s.hat) {
    // 头顶一小撮呆毛
    g.strokeStyle = lerpHex(dark, '#000000', 0.12);
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(-1.6, -52.7);
    g.quadraticCurveTo(1.2, -56.4, 4.2, -54.4);
    g.stroke();
  }

  /* ---------- 7. 高光 & 轮廓光 ---------- */
  if (!s.hat) {
    g.fillStyle = 'rgba(255,255,255,0.32)';
    g.beginPath();
    g.ellipse(-5.8, -48, 4.6, 2.7, -0.55, 0, SKIN_TAU);
    g.fill();
  }
  g.strokeStyle = 'rgba(255,255,255,0.30)';
  g.lineWidth = 1.7;
  g.beginPath();
  g.arc(0, -39, 13.8, Math.PI * 1.06, Math.PI * 1.60);
  g.stroke();

  return { c: c, minX: minX, minY: minY, w: w, h: h };
}


/* 根据 dayT 重建天空与太阳，仅在天色变化显著时调用 */
function rebuildSky() {
  const t = dayT;
  const land = isLandscape();

  const c0 = lerpHex('#79c6e8', '#f0a878', t);
  const c1 = lerpHex('#a9ddec', '#f8c890', t);
  const c2 = lerpHex('#cfe9d4', '#fce0b8', t);
  const c3 = lerpHex('#e6f2cf', '#fdf2d8', t);

  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0.00, c0);
  skyGrad.addColorStop(0.35, c1);
  skyGrad.addColorStop(0.65, c2);
  skyGrad.addColorStop(1.00, c3);

  sunX = W * (land ? 0.82 : 0.78);
  sunY = H * (land ? 0.20 : 0.14);
  sunR = Math.min(W, H) * 0.06 + (land ? 16 : 24);
  sunCoreColor = lerpHex('#fff8d0', '#ffc060', t);

  sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 3.6);
  sunGrad.addColorStop(0.00, 'rgba(255, 248, 200, 0.95)');
  sunGrad.addColorStop(0.30, 'rgba(255, 240, 170, 0.42)');
  sunGrad.addColorStop(1.00, 'rgba(255, 240, 170, 0)');
}

/* 最前景的草丛剪影：视差比树林更快，画面一下就有纵深了 */
function buildForeground() {
  const h = Math.max(34, Math.min(96, H * 0.14));
  const stripW = 1200;
  const L = makeLayerCanvas(stripW, h, 1.4);
  const g = L.g;
  const n = 52;
  for (let i = 0; i < n; i++) {
    const x = (i + rnd(i * 2.7 + 1.3) * 0.9) * (stripW / n);
    const hh = h * (0.40 + rnd(i * 5.1 + 2.9) * 0.60);
    const bw = 6 + rnd(i * 8.3 + 4.1) * 12;
    const lean = (rnd(i * 3.3 + 6.7) - 0.5) * 0.55;
    const a = 0.60 + rnd(i * 6.1 + 5.5) * 0.32;
    g.fillStyle = 'rgba(16, 40, 24, ' + a.toFixed(2) + ')';
    g.beginPath();
    g.moveTo(x - bw / 2, h + 2);
    g.quadraticCurveTo(x - bw * 0.2 + lean * 30, h - hh * 0.58, x + lean * 40, h - hh);
    g.quadraticCurveTo(x + bw * 0.24 + lean * 28, h - hh * 0.55, x + bw / 2, h + 2);
    g.closePath();
    g.fill();
  }
  return { c: L.c, w: stripW, h: h };
}

function drawForeground() {
  if (!fgLayer) return;
  let off = (camX * 1.25) % fgLayer.w;
  if (off < 0) off += fgLayer.w;
  const top = H - fgLayer.h;
  for (let x = -off; x < W; x += fgLayer.w) {
    ctx.drawImage(fgLayer.c, x, top, fgLayer.w, fgLayer.h);
  }
}

/* 太阳光芒：一次性烘一张放射状光带，运行时只转个角度、换个透明度。
   比每帧画十几条 stroke 便宜得多，也不会在低端机上掉帧。 */
function buildSunRays() {
  const R = 200;
  const c = document.createElement('canvas');
  c.width = c.height = R * 2;
  const g = c.getContext('2d');
  g.translate(R, R);
  const n = 18;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rnd(i * 1.7) * 0.1;
    const len = R * (0.52 + rnd(i * 3.9 + 1.1) * 0.46);
    const halfTan = Math.tan(0.022 + rnd(i * 6.3 + 2.2) * 0.05);
    g.save();
    g.rotate(a);
    const grd = g.createLinearGradient(14, 0, len, 0);
    grd.addColorStop(0.00, 'rgba(255, 250, 214, 0)');
    grd.addColorStop(0.30, 'rgba(255, 247, 190, 0.62)');
    grd.addColorStop(1.00, 'rgba(255, 240, 170, 0)');
    g.fillStyle = grd;
    g.beginPath();
    g.moveTo(12, 0);
    g.lineTo(len, halfTan * len);
    g.lineTo(len, -halfTan * len);
    g.closePath();
    g.fill();
    g.restore();
  }
  return { c: c, r: R };
}

/* 一块软阴影：柱子、角色都拿它当接触阴影，比纯色椭圆更像真的 */
function buildShadowSprite() {
  const s = 128;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0.00, 'rgba(0,0,0,0.46)');
  rg.addColorStop(0.48, 'rgba(0,0,0,0.20)');
  rg.addColorStop(1.00, 'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, s, s);
  return c;
}

/* 统一成 { s, t, n } 结构，好和本机榜共用一套绘制 */
function normalizeOnline(arr) {
  const out = [];
  for (let i = 0; i < arr.length && out.length < 10; i++) {
    const e = arr[i] || {};
    const sc = Number(e.score !== undefined ? e.score : e.s);
    if (!isFinite(sc) || sc <= 0) continue;
    const t = Number(e.at !== undefined ? e.at : e.t);
    const nm = String(e.name !== undefined ? e.name : (e.n || '玩家')).slice(0, 12);
    out.push({ s: Math.round(sc), t: isFinite(t) ? t : 0, n: nm || '玩家' });
  }
  out.sort(function (a, b) { return b.s - a.s; });
  return out;
}

function onlineTimeoutSignal() {
  if (typeof AbortController === 'undefined') return { signal: undefined, clear: function () {} };
  const ctrl = new AbortController();
  const timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, ONLINE.timeoutMs);
  return { signal: ctrl.signal, clear: function () { clearTimeout(timer); } };
}

/* 提交本局成绩（不阻塞、失败也不提示，不影响游戏） */
function onlineSubmit() {
  if (!ONLINE.enabled || !ONLINE.url || typeof fetch !== 'function') return;
  try {
    const t = onlineTimeoutSignal();
    fetch(ONLINE.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: playerName, score: score, at: Date.now(), mode: modeKey }),
      signal: t.signal
    }).then(function () { t.clear(); }, function () { t.clear(); });
  } catch (e) {}
}

function onlineLoad() {
  if (!ONLINE.enabled || !ONLINE.url || typeof fetch !== 'function') {
    onlineState = 'off';
    return;
  }
  if (onlineState === 'loading') return;
  onlineState = 'loading';
  onlineMsg = '';
  try {
    const t = onlineTimeoutSignal();
    fetch(ONLINE.url, { method: 'GET', signal: t.signal })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        t.clear();
        const arr = j && (j.scores || j.board || j.list);
        onlineList = normalizeOnline(Array.isArray(arr) ? arr : []);
        onlineState = onlineList.length ? 'ok' : 'ok';
        onlineMsg = '';
      })
      .catch(function () {
        t.clear();
        onlineState = 'error';
        onlineMsg = '连不上服务器';
      });
  } catch (e) {
    onlineState = 'error';
    onlineMsg = '请求失败';
  }
}

}

/* ---- 全屏 + 横屏锁定 ---- */
/* 在 APK 外壳（WebView）里，Fullscreen API 是废的，screen.orientation.lock() 也就跟着
   永远失败，横屏按钮点了没反应。外壳会注入 window.GameShell，遇到它就把「横屏 + 藏
   状态栏」整个交给原生 Activity 去做；浏览器里还是走原来的全屏 API。 */
const shell = (typeof window !== "undefined" && window.GameShell) || null;
const shellCanOrient = !!(shell && typeof shell.setGameMode === 'function');
let shellGameMode = false;

function isFullscreen() {
  if (shellCanOrient) return shellGameMode;
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function lockLandscape() {
  // 安卓 Chrome 只有在全屏下才允许锁方向；不支持的浏览器静默跳过
  const so = screen.orientation;
  if (so && typeof so.lock === 'function') {
    try { const p = so.lock('landscape'); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
}

function toggleFullscreen() {
  // 外壳里：真正的横屏
  if (shellCanOrient) {
    shellGameMode = !shellGameMode;
    try { shell.setGameMode(shellGameMode); } catch (e) { shellGameMode = false; }
    scheduleResize();     // 转屏后窗口尺寸会变，先自己重排一次，不等 resize 事件
    beep(shellGameMode ? 720 : 520, 0.08, 'sine', 0.10);
    return;
  }
  if (isFullscreen()) {
    try {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch (e) {}
    try {
      const p = document.exitFullscreen
        ? document.exitFullscreen()
        : (document.webkitExitFullscreen && document.webkitExitFullscreen());
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
    return;
  }
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn) return;
  try {
    const p = fn.call(el, { navigationUI: 'hide' });
    if (p && p.then) p.then(lockLandscape).catch(function () {});
    else lockLandscape();
  } catch (e) {}
}

/* 同一天 → 同一个种子 → 同一套平台，大家比的是同一条赛道。
   难度按日期里的数字之和轮换（不看时区），所以不同国家的玩家也不会一个人跑简单、
   一个人跑困难。 */
const DAILY_KEY = 'jf_daily_v1';
let dailyKey = null;        // 非空 = 当前这局是每日挑战（值就是 YYYY-MM-DD）
let dailyBest = 0;          // 今天已经打出来的最好成绩

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function dayKeyOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayKey() { return dayKeyOf(new Date()); }

function dailyModeOf(key) {
  let sum = 0;
  for (let i = 0; i < key.length; i++) {
    const c = key.charCodeAt(i);
    if (c >= 48 && c <= 57) sum += c - 48;
  }
  return sum % 2 === 0 ? 'easy' : 'hard';
}

function loadDailyRecord() {
  dailyBest = 0;
  try {
    const j = JSON.parse(localStorage.getItem(DAILY_KEY) || 'null');
    if (j && j.d === todayKey() && typeof j.b === 'number' && isFinite(j.b)) dailyBest = j.b;
  } catch (e) {}
}
function saveDailyRecord() {
  try {
    localStorage.setItem(DAILY_KEY, JSON.stringify({ d: todayKey(), b: dailyBest }));
  } catch (e) {}
}

/* 进每日挑战：换到当天难度 + 用当天种子重开一局 */
function startDaily(keyOpt) {
  const key = keyOpt || todayKey();
  dailyKey = key;
  modeKey = dailyModeOf(key);
  try { localStorage.setItem('jf_mode', modeKey); } catch (e) {}
  best = bestOfMode(modeKey);
  loadDailyRecord();
  settingsOpen = false; boardOpen = false; achOpen = false;
  reset();
  const M = MODE();
  spawnPopup(camX + W / 2, topY() - 168, '每日挑战 · ' + key, '#ffd93b', 15);
  spawnPopup(camX + W / 2, topY() - 138, M.name + '物理 · 同一套平台', 'rgba(255,255,255,0.92)', 13);
  beep(660, 0.09, 'sine', 0.10);
  beep(990, 0.13, 'sine', 0.08, null, 0.08);
  vibrate(12);
}

function exitDaily() {
  if (!dailyKey) return;
  dailyKey = null;
  settingsMsg = '已退出每日挑战';
  settingsMsgAt = performance.now();
}

  { id: 'perfect50',  name: '妙手回春',   desc: '累计 50 次完美落地', test: function () { return STATS.perfects >= 50; } }
];

let achOpen = false;

function achCount() {
  let n = 0;
  for (let i = 0; i < ACHS.length; i++) if (achUnlocked[ACHS[i].id]) n++;
  return n;
}

/* 解锁检查：落地/结束时都调一次，条件满足就弹条并落盘 */
function checkAch() {
  let first = null, got = 0;
  for (let i = 0; i < ACHS.length; i++) {
    const a = ACHS[i];
    if (achUnlocked[a.id]) continue;
    let ok = false;
    try { ok = !!a.test(); } catch (e) { ok = false; }
    if (!ok) continue;
    achUnlocked[a.id] = true;
    got++;
    if (!first) first = a;
  }
  if (!got) return 0;
  saveAch();
  toast('成就解锁 · ' + first.name, got > 1 ? '一口气解锁了 ' + got + ' 个' : first.desc);
  vibrate([10, 40, 20]);
  beep(1046, 0.10, 'sine', 0.11);
  beep(1568, 0.16, 'sine', 0.09, null, 0.09);
  return got;
}

/* 顶部成就条：滑下来、停 2 秒、淡出 */
let toastTitle = '', toastSub = '', toastAt = 0;
function toast(t, s) { toastTitle = t; toastSub = s || ''; toastAt = performance.now(); }

function drawToast(now) {
  if (!toastTitle) return;
  const age = now - toastAt;
  if (age < 0) return;
  if (age > 3200) { toastTitle = ''; return; }

  const inA = clamp(age / 220, 0, 1);
  const outA = clamp((3200 - age) / 520, 0, 1);
  const k = uiScale();
  const tw = Math.min(W * 0.86, (toastSub ? 286 : 232) * k);
  const th = (toastSub ? 50 : 38) * k;
  const tx = W / 2 - tw / 2;
  const ty = safeTop + (10 + (1 - inA) * -42) * k;

  ctx.save();
  ctx.globalAlpha = Math.min(inA, outA);
  ctx.fillStyle = 'rgba(20, 44, 28, 0.94)';
  rr(ctx, tx, ty, tw, th, 13 * k);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,217,59,0.88)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffe57a';
  ctx.font = fontOf((toastSub ? 12.5 : 13.5) * k, 'bold');
  ctx.fillText('★ ' + toastTitle, W / 2, ty + th * (toastSub ? 0.34 : 0.5));
  if (toastSub) {
    ctx.fillStyle = 'rgba(255,255,255,0.80)';
    ctx.font = fontOf(10.5 * k);
    ctx.fillText(toastSub, W / 2, ty + th * 0.68);
  }
  ctx.restore();
}

/* ============================================================
 *  10. 平台
 * ============================================================ */
const PLAT_PAD = 14;          // 贴图左右留白
const PLAT_TOP_PAD = 16;      // 贴图顶部留白：给草丛用
const PLAT_BUCKET = 12;       // 宽度分桶粒度
const platSpriteCache = new Map();

/* 深度难度：30 分前是 0，之后到 150 分慢慢推到 1。
   原来 prog 在 30 分就封顶了，30 分之后每一跳的难度一模一样，高分区间很平。 */
function deepProg() {
  return clamp((score - 30) / 120, 0, 1);
}

/* 边缘救援半径：难度越高越不肯帮忙。
   判定和落点预览必须用同一个值，否则预览会骗人。 */
function mercyRadius() {
  return Math.max(0, MODE().mercyPx - deepProg() * 2.5);
}

/* 柱子在世界时间 t 的横坐标（静止柱子就是它自己） */
function platXAt(p, t) {
  return p.sway ? p.baseX + Math.sin(t * p.sway.spd + p.sway.ph) * p.sway.amp : p.x;
}

function makePlatform(last) {
  const prog = Math.min(score / 30, 1);
  const deep = deepProg();
  const M = MODE();

  // 连续失误时给一点手感补偿，别让人卡死在同一个距离上
  let help = 0;
  if (recentMisses >= 3) help = Math.min(0.16, (recentMisses - 2) * 0.05);

  const wMin = Math.max(38, 58 - prog * 14 - deep * 7) * (1 + help);
  const wMax = Math.max(52, 112 - prog * 44 - deep * 14) * (1 + help);
  // 困难模式整体收窄、间距拉长；救援半径也几乎为零，容错全压在手感上
  const w = Math.max(26, rand(wMin, wMax) * M.widthMul);
  const gMin = (58 + prog * 12 + deep * 16) * (1 - help);
  const gMax = Math.min(214, 148 + prog * 55 + deep * 14) * (1 - help);
  const gap = Math.min(268, rand(gMin, gMax) * M.gapMul);
  // 注意：这里刻意用 rng() 而不是 Math.random() —— 每日挑战要能复现同一套平台
  const isSpring = score >= 3 && rng() < M.springChance;
  // 会左右摆动的柱子：落点预览会按「落地那一刻」的位置算，所以不会骗人
  const sway = (!isSpring && score >= 22 && rng() < M.swayChance)
    ? {
        amp: 8 + prog * 8 + deep * 4,
        spd: 0.55 + rng() * 0.5,
        ph: rng() * Math.PI * 2
      }
    : null;
  const bx = last.baseX + last.w + gap;

  // 石砖柱：隔一根换一次材质（纯外观，物理完全一样）。
  // 用「数组里现在有几根」定位，所以每日挑战同一个种子长出来的砖柱位置也一样。
  // 注意先自增再判断：写成 platSeq++ && … 会因为短路让弹簧/摆柱不占序号，
  // 后面两根普通柱就可能撞成同一种材质（mode-test 里盯着这条）。
  const seq = platSeq++;
  const brick = !isSpring && !sway && (seq % 2 === 1);

  return {
    x: sway ? bx + Math.sin(moveT * sway.spd + sway.ph) * sway.amp : bx,
    baseX: bx,
    w: w,
    squash: 0,
    spring: isSpring,
    sway: sway,
    brick: brick,
    sprite: null,
    spriteH: 0,
    glow: 0
  };
}

function ensurePlatforms() {
  let last = platforms[platforms.length - 1];
  const limit = camX + W + 420;
  while (last.x < limit) {
    last = makePlatform(last);
    platforms.push(last);
  }
  const cut = camX - 420;
  while (platforms.length > 4 && platforms[0].x + platforms[0].w < cut) {
    platforms.shift();
  }
}

/* 柱子贴图：柱身材质 + 顶部盖板 + 侧面厚度 + 底部渐隐。
   宽度分桶缓存（getPlatformSprite），所以这里可以画得细一点。 */
function buildPlatformSprite(kind, bucket, columnH) {
  const isSpring = kind === 'spring';
  const isSway = kind === 'sway';
  const isBrick = kind === 'brick';
  const padX = 16;
  const top = PLAT_TOP_PAD + 2;
  const w = bucket + padX * 2;
  const h = columnH;
  const L = makeLayerCanvas(w, h + top, 1.4);
  const g = L.g;
  g.translate(0, top);
  const left = padX;
  const width = bucket;
  const right = left + width;
  const capH = 11;

  /* ---------- 1. 柱身主体 ---------- */
  const grd = g.createLinearGradient(left, 0, right, 0);
  if (isSpring) {
    grd.addColorStop(0.00, '#234f1e');
    grd.addColorStop(0.12, '#3f7b31');
    grd.addColorStop(0.34, '#63ab4a');
    grd.addColorStop(0.56, '#7cc45d');
    grd.addColorStop(0.80, '#478636');
    grd.addColorStop(1.00, '#1c401b');
  } else if (isSway) {
    grd.addColorStop(0.00, '#33474f');
    grd.addColorStop(0.12, '#5d7c85');
    grd.addColorStop(0.34, '#87aab2');
    grd.addColorStop(0.56, '#a3c6cc');
    grd.addColorStop(0.80, '#6b8c96');
    grd.addColorStop(1.00, '#2d4048');
  } else if (isBrick) {
    grd.addColorStop(0.00, '#4b4d46');
    grd.addColorStop(0.12, '#7d8077');
    grd.addColorStop(0.34, '#9fa298');
    grd.addColorStop(0.56, '#b2b5aa');
    grd.addColorStop(0.80, '#83867c');
    grd.addColorStop(1.00, '#43453f');
  } else {
    grd.addColorStop(0.00, '#452812');
    grd.addColorStop(0.12, '#74441f');
    grd.addColorStop(0.34, '#9a632f');
    grd.addColorStop(0.56, '#b37c44');
    grd.addColorStop(0.80, '#835027');
    grd.addColorStop(1.00, '#3d2210');
  }
  g.fillStyle = grd;
  g.fillRect(left, 0, width, h);

  g.save();
  g.beginPath();
  g.rect(left, 0, width, h);
  g.clip();

  /* ---------- 2. 材质纹理 ---------- */
  if (isSpring) {
    // 横向节环：像一截被压紧的弹簧
    for (let y = 26; y < h; y += 34) {
      g.strokeStyle = 'rgba(24, 62, 22, 0.34)';
      g.lineWidth = 2.4;
      g.beginPath();
      g.moveTo(left, y);
      g.quadraticCurveTo(left + width / 2, y + 5.5, right, y);
      g.stroke();
      g.strokeStyle = 'rgba(190, 240, 150, 0.24)';
      g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(left, y - 3);
      g.quadraticCurveTo(left + width / 2, y + 2.5, right, y - 3);
      g.stroke();
    }
  } else if (isSway) {
    // 拉丝金属：细密的竖向亮线 + 两道接缝 + 铆钉
    for (let i = 0; i < 26; i++) {
      const lx = left + rnd(i * 2.7 + bucket * 0.7) * width;
      g.strokeStyle = i % 3 === 0 ? 'rgba(255,255,255,0.10)' : 'rgba(20, 44, 52, 0.08)';
      g.lineWidth = i % 3 === 0 ? 1.2 : 1;
      g.beginPath();
      g.moveTo(lx, 8);
      g.lineTo(lx + (rnd(i * 5.1) - 0.5) * 3, h);
      g.stroke();
    }
    for (let i = 1; i <= 3; i++) {
      const sy = 60 + i * (h / 5);
      g.fillStyle = 'rgba(20, 40, 48, 0.26)';
      g.fillRect(left, sy, width, 2.4);
      g.fillStyle = 'rgba(255,255,255,0.14)';
      g.fillRect(left, sy + 2.4, width, 1.2);
    }
    for (let i = 0; i < 4; i++) {
      const ry = 22 + Math.floor(i / 2) * 16;
      const rx = left + (i % 2 ? width - 5.5 : 5.5);
      g.fillStyle = 'rgba(214, 240, 248, 0.55)';
      g.beginPath();
      g.arc(rx, ry, 2, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = 'rgba(20, 40, 48, 0.35)';
      g.beginPath();
      g.arc(rx + 0.6, ry + 0.7, 1.1, 0, Math.PI * 2);
      g.fill();
    }
  } else if (isBrick) {
    /* 石砖：错缝排列，每块砖单独调一点明暗，才不会像贴了张壁纸 */
    const bh = 26;                                  // 砖高
    const bw = Math.max(34, width * 0.46);          // 砖长
    const mortar = 2.6;
    g.fillStyle = 'rgba(74, 77, 70, 0.92)';         // 灰缝底色
    g.fillRect(left, 0, width, h);

    for (let row = 0, y = 4; y < h; y += bh, row++) {
      const offset = (row % 2) * (bw * 0.5);
      for (let x = left - bw + offset; x < right; x += bw) {
        const seed = row * 7.3 + x * 0.21;
        const tone = 0.80 + rnd(seed) * 0.30;
        const bx0 = Math.max(left, x + mortar * 0.5);
        const bx1 = Math.min(right, x + bw - mortar * 0.5);
        const by0 = y + mortar * 0.5;
        const by1 = Math.min(h, y + bh - mortar * 0.5);
        if (bx1 - bx0 < 5 || by1 - by0 < 5) continue;

        const rr0 = Math.round(150 * tone), rg0 = Math.round(152 * tone), rb0 = Math.round(146 * tone);
        const brickGrad = g.createLinearGradient(bx0, by0, bx0, by1);
        brickGrad.addColorStop(0, 'rgb(' + (rr0 + 20) + ',' + (rg0 + 20) + ',' + (rb0 + 18) + ')');
        brickGrad.addColorStop(0.55, 'rgb(' + rr0 + ',' + rg0 + ',' + rb0 + ')');
        brickGrad.addColorStop(1, 'rgb(' + (rr0 - 26) + ',' + (rg0 - 26) + ',' + (rb0 - 24) + ')');
        g.fillStyle = brickGrad;
        g.fillRect(bx0, by0, bx1 - bx0, by1 - by0);

        // 砖面上沿的亮线，砖块才有厚度
        g.fillStyle = 'rgba(255,255,255,0.12)';
        g.fillRect(bx0 + 1, by0 + 1, bx1 - bx0 - 2, 1.6);

        // 偶尔一个坑洼 / 缺角
        if (rnd(seed + 3.3) > 0.74) {
          g.fillStyle = 'rgba(56, 58, 52, 0.22)';
          g.beginPath();
          g.ellipse(bx0 + (bx1 - bx0) * rnd(seed + 1.7),
                    by0 + (by1 - by0) * rnd(seed + 2.9),
                    3.4, 2.1, 0, 0, Math.PI * 2);
          g.fill();
        }
      }
    }

    // 砖缝里钻出来的苔藓
    g.fillStyle = 'rgba(104, 148, 74, 0.28)';
    for (let i = 0; i < 7; i++) {
      const mx = left + rnd(i * 4.1 + 0.7) * width;
      const my = 14 + rnd(i * 9.3 + 2.1) * Math.min(200, h * 0.34);
      g.beginPath();
      g.ellipse(mx, my, 6 + rnd(i * 2.7) * 7, 3.4 + rnd(i * 5.3) * 4, 0, 0, Math.PI * 2);
      g.fill();
    }
  } else {
    // 木纹：竖向的年轮 + 两个结疤
    for (let i = 0; i < 5; i++) {
      const lx = left + width * (0.12 + i * 0.19);
      g.strokeStyle = 'rgba(52, 28, 10, 0.30)';
      g.lineWidth = i % 2 ? 1.3 : 2;
      g.beginPath();
      g.moveTo(lx, 9);
      g.bezierCurveTo(lx + 5, 70, lx - 5, 160, lx + 3, h);
      g.stroke();
      g.strokeStyle = 'rgba(255, 226, 178, 0.10)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(lx + 2.2, 12);
      g.bezierCurveTo(lx + 7, 72, lx - 3, 162, lx + 5, h);
      g.stroke();
    }
    for (let i = 0; i < 2; i++) {
      const kx = left + width * (0.26 + i * 0.44);
      const ky = 40 + rnd(i * 7.3 + bucket * 0.31) * Math.max(20, h * 0.5);
      g.strokeStyle = 'rgba(56, 30, 12, 0.34)';
      g.lineWidth = 1.6;
      g.beginPath();
      g.ellipse(kx, ky, 5.5, 8, 0, 0, Math.PI * 2);
      g.stroke();
      g.beginPath();
      g.ellipse(kx, ky, 2.4, 3.8, 0, 0, Math.PI * 2);
      g.stroke();
    }
    // 靠上的青苔
    g.fillStyle = 'rgba(96, 158, 74, 0.34)';
    for (let i = 0; i < 5; i++) {
      const mx = left + width * (0.08 + i * 0.2);
      g.beginPath();
      g.ellipse(mx, 14 + rnd(i * 3.3) * 10, 7 + rnd(i * 5.7) * 5, 4 + rnd(i * 2.1) * 3, 0, 0, Math.PI * 2);
      g.fill();
    }
  }

  /* 左侧亮面 / 右侧暗面：柱身的厚度感 */
  const side = g.createLinearGradient(left, 0, right, 0);
  side.addColorStop(0.00, 'rgba(255,255,255,0.00)');
  side.addColorStop(0.06, 'rgba(255,255,255,0.22)');
  side.addColorStop(0.16, 'rgba(255,255,255,0.05)');
  side.addColorStop(0.72, 'rgba(0,0,0,0.00)');
  side.addColorStop(0.92, 'rgba(0,0,0,0.22)');
  side.addColorStop(1.00, 'rgba(0,0,0,0.38)');
  g.fillStyle = side;
  g.fillRect(left, 0, width, h);

  /* 盖板下方的接触阴影 */
  const ao = g.createLinearGradient(0, capH, 0, capH + 16);
  ao.addColorStop(0, 'rgba(0,0,0,0.22)');
  ao.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = ao;
  g.fillRect(left, capH, width, 16);
  g.restore();

  /* ---------- 3. 顶部盖板 ---------- */
  const capLight = isSpring ? '#b7ec8d' : (isSway ? '#bfeefb' : (isBrick ? '#d6d7cd' : '#e2b982'));
  const capMid = isSpring ? '#7cc95a' : (isSway ? '#8fd3e4' : (isBrick ? '#aeb0a6' : '#c08e52'));
  const capDark = isSpring ? '#3f7a2f' : (isSway ? '#3d7f93' : (isBrick ? '#6b6d64' : '#6a3f1c'));

  g.beginPath();
  g.moveTo(left - 2, capH);
  g.lineTo(left - 2, 4);
  g.quadraticCurveTo(left - 2, -1.5, left + 3.5, -1.5);
  g.lineTo(right - 3.5, -1.5);
  g.quadraticCurveTo(right + 2, -1.5, right + 2, 4);
  g.lineTo(right + 2, capH);
  g.closePath();
  const capG = g.createLinearGradient(0, -1.5, 0, capH);
  capG.addColorStop(0, capLight);
  capG.addColorStop(0.55, capMid);
  capG.addColorStop(1, capDark);
  g.fillStyle = capG;
  g.fill();

  // 盖板顶面高光
  g.fillStyle = 'rgba(255, 255, 255, 0.45)';
  g.beginPath();
  g.moveTo(left + 1, 2.4);
  g.lineTo(right - 1, 2.4);
  g.lineTo(right - 3, 5.2);
  g.lineTo(left + 3, 5.2);
  g.closePath();
  g.fill();

  // 盖板边缘
  g.strokeStyle = capDark;
  g.lineWidth = 1.2;
  g.beginPath();
  g.moveTo(left - 2, capH);
  g.lineTo(left - 2, 4);
  g.quadraticCurveTo(left - 2, -1.5, left + 3.5, -1.5);
  g.lineTo(right - 3.5, -1.5);
  g.quadraticCurveTo(right + 2, -1.5, right + 2, 4);
  g.lineTo(right + 2, capH);
  g.stroke();

  /* 弹簧柱：盖板上的亮绿光点 */
  if (isSpring) {
    g.fillStyle = 'rgba(226, 255, 176, 0.85)';
    for (let i = 0; i < 4; i++) {
      const mx = left + width * (0.14 + i * 0.24);
      g.beginPath();
      g.arc(mx, 1.4, 2.2, 0, Math.PI * 2);
      g.fill();
    }
  }

  /* 盖板上的草：三撮 */
  g.strokeStyle = isSpring ? '#3d7f30' : (isSway ? '#4f9cb0' : (isBrick ? '#5d8a45' : '#4f8f38'));
  g.lineWidth = 2;
  g.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const gx = left + width * (0.18 + i * 0.3);
    const gh = 5 + rnd(i * 3.7 + bucket * 0.13) * 7;
    g.beginPath();
    g.moveTo(gx, 0.5);
    g.quadraticCurveTo(gx + 3, -gh * 0.55, gx + 6.5, -gh);
    g.stroke();
  }

  /* ---------- 4. 底部融进地面 ---------- */
  const fade = g.createLinearGradient(0, h - 120, 0, h);
  fade.addColorStop(0, 'rgba(58, 116, 58, 0)');
  fade.addColorStop(0.55, 'rgba(52, 104, 52, 0.45)');
  fade.addColorStop(1, 'rgba(45, 92, 48, 0.85)');
  g.fillStyle = fade;
  g.fillRect(left + 1, h - 120, width - 2, 120);

  return { c: L.c, w: w, h: h + top, top: top, columnH: h };
}


/* 平台贴图按「宽度分桶 + 材质」缓存复用。
   以前每生成一个平台就现场新建一张 (宽度 × 屏幕高度 × 1.4²) 的画布，
   高分时每一两秒就要新建一张，纹理上传和 GC 都会抖一下。 */
function getPlatformSprite(p) {
  const columnH = Math.ceil(H - topY() + 18);
  const bucket = Math.max(24, Math.round(p.w / PLAT_BUCKET) * PLAT_BUCKET);
  const kind = p.spring ? 'spring' : (p.sway ? 'sway' : (p.brick ? 'brick' : 'wood'));
  const key = kind + ':' + bucket + ':' + columnH;
  let sp = platSpriteCache.get(key);
  if (!sp) {
    if (platSpriteCache.size > 64) platSpriteCache.clear();
    sp = buildPlatformSprite(kind, bucket, columnH);
    platSpriteCache.set(key, sp);
  }
  return sp;
}

/* ============================================================
 *  11. 萤火虫
 * ============================================================ */
function spawnFirefly(initial) {
  return {
    x: Math.random() * W,
    y: initial ? H * 0.1 + Math.random() * H * 0.7 : H * 0.75 + Math.random() * H * 0.2,
    vx: -8 + Math.random() * 16,
    vy: -6 - Math.random() * 8,
    size: 1.6 + Math.random() * 2.2,
    life: 5 + Math.random() * 7,
    phase: Math.random() * Math.PI * 2,
    warm: Math.random() < 0.6
  };
}

function initFireflies() {
  fireflies = [];
  const n = fireflyTarget();
  for (let i = 0; i < n; i++) fireflies.push(spawnFirefly(true));
}

function updateFireflies(dt) {
  const target = fireflyTarget();
  while (fireflies.length > target) fireflies.pop();
  while (fireflies.length < target) fireflies.push(spawnFirefly(false));

  for (let i = 0; i < fireflies.length; i++) {
    const f = fireflies[i];
    f.phase += dt * 1.7;
    f.x += (f.vx + Math.sin(f.phase) * 6) * dt;
    f.y += f.vy * dt;
    f.life -= dt;
    if (f.y < H * 0.04) f.vy = Math.abs(f.vy);
    if (f.y > H * 0.95) f.vy = -Math.abs(f.vy);
    if (f.x < -12) f.x = W + 12;
    if (f.x > W + 12) f.x = -12;
    if (f.life <= 0) fireflies[i] = spawnFirefly(false);
  }
}

function drawFireflies(now) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < fireflies.length; i++) {
    const f = fireflies[i];
    const flicker = Math.sin(now * 0.0025 + f.phase) * 0.35 + 0.6;
    const fade = Math.min(1, f.life / 1.5);
    // 白天只是隐约的光点，黄昏之后才明显
    const a = flicker * fade * (0.28 + 0.72 * dayT);

    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = f.warm ? 'rgba(255, 240, 150, 1)' : 'rgba(190, 255, 170, 1)';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = 'rgba(255, 255, 225, 1)';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 0.55, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
 *  12. 重置
 * ============================================================ */
function reset() {
  stopChargeSound();
  // 出生点那根是 0 号（木柱），后面 makePlatform 从 1 号开始排
  platSeq = 1;
  setRunRng(dailyKey);             // 每日挑战：换种子；普通局：回到 Math.random
  platforms = [];
  const firstW = 112;
  platforms.push({ x: W * 0.2, baseX: W * 0.2, w: firstW, squash: 0, spring: false, sway: null, brick: false, sprite: null, spriteH: 0, glow: 0 });
  for (let i = 0; i < 4; i++) platforms.push(makePlatform(platforms[platforms.length - 1]));

  player = {
    x: platforms[0].x + firstW / 2,
    y: topY(),
    vx: 0, vy: 0,
    squash: 1, rot: 0, rotSpeed: 0,
    glideLeft: 0,                // 直线冲刺剩余时间（困难模式用）
    state: 'idle',
    plat: platforms[0]
  };

  camX = player.x - W * camAnchor();
  runBest = best;
  score = 0; combo = 0; scorePop = 0; punch = 0; moveT = 0;
  swayTipShown = false;
  displayScore = 0;
  dayT = 0; skyDayT = 0;
  rebuildSky();                    // 修复：重开一局时天色还停在黄昏
  maxCombo = 0; perfectCount = 0; rescueCount = 0; springCount = 0;
  charging = false; charge = 0; shake = 0;
  chargeFullBeeped = false;
  hitstop = 0;
  tutorialDone = false;
  eyeGlow = 0;
  recentMisses = 0;
  milestoneShown = 0;
  newRecordShown = false;
  sparkTimer = 0;
  wantCharge = false; chargeBufferAt = 0;
  jumpCount = 0;
  boardOpen = false;
  settingsOpen = false;
  achOpen = false;
  pauseSnap = null;             // 新的一局，暂停快照作废
  lastRank = 0;
  particles = []; popups = []; rings = []; trail = [];
  gameState = 'playing';
  acc = 0;
  lastTime = performance.now();    // 否则会用很久以前的基准算出超大 dt
  ensurePlatforms();
  initFireflies();
}

/* ============================================================
 *  13. 输入
 * ============================================================ */
function hitCircle(x, y, cx, cy, r) {
  const dx = x - cx, dy = y - cy;
  return dx * dx + dy * dy < r * r;
}

function btnSpacing() { return isLandscape() ? 42 : 48; }

function getMuteBtn() {
  const r = getBtnRadius();
  return { x: W - (isLandscape() ? 32 : 36), y: (isLandscape() ? 30 : 36) + safeTop, r: r + 3 };
}
function getPauseBtn() {
  const b = getMuteBtn();
  return { x: b.x, y: b.y + btnSpacing(), r: b.r };
}
function getFullscreenBtn() {
  const b = getPauseBtn();
  return { x: b.x, y: b.y + btnSpacing(), r: b.r };
}

function startCharge() {
  if (gameState !== 'playing' || player.state !== 'idle' || charging) return false;
  // 顿帧只是让画面停一下，不该吞掉玩家输入：
  // 落地那一两帧是按键最密集的时候，以前按下去会没反应。
  charging = true;
  chargeStart = performance.now();
  charge = 0;
  chargeFullBeeped = false;
  startChargeSound();
  return true;
}

function releaseCharge() {
  if (!charging) return;
  charging = false;
  stopChargeSound();

  const elapsed = Math.min(performance.now() - chargeStart, CFG.maxChargeMs);
  charge = 0;

  if (gameState !== 'playing' || player.state !== 'idle') return;

  tutorialDone = true;

  const t = elapsed / CFG.maxChargeMs;
  const dist = CFG.minDist + t * (CFG.maxDist - CFG.minDist);
  const M = MODE();

  player.rot = 0;
  player.plat = null;
  player.glideLeft = 0;

  if (M.arc) {
    /* 简单：抛物线。竖直初速定飞行时间，水平速度 = 距离 / 飞行时间 */
    const vy0 = -(560 + dist * 0.75);
    const T = (2 * Math.abs(vy0)) / CFG.gravity;
    player.vx = dist / T;
    player.vy = vy0;
    player.rotSpeed = (Math.PI * 2) / T;
    player.state = 'jump';
  } else {
    /* 困难：取消抛物线。全程等高、匀速直线冲刺，冲到点再垂直落下 */
    const T = clamp(0.30 + dist / 1200, 0.34, 0.56);
    player.vx = dist / T;
    player.vy = 0;
    player.rotSpeed = 0;
    player.glideLeft = T;
    player.dashFromX = player.x;      // 冲刺起点，画那条直线用
    player.state = 'glide';
  }
  jumpCount++;
  STATS.jumps++;

  spawnDust(player.x, topY(), 5, 0.7);
  vibrate(8);
  if (M.arc) beep(520, 0.13, 'triangle', 0.10, 760);
  else { beep(300, 0.10, 'sawtooth', 0.09, 900); beep(760, 0.08, 'square', 0.06, 1020, 0.05); }
}

function onDown(e) {
  e.preventDefault();
  if (e.isPrimary === false) return;      // 只认第一根手指，别被多点触控打断
  ensureAudio();
  const x = e.clientX || 0, y = e.clientY || 0;

  if (nameEditing) { closeNameEditor(true); return; }

  // 面板上的按钮（结算/暂停/排行榜/设置）优先
  const hit = hitTest(x, y);
  if (hit) { hit(); return; }

  if (settingsOpen) { settingsOpen = false; return; }   // 点空白处关掉设置
  if (boardOpen) { boardOpen = false; return; }         // 点空白处关闭排行榜
  if (achOpen) { achOpen = false; settingsOpen = true; return; }  // 成就面板：点空白退回设置

  const mb = getMuteBtn();
  if (hitCircle(x, y, mb.x, mb.y, mb.r)) {
    setMuted(!muted);
    return;
  }

  const pb = getPauseBtn();
  if (hitCircle(x, y, pb.x, pb.y, pb.r)) {
    togglePause();
    return;
  }

  const fb = getFullscreenBtn();
  if (hitCircle(x, y, fb.x, fb.y, fb.r)) {
    toggleFullscreen();
    return;
  }

  if (gameState === 'paused') { togglePause(); return; }

  if (gameState === 'over') { restartGame(); return; }
  // 空中按下先记下来，落地立刻接上蓄力（跟手很多）
  if (!startCharge() && (player.state === 'jump' || player.state === 'glide')) {
    wantCharge = true;
    chargeBufferAt = performance.now();
  }
}

function onUp(e) {
  if (e) e.preventDefault();
  if (e && e.isPrimary === false) return;
  wantCharge = false;          // 手指已抬起，缓冲作废
  releaseCharge();
}

canvas.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointerup', onUp, { passive: false });
window.addEventListener('pointercancel', onUp, { passive: false });

window.addEventListener('keydown', function (e) {
  if (nameEditing || document.activeElement === nameInputEl) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (e.repeat) return;
    ensureAudio();
    if (gameState === 'paused') { togglePause(); return; }
    if (gameState === 'over') { restartGame(); return; }
    if (!startCharge() && (player.state === 'jump' || player.state === 'glide')) {
      wantCharge = true;
      chargeBufferAt = performance.now();
    }
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    e.preventDefault();
    if (achOpen) { achOpen = false; settingsOpen = true; return; }
    if (settingsOpen) { settingsOpen = false; return; }
    if (boardOpen) { boardOpen = false; return; }
    if (gameState === 'playing' || gameState === 'paused') togglePause();
  } else if (e.code === 'KeyM') {
    /* 桌面端调试方便：M 直接切难度（手机上是暂停面板里的「设置」） */
    e.preventDefault();
    applyMode(modeKey === 'easy' ? 'hard' : 'easy');
  } else if (e.code === 'KeyF') {
    e.preventDefault();
    toggleFullscreen();
  }
}, { passive: false });

window.addEventListener('keyup', function (e) {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (gameState === 'playing') releaseCharge();
  }
}, { passive: false });

window.addEventListener('blur', function () {
  if (charging) releaseCharge();
  if (gameState === 'playing') togglePause();
});

/* ============================================================
 *  14. 暂停
 * ============================================================ */
function restartGame() {
  if (performance.now() - overAt < 420) return;
  boardOpen = false;
  settingsOpen = false;
  reset();
  beep(520, 0.08, 'sine', 0.10);
  beep(780, 0.12, 'sine', 0.09, null, 0.09);
}

function togglePause() {
  if (gameState === 'over') return;
  boardOpen = false;
  settingsOpen = false;
  achOpen = false;

  if (gameState === 'playing') {
    if (charging) { charging = false; charge = 0; stopChargeSound(); }
    gameState = 'paused';
    pauseAt = performance.now();
    freezePauseSnapshot();     // 画布上还是上一帧，正好拿来当暂停背景
  } else if (gameState === 'paused') {
    const delta = performance.now() - pauseAt;
    chargeStart += delta;
    lastTime = performance.now();
    acc = 0;
    pauseSnap = null;          // 恢复后要重新画整场
    gameState = 'playing';
  }
}

/* 把当前画布整张贴进一张离屏画布。失败（极少见）就当没有快照，退回完整渲染。 */
function freezePauseSnapshot() {
  try {
    const c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = canvas.height;
    const g = c.getContext('2d');
    if (!g) { pauseSnap = null; return; }
    g.drawImage(canvas, 0, 0);
    pauseSnap = c;
  } catch (e) {
    pauseSnap = null;
  }
}

/* ============================================================
 *  15. 得分 / 结束
 * ============================================================ */
function spawnDust(x, y, count, scale) {
  const cap = particleCap();
  if (particles.length >= cap) return;
  const n = count || 7;
  const sc = scale || 1;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
    const sp = (35 + Math.random() * 90) * sc;
    const p = acquireParticle();
    p.x = x;
    p.y = y - 2;
    p.vx = Math.cos(a) * sp;
    p.vy = Math.sin(a) * sp * 0.55;
    p.life = 0.5;
    p.maxLife = 0.5;
    p.size = (2 + Math.random() * 2.6) * sc;
    p.color = '#8a6a44';
    p.grav = 540;
    particles.push(p);
  }
}

function spawnBurst(x, y, color1, color2, count) {
  const cap = particleCap();
  if (particles.length >= cap) return;
  const scale = perfLevel >= 2 ? 0.55 : (perfLevel >= 1 ? 0.8 : 1);
  const n = Math.round(count * scale);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 150;
    const p = acquireParticle();
    p.x = x;
    p.y = y - 18;
    p.vx = Math.cos(a) * sp;
    p.vy = Math.sin(a) * sp - 90;
    p.life = 0.85;
    p.maxLife = 0.85;
    p.size = 2 + Math.random() * 3;
    p.color = Math.random() < 0.55 ? color1 : color2;
    p.grav = 380;
    particles.push(p);
  }
}

function spawnPopup(x, y, text, color, size) {
  if (popups.length >= CFG.popupMax) releasePopup(popups.shift());
  const p = acquirePopup();
  p.x = x;
  p.y = y;
  p.life = 1.1;
  p.maxLife = 1.1;
  p.text = text;
  p.color = color;
  p.size = size;
  popups.push(p);
}

function spawnRing(x, y) {
  if (rings.length >= CFG.ringMax) releaseRing(rings.shift());
  const r = acquireRing();
  r.x = x;
  r.y = y;
  r.life = 0.62;
  r.maxLife = 0.62;
  rings.push(r);
}

function checkMilestone(ty) {
  const next = milestoneShown + 10;
  if (score >= next) {
    milestoneShown = next;
    spawnPopup(W / 2 + camX, ty - 150, '里程碑 ' + next + ' 分!', '#ffd93b', 24);
    spawnRing(player.x, ty);
    beep(1046, 0.10, 'sine', 0.12);
    beep(1568, 0.10, 'sine', 0.10, null, 0.10);
    beep(2093, 0.20, 'sine', 0.09, null, 0.20);
  }
}

/* 完美判定半径：宽平台给多一点，窄平台不至于过苛；困难模式更严 */
function perfectRadius(p) {
  const M = MODE();
  return clamp(p.w * M.perfectR, M.arc ? 6.5 : 5.5, M.arc ? 11 : 9.5);
}

function doLand(p, ty, rescued) {
  player.y = ty;
  player.vx = 0;
  player.vy = 0;
  player.rot = 0;
  player.rotSpeed = 0;
  player.state = 'idle';
  player.squash = 0.60;

  const samePlat = (p === player.plat);
  player.plat = p;
  player.x = clamp(player.x, p.x + 5, p.x + p.w - 5);

  if (!samePlat) {
    const center = p.x + p.w / 2;
    const perfect = !rescued && Math.abs(player.x - center) < perfectRadius(p);
    p.squash = 0.6;

    const wasBest = best;
    const EXTRA = MODE().bonus;      // 困难模式每次落地额外 +1

    if (rescued) {
      if (combo >= 2) spawnPopup(player.x, ty - 80, '连击中断', '#ff9b7a', 15);
      combo = 0;
      recentMisses++;
      score += 1 + EXTRA;
      rescueCount++;
      STATS.rescues++;
      spawnDust(player.x, ty, 5, 0.8);
      spawnPopup(player.x, ty - 82, '惊险 +' + (1 + EXTRA), '#ffd54f', 18);
      shake = Math.min(shake + 2.5, 6);
      vibrate(12);
      beep(240, 0.12, 'triangle', 0.12, 140);
      hitstop = CFG.hitstopMs / 2000;
      punch = Math.max(punch, 0.4);
    } else if (p.spring) {
      const gain = CFG.springBonus + (perfect ? 1 : 0) + EXTRA;
      score += gain;
      springCount++;
      STATS.springs++;
      if (perfect) {
        combo++;
        perfectCount++;
        STATS.perfects++;
        // 这里原本漏了 maxCombo：弹簧上的完美落地会连击但不计入「最高连击」
        maxCombo = Math.max(maxCombo, combo);
        recentMisses = Math.max(0, recentMisses - 1);
        eyeGlow = 1.2;
        punch = Math.max(punch, 1);
      } else {
        combo = 0;
      }
      spawnRing(center, ty);
      spawnBurst(center, ty, '#a6e07a', '#e0ffb0', 22);
      spawnPopup(center, ty - 80, '弹簧 +' + gain, '#a6e07a', 22);
      shake = Math.min(shake + 4.5, 9);
      vibrate([12, 30, 18]);
      beep(1046, 0.10, 'sine', 0.13);
      beep(1568, 0.20, 'sine', 0.10, null, 0.08);
      hitstop = CFG.hitstopMs / 1000;
    } else if (perfect) {
      combo++;
      perfectCount++;
      STATS.perfects++;
      maxCombo = Math.max(maxCombo, combo);
      recentMisses = Math.max(0, recentMisses - 1);
      const bonus = combo >= 2 ? Math.min(combo - 1, 5) : 0;
      const gain = 2 + bonus + EXTRA;
      score += gain;
      eyeGlow = 1;
      punch = Math.max(punch, 0.85);
      spawnRing(center, ty);
      spawnBurst(center, ty, '#ffd93b', '#fff3a0', 18);
      spawnPopup(center, ty - 80, '完美 +' + gain, '#ffd93b', 22);
      if (combo >= 2) spawnPopup(center, ty - 112, '连击 x' + combo, '#9ef07a', 17);
      shake = Math.min(shake + 2.5, 6);
      vibrate(15);
      beep(comboNote(combo), 0.09, 'sine', 0.13);
      if (combo >= 3) beep(comboNote(combo + 1), 0.10, 'sine', 0.08, null, 0.06);
      hitstop = CFG.hitstopMs / 1000;
    } else {
      if (combo >= 2) spawnPopup(player.x, ty - 80, '连击中断', '#ff9b7a', 15);
      combo = 0;
      recentMisses++;
      score += 1 + EXTRA;
      spawnDust(player.x, ty, 7, 1);
      shake = Math.min(shake + 3.4, 7);
      vibrate(10);
      beep(170, 0.09, 'sine', 0.14, 82);
    }

    scorePop = 1;

    if (score > best) { best = score; saveBest(); }
    if (!newRecordShown && score > wasBest && wasBest > 0) {
      newRecordShown = true;
      spawnPopup(W / 2 + camX, ty - 190, '新纪录!', '#ffd93b', 26);
      beep(1568, 0.12, 'sine', 0.10);
    }

    checkMilestone(ty);
    checkAch();
  } else if (rescued) {
    spawnPopup(player.x, ty - 82, '差一点', '#ffd54f', 16);
    spawnDust(player.x, ty, 4, 0.7);
    vibrate(8);
    beep(220, 0.10, 'triangle', 0.10, 180);
  } else {
    // 落回原平台：不加分，但给一点触感反馈，避免“按了没反应”的空落感
    spawnDust(player.x, ty, 4, 0.6);
    vibrate(6);
  }
  ensurePlatforms();

  // 第一次遇到会动的柱子，提示一句
  if (!swayTipShown) {
    const at = platforms.indexOf(p);
    const nx = platforms[at + 1];
    if (nx && nx.sway) {
      swayTipShown = true;
      spawnPopup(nx.baseX + nx.w / 2, ty - 118, '蓝色柱子会左右移动', '#9fe0ef', 15);
    }
  }
}

function gameOver() {
  if (gameState === 'over') return;
  gameState = 'over';
  overAt = performance.now();
  player.state = 'dead';
  if (score > best) { best = score; saveBest(); }
  lastRank = addRunToBoard(score);     // 进榜才返回名次

  // 跨局统计 + 每日挑战成绩（都只写一次，失败也不影响这局）
  STATS.runs++;
  if (dailyKey) {
    STATS.dailyRuns++;
    if (dailyKey === todayKey() && score > dailyBest) {
      dailyBest = score;
      saveDailyRecord();
    }
  }
  saveStats();
  checkAch();

  spawnPopup(camX + W / 2, H * 0.36, '失足...', '#ff9b7a', 24);
  vibrate([30, 60, 40]);
  beep(400, 0.45, 'sawtooth', 0.09, 80);
}

/* ============================================================
 *  16. 固定步长物理
 * ============================================================ */
/* 落地判定（两种模式共用）：当前横坐标压在哪个柱子上，含边缘救援。
   抛物线在越过柱顶那一刻调用，直线冲刺在冲刺结束那一刻调用。 */
function resolveLanding(ty, fromGlide) {
  let hit = null;
  let rescue = null;
  let rescueDist = Infinity;
  const MERCY = mercyRadius();

  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    if (player.x >= p.x && player.x <= p.x + p.w) { hit = p; break; }
    const dl = Math.abs(player.x - p.x);
    const dr = Math.abs(player.x - (p.x + p.w));
    const d = Math.min(dl, dr);
    if (d < MERCY && d < rescueDist) {
      rescueDist = d;
      rescue = p;
    }
  }

  if (hit) {
    doLand(hit, ty, false);
    return;
  }
  if (rescue) {
    player.x = clamp(player.x, rescue.x + 4, rescue.x + rescue.w - 4);
    doLand(rescue, ty, true);
    return;
  }

  // 掉进缝里：从当前位置开始自由落体（直线冲刺时竖直速度是 0，直接往下掉）
  player.state = 'fall';
  if (fromGlide) player.vy = 0;
  player.rotSpeed = Math.PI * 2 * 0.9;
  player.vx *= 0.82;
}

function fixedUpdate(dt) {
  const ty = topY();

  // 摆动的柱子先动：落地判定用的是动完之后的位置
  moveT += dt;
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    if (!p.sway) continue;
    const before = p.x;
    p.x = p.baseX + Math.sin(moveT * p.sway.spd + p.sway.ph) * p.sway.amp;
    // 站在上面的人跟着一起走，不会平白滑下去
    if (player.state === 'idle' && player.plat === p) player.x += p.x - before;
  }

  if (player.state === 'glide') {
    /* 困难模式：直线冲刺。y 始终等于柱顶，只有 x 在变；
       冲刺时间一到就做落地判定 —— 落在柱子上就站住，落在缝里就直接往下掉。
       整条轨迹是一条水平线，没有抛物线，也没有竖直初速。 */
    player.x += player.vx * dt;
    player.glideLeft -= dt;
    if (player.glideLeft <= 0) {
      player.glideLeft = 0;
      resolveLanding(ty, true);
    }
  } else if (player.state === 'jump' || player.state === 'fall') {
    const prevY = player.y;

    player.vy += CFG.gravity * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.rot += player.rotSpeed * dt;

    if (player.state === 'jump' && player.vy > 0 && prevY <= ty && player.y >= ty) {
      resolveLanding(ty, false);
    }

    if (player.state === 'fall' && player.y > H + 60) gameOver();
  }

  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    if (p.squash > 0) {
      p.squash += -p.squash * Math.min(1, dt * 9);
      if (p.squash < 0.004) p.squash = 0;
    }
    if (p.spring) {
      p.glow += dt * 2.4;
      if (p.glow > Math.PI * 2) p.glow -= Math.PI * 2;
    }
  }

  // 输入缓冲：落地瞬间自动接手蓄力
  if (wantCharge) {
    if (performance.now() - chargeBufferAt > CFG.inputBufferMs) {
      wantCharge = false;
    } else if (player.state === 'idle') {
      wantCharge = false;
      startCharge();
    }
  }
}

/* ============================================================
 *  17. 视觉更新
 * ============================================================ */
function visualUpdate(dt, now) {
  if (gameState === 'paused') return;

  // 分数滚动
  displayScore += (score - displayScore) * Math.min(1, dt * 14);
  if (Math.abs(score - displayScore) < 0.05) displayScore = score;

  // 昼夜渐变：只有变化足够大才重建天空（rebuildSky 要重算渐变对象）
  dayT = clamp(score / CFG.duskScore, 0, 1);
  if (Math.abs(dayT - skyDayT) > 0.02) {
    skyDayT = dayT;
    rebuildSky();
  }

  // 蓄力
  if (charging && gameState === 'playing') {
    charge = Math.min(1, (now - chargeStart) / CFG.maxChargeMs);
    setChargeFreq(charge);

    if (charge >= 0.995 && !chargeFullBeeped) {
      chargeFullBeeped = true;
      beep(1600, 0.07, 'sine', 0.09);
      vibrate(22);                 // 蓄满给一次触感，闭着眼睛也能感觉到
    }

    if (player.plat) player.plat.squash = Math.max(player.plat.squash, charge * 0.7);
  }

  // 落地回弹
  if (player.state === 'idle' || player.state === 'dead') {
    player.squash += (1 - player.squash) * Math.min(1, dt * 14);
  }

  // 眼部光效
  if (eyeGlow > 0) {
    eyeGlow -= eyeGlow * Math.min(1, dt * 5);
    if (eyeGlow < 0.02) eyeGlow = 0;
  }

  // 连击火花：连击达到 4 以上时头顶持续冒火星
  sparkTimer -= dt;
  if (combo >= 4 && player.state === 'idle' && sparkTimer <= 0 && particles.length < particleCap()) {
    sparkTimer = 0.08;
    const p = acquireParticle();
    p.x = player.x + (Math.random() - 0.5) * 14;
    p.y = player.y - 42 - Math.random() * 6;
    p.vx = (Math.random() - 0.5) * 26;
    p.vy = -40 - Math.random() * 30;
    p.life = 0.55;
    p.maxLife = 0.55;
    p.size = 1.8 + Math.random() * 1.8;
    p.color = Math.random() < 0.6 ? '#ffd93b' : '#ffb060';
    p.grav = -30;
    particles.push(p);
  }

  // 跳跃残影（复用对象，不产生垃圾）
  if (player.state === 'jump' || player.state === 'fall' || player.state === 'glide') {
    const t = trail.length >= CFG.trailDots
      ? trail.shift()
      : (trailPool.pop() || { x: 0, y: 0, life: 0, maxLife: 1 });
    t.x = player.x;
    t.y = player.y - (player.state === 'glide' ? 15 : 0);
    t.life = CFG.trailLife; t.maxLife = CFG.trailLife;
    trail.push(t);
  } else if (trail.length) {
    for (let i = 0; i < trail.length; i++) if (trailPool.length < 32) trailPool.push(trail[i]);
    trail.length = 0;
  }
  for (let i = trail.length - 1; i >= 0; i--) {
    const t = trail[i];
    t.life -= dt;
    if (t.life <= 0) {
      trail.splice(i, 1);
      if (trailPool.length < 32) trailPool.push(t);
    }
  }

  // 相机
  if (gameState === 'playing') {
    const target = player.x - W * camAnchor();
    camX += (target - camX) * Math.min(1, dt * 6.5);
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles[i] = particles[particles.length - 1];
      particles.pop();
      releaseParticle(p);
      continue;
    }
    p.vy += (p.grav || 380) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  // 飘字
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life -= dt;
    if (p.life <= 0) {
      popups[i] = popups[popups.length - 1];
      popups.pop();
      releasePopup(p);
      continue;
    }
    p.y -= 42 * dt;
  }

  // 圆环
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt;
    if (r.life <= 0) {
      rings[i] = rings[rings.length - 1];
      rings.pop();
      releaseRing(r);
    }
  }

  // 落叶
  for (let i = 0; i < leaves.length; i++) {
    const l = leaves[i];
    l.sway += dt * 2.2;
    l.x += (l.vx + Math.sin(l.sway) * 18) * dt;
    l.y += l.vy * dt;
    l.rot += l.vr * dt;
    if (l.y > H + 24) { l.x = Math.random() * W; l.y = -24; }
    if (l.x < -40) l.x += W + 80;
    if (l.x > W + 40) l.x -= W + 80;
  }

  updateFireflies(dt);

  if (shake > 0) {
    shake -= shake * Math.min(1, dt * 11);
    if (shake < 0.12) shake = 0;
  }

  if (scorePop > 0) {
    scorePop -= scorePop * Math.min(1, dt * 9);
    if (scorePop < 0.01) scorePop = 0;
  }

  if (punch > 0) {
    punch -= punch * Math.min(1, dt * 10);
    if (punch < 0.004) punch = 0;
  }
}

/* ============================================================
 *  18. 渲染
 * ============================================================ */
const clouds = [];
for (let i = 0; i < 9; i++) {
  clouds.push({ x: Math.random(), y: Math.random(), s: 0.55 + Math.random() * 0.85, sp: 0.35 + Math.random() * 0.5 });
}

function drawSky() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
}

/* 黄昏之后星星才慢慢浮出来 */
function drawStars(now) {
  if (!starField || dayT < 0.22) return;
  const t = clamp((dayT - 0.22) / 0.6, 0, 1);
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < starField.length; i++) {
    const st = starField[i];
    const tw = 0.55 + 0.45 * Math.sin(now * 0.0017 + st.ph);
    ctx.globalAlpha = t * tw * 0.85;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* 整体暖色叠一层，让黄昏不只是“换了天空颜色” */
function drawDuskTint() {
  if (dayT <= 0.02) return;
  ctx.fillStyle = 'rgba(255, 146, 62,' + (dayT * 0.10).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
}

function drawVignette() {
  if (!vignette) return;
  ctx.drawImage(vignette, 0, 0, W, H);
}

function drawSun(now) {
  // 光芒：低画质档位直接跳过（它最贵，但纯装饰）
  if (raySprite && perfLevel < 2) {
    const R = sunR * 6.4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.19 * (1 - dayT * 0.42) * (0.86 + Math.sin(now * 0.0004) * 0.14);
    ctx.translate(sunX, sunY);
    ctx.rotate(now * 0.000018);
    ctx.drawImage(raySprite.c, -R, -R, R * 2, R * 2);
    ctx.restore();
  }

  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 3.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = sunCoreColor;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();
}

function drawClouds(now) {
  if (!cloudSprite) return;
  // 循环区间用「屏幕宽 + 两侧余量」，云完全出画之后才回绕。
  // 原来只在 x < -280 时补一次，负得更多时不补，云会在屏幕外闪一下再冒出来。
  const span = W + 360;
  ctx.globalAlpha = 0.88;
