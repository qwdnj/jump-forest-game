  drawExpandIcon(fb.x, fb.y, r, isFullscreen());
}

/* ============================================================
 *  18b. 排行榜面板
 * ============================================================ */
function two(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(t) {
  const d = new Date(t);
  return two(d.getMonth() + 1) + '/' + two(d.getDate()) + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
}

function fitText(txt, maxW) {
  const t0 = String(txt);
  if (ctx.measureText(t0).width <= maxW) return t0;
  let t = t0;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

function stamp(d) {
  return d.getFullYear() + '/' + two(d.getMonth() + 1) + '/' + two(d.getDate());
}

/* 把排行榜画成一张竖版长图，点了直接下载 */
function exportBoardImage() {
  try {
    const PW = 420, SC = 2;
    const rows = Math.max(1, board.length);
    const PH = 140 + rows * 34 + 90;      // 高度跟着条目数走，不留大片空白
    const cv = document.createElement('canvas');
    cv.width = PW * SC;
    cv.height = PH * SC;
    const g = cv.getContext('2d');
    if (!g) return;
    g.scale(SC, SC);

    const bg = g.createLinearGradient(0, 0, 0, PH);
    bg.addColorStop(0, '#2f6b46');
    bg.addColorStop(1, '#122c1c');
    g.fillStyle = bg;
    g.fillRect(0, 0, PW, PH);

    g.fillStyle = 'rgba(255,255,255,0.055)';
    g.beginPath(); g.arc(PW - 30, 70, 140, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(10, PH - 30, 120, 0, Math.PI * 2); g.fill();

    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillStyle = '#ffffff';
    g.font = 'bold 25px ' + FONT_FAMILY;
    g.fillText('跳一跳 · 森林', 30, 52);

    g.fillStyle = 'rgba(255,255,255,0.60)';
    g.font = '13px ' + FONT_FAMILY;
    g.fillText('排行榜 · ' + stamp(new Date()), 30, 82);

    g.strokeStyle = 'rgba(255,255,255,0.16)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(30, 106); g.lineTo(PW - 30, 106); g.stroke();

    const list = board;
    const medal = ['#ffd93b', '#cfd8e3', '#f0a86a'];
    let y = 140;
    const rowH = 34;

    if (!list.length) {
      g.textAlign = 'center';
      g.fillStyle = 'rgba(255,255,255,0.55)';
      g.font = '14px ' + FONT_FAMILY;
      g.fillText('还没有记录，先去跳几次吧', PW / 2, 260);
    }

    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      const mid = y + rowH / 2;

      if (i % 2 === 0) {
        g.fillStyle = 'rgba(255,255,255,0.045)';
        g.fillRect(22, y + 2, PW - 44, rowH - 4);
      }

      if (i < 3) {
        g.fillStyle = medal[i];
        g.beginPath(); g.arc(42, mid, 12, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(24,46,28,0.95)';
        g.font = 'bold 13px ' + FONT_FAMILY;
      } else {
        g.fillStyle = 'rgba(255,255,255,0.55)';
        g.font = 'bold 14px ' + FONT_FAMILY;
      }
      g.textAlign = 'center';
      g.fillText(String(i + 1), 42, mid + 0.5);

      g.textAlign = 'left';
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.font = 'bold 15px ' + FONT_FAMILY;
      g.fillText(String(e.n || '玩家').slice(0, 12), 66, mid);

      g.textAlign = 'right';
      g.fillStyle = '#ffffff';
      g.font = 'bold 17px ' + FONT_FAMILY;
      g.fillText(String(e.s), PW - 110, mid);

      g.fillStyle = 'rgba(255,255,255,0.38)';
      g.font = '11px ' + FONT_FAMILY;
      g.fillText(fmtTime(e.t), PW - 30, mid + 0.5);

      y += rowH;
    }

    const footTop = y + 16;

    g.strokeStyle = 'rgba(255,255,255,0.14)';
    g.beginPath(); g.moveTo(30, footTop); g.lineTo(PW - 30, footTop); g.stroke();

    g.textAlign = 'left';
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.font = 'bold 15px ' + FONT_FAMILY;
    g.fillText('最高分 ' + best, 30, footTop + 26);

    g.textAlign = 'right';
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.font = '12px ' + FONT_FAMILY;
    g.fillText('昵称 ' + playerName, PW - 30, footTop + 26);

    g.textAlign = 'center';
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.font = '11px ' + FONT_FAMILY;
    g.fillText('按住屏幕蓄力，松开跳跃 · 用手机浏览器打开就能玩', PW / 2, footTop + 54);

    const url = cv.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = '跳一跳-排行榜-' + stamp(new Date()).replace(/\//g, '') + '.png';
    if (document.body) document.body.appendChild(a);
    a.click();
    if (document.body && a.parentNode) {
      setTimeout(function () { try { a.parentNode.removeChild(a); } catch (e) {} }, 300);
    }
  } catch (e) {}
}

function drawBoard() {
  const land = isLandscape();
  const k = uiScale();
  const online = boardTab === 1;

  if (online && onlineState === 'idle') onlineLoad();

  ctx.fillStyle = 'rgba(8, 22, 14, 0.74)';
  ctx.fillRect(0, 0, W, H);

  const list = online ? onlineList : board;
  const n = list.length;

  const cw = Math.min(W * 0.9, (land ? 490 : 348) * k);
  const headerH = 96 * k;
  const footerH = 42 * k;
  const rowH0 = 34 * k;
  const naturalH = headerH + footerH + Math.max(1, n) * rowH0 + 10 * k;
  const ch = Math.min(H * 0.92, Math.max(196 * k, naturalH));
  const cx = W / 2 - cw / 2;
  const cy = H / 2 - ch / 2;

  const pg = ctx.createLinearGradient(0, cy, 0, cy + ch);
  pg.addColorStop(0, 'rgba(40, 78, 52, 0.97)');
  pg.addColorStop(1, 'rgba(20, 46, 30, 0.97)');
  ctx.fillStyle = pg;
  rr(ctx, cx, cy, cw, ch, 20 * k);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 标题
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf(17 * k, 'bold');
  ctx.fillText('排行榜', cx + 20 * k, cy + 26 * k);

  // 在线状态
  if (online) {
    ctx.textAlign = 'right';
    ctx.font = fontOf(10 * k);
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    const st = onlineState === 'loading' ? '连接中'
      : onlineState === 'ok' ? '已连接'
      : onlineState === 'off' ? '未配置' : (onlineState === 'error' ? '离线' : '');
    if (st) ctx.fillText(st, cx + cw - 48 * k, cy + 27 * k);
  }

  // 关闭
  const closeR = 13 * k;
  const ccx = cx + cw - 24 * k;
  const ccy = cy + 26 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(ccx, ccy, closeR, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = Math.max(1.5, 2 * k);
  ctx.lineCap = 'round';
  const xr = closeR * 0.42;
  ctx.beginPath();
  ctx.moveTo(ccx - xr, ccy - xr); ctx.lineTo(ccx + xr, ccy + xr);
  ctx.moveTo(ccx + xr, ccy - xr); ctx.lineTo(ccx - xr, ccy + xr);
  ctx.stroke();
  addHit(ccx - closeR - 10, ccy - closeR - 10, (closeR + 10) * 2, (closeR + 10) * 2, function () { boardOpen = false; });

  // 分页
  const tabW = 50 * k, tabH = 22 * k, tabY = cy + 44 * k;
  for (let i = 0; i < 2; i++) {
    const tx = cx + 20 * k + i * (tabW + 6 * k);
    const on = boardTab === i;
    ctx.fillStyle = on ? 'rgba(126, 222, 156, 0.9)' : 'rgba(255,255,255,0.10)';
    rr(ctx, tx, tabY, tabW, tabH, tabH / 2);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = on ? '#12331e' : 'rgba(255,255,255,0.75)';
    ctx.font = fontOf(11.5 * k, on ? 'bold' : '');
    ctx.fillText(i === 0 ? '本机' : '在线', tx + tabW / 2, tabY + tabH / 2 + 0.5);
    (function (idx) {
      addHit(tx, tabY - 5 * k, tabW, tabH + 10 * k, function () {
        boardTab = idx;
        if (idx === 1 && onlineState !== 'ok') { onlineState = 'idle'; onlineLoad(); }
      });
    })(i);
  }

  // 昵称行
  const nameY = cy + 76 * k;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.font = fontOf(11 * k);
  ctx.fillText('昵称', cx + 20 * k, nameY);
  const nmX = cx + 52 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = fontOf(12.5 * k, 'bold');
  ctx.fillText(playerName, nmX, nameY);
  const nmW = ctx.measureText(playerName).width;

  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = Math.max(1.1, 1.5 * k);
  ctx.lineCap = 'round';
  const penX = nmX + nmW + 12 * k, penY = nameY;
  ctx.beginPath();
  ctx.moveTo(penX - 4 * k, penY + 3.5 * k);
  ctx.lineTo(penX + 3 * k, penY - 3.5 * k);
  ctx.stroke();

  addHit(cx + 18 * k, nameY - 14 * k, Math.min(cw - 36 * k, nmW + 52 * k), 28 * k, function () {
    openNameEditor(nameY - 26 * k);
  });

  // 分隔线
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx + 16 * k, cy + headerH - 8 * k);
  ctx.lineTo(cx + cw - 16 * k, cy + headerH - 8 * k);
  ctx.stroke();

  // 列表
  const listTop = cy + headerH;
  const listH = Math.max(20, ch - headerH - footerH);
  const padX = 18 * k;
  const scoreX = cx + cw * 0.62;
  const timeX = cx + cw - padX;
  const medalColor = ['#ffd93b', '#cfd8e3', '#f0a86a'];

  if (!n) {
    ctx.textAlign = 'center';
    if (online) {
      if (onlineState === 'off') {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = fontOf(12 * k);
        ctx.fillText('还没有配置在线榜', W / 2, cy + headerH + listH * 0.30);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = fontOf(10.5 * k);
        ctx.fillText('用 ?api=你的接口地址 打开一次页面即可', W / 2, cy + headerH + listH * 0.30 + 22 * k);
        ctx.fillText('也可以直接改脚本里的 ONLINE 配置', W / 2, cy + headerH + listH * 0.30 + 40 * k);
      } else if (onlineState === 'loading') {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = fontOf(12 * k);
        ctx.fillText('加载中…', W / 2, cy + headerH + listH * 0.36);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = fontOf(12 * k);
        ctx.fillText(onlineMsg || '暂时连不上服务器', W / 2, cy + headerH + listH * 0.32);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = fontOf(10.5 * k);
        ctx.fillText('点这里重试', W / 2, cy + headerH + listH * 0.32 + 22 * k);
        addHit(cx + 16 * k, cy + headerH, cw - 32 * k, listH, function () {
          onlineState = 'idle';
          onlineLoad();
        });
      }
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = fontOf(12.5 * k);
      ctx.fillText('还没有记录', W / 2, cy + headerH + listH * 0.34);
      ctx.fillText('先跳几次吧', W / 2, cy + headerH + listH * 0.34 + 22 * k);
    }
  } else {
    const rowH = Math.min(rowH0, listH / n);
    const fMain = Math.min(15 * k, rowH * 0.46);
    const fSub = Math.min(10 * k, rowH * 0.32);
    const nameX = cx + padX + 26 * k;
    const nameMax = scoreX - nameX - 14 * k;

    for (let i = 0; i < n; i++) {
      const e = list[i];
      const ry = listTop + rowH * i;
      const midY = ry + rowH * 0.5;
      const isLast = !online && lastRunAt > 0 && e.t === lastRunAt;

      const rowBg = isLast
        ? 'rgba(255,217,59,0.16)'
        : (i % 2 === 0 ? 'rgba(255,255,255,0.04)' : null);
      if (rowBg) {
        ctx.fillStyle = rowBg;
        rr(ctx, cx + 10 * k, ry + rowH * 0.07, cw - 20 * k, rowH * 0.86, 8 * k);
        ctx.fill();
      }

      const rcx = cx + padX + 9 * k;
      if (i < 3) {
        ctx.fillStyle = medalColor[i];
        ctx.beginPath();
        ctx.arc(rcx, midY, Math.min(11 * k, rowH * 0.34), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(28, 50, 30, 0.92)';
        ctx.font = fontOf(Math.min(12 * k, rowH * 0.36), 'bold');
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.52)';
        ctx.font = fontOf(Math.min(13 * k, rowH * 0.40), 'bold');
      }
      ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), rcx, midY + 0.5);

      ctx.textAlign = 'left';
      ctx.fillStyle = isLast ? '#ffe57a' : 'rgba(255,255,255,0.92)';
      ctx.font = fontOf(fMain, 'bold');
      ctx.fillText(fitText(e.n || '玩家', nameMax), nameX, midY);

      ctx.textAlign = 'right';
      ctx.fillStyle = isLast ? '#ffe57a' : '#ffffff';
      ctx.font = fontOf(fMain, 'bold');
      ctx.fillText(String(e.s), scoreX, midY);

      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255,255,255,0.38)';
      ctx.font = fontOf(fSub);
      ctx.fillText(fmtTime(e.t), timeX, midY + 0.5);
    }
  }

  // 底部：保存长图 + 提示
  const sbW = Math.min(112 * k, cw * 0.36);
  const sbH = 27 * k;
  const sbX = cx + 18 * k;
  const sbY = cy + ch - footerH + 7 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  rr(ctx, sbX, sbY, sbW, sbH, sbH / 2);
  ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.font = fontOf(11.5 * k, 'bold');
  ctx.fillText('保存长图', sbX + sbW / 2, sbY + sbH / 2 + 0.5);
  addHit(sbX - 4 * k, sbY - 4 * k, sbW + 8 * k, sbH + 8 * k, exportBoardImage);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.34)';
  ctx.font = fontOf(9.5 * k);
  ctx.fillText('点击空白处关闭', cx + cw - 18 * k, sbY + sbH / 2);
}

/* ============================================================
 *  19. 自适应 UI
 * ============================================================ */
function drawUI(now) {
  const land = isLandscape();
  const k = uiScale();
  const uiTop = (land ? 12 : 16) * k + safeTop;

  const scoreSize = (land ? 36 : 46) * k;
  const subSize = (land ? 12 : 14) * k;
  const comboSize = (land ? 15 : 18) * k;

  // 分数（滚动动画 + 圆角描边，比直角描边干净）
  ctx.save();
  ctx.translate((land ? 22 : 26) * k, uiTop);
  const sc = 1 + scorePop * 0.25;
  ctx.scale(sc, sc);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';
  ctx.font = fontOf(scoreSize, 'bold');
  ctx.lineWidth = Math.max(4, scoreSize * 0.14);
  ctx.strokeStyle = 'rgba(24, 58, 34, 0.45)';
  ctx.strokeText(String(Math.round(displayScore)), 0, 0);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(Math.round(displayScore)), 0, 0);
  ctx.restore();

  // 最高分 + 连击
  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';

  const subX = (land ? 24 : 28) * k;
  const subY = uiTop + scoreSize * 0.99 + (land ? 4 : 6) * k;

  ctx.font = fontOf(subSize);
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(24, 58, 34, 0.34)';
  ctx.strokeText('最高 ' + best, subX, subY);
  ctx.fillStyle = 'rgba(255,255,255,0.86)';
  ctx.fillText('最高 ' + best, subX, subY);

  if (combo >= 2) {
    const cy2 = subY + subSize * 1.75;
    const pulse = 1 + Math.max(0, Math.sin(now / 230)) * 0.045;
    ctx.save();
    ctx.translate(subX, cy2);
    ctx.scale(pulse, pulse);
    ctx.font = fontOf(comboSize, 'bold');
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(24, 58, 34, 0.40)';
    ctx.strokeText('连击 x' + combo, 0, 0);
    ctx.fillStyle = '#9ef07a';
    ctx.fillText('连击 x' + combo, 0, 0);
    ctx.restore();
  }
  ctx.restore();

  // 蓄力条
  if (charging) {
    const bw = Math.min(W * (land ? 0.34 : 0.50), (land ? 300 : 280) * k);
    const bx = (W - bw) / 2;
    const bh = (land ? 8 : 10) * k;
    const by = H - (land ? 32 : 48) * k - safeBottom;

    // 底槽
    ctx.fillStyle = 'rgba(10, 30, 18, 0.28)';
    rr(ctx, bx - 2, by - 2, bw + 4, bh + 4, (bh + 4) / 2);
    ctx.fill();

    const full = charge > 0.985;
    const blink = full && Math.floor(now / 90) % 2 === 0;

    const cg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    cg.addColorStop(0, blink ? '#fff9c4' : '#8ee06a');
    cg.addColorStop(0.6, blink ? '#fff59d' : '#ffd93b');
    cg.addColorStop(1, blink ? '#ffd54f' : '#ff6b4a');
    ctx.fillStyle = cg;
    rr(ctx, bx, by, Math.max(bh, bw * charge), bh, bh / 2);
    ctx.fill();

    // 25% 刻度：给“按多久跳多远”一个参照
    ctx.strokeStyle = 'rgba(255,255,255,0.40)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 1; i < 4; i++) {
      const tx = bx + bw * i / 4;
      ctx.moveTo(tx, by - 1.5);
      ctx.lineTo(tx, by + bh + 1.5);
    }
    ctx.stroke();

    // 顶部高光
    if (charge > 0.04) {
      ctx.fillStyle = 'rgba(255,255,255,0.26)';
      rr(ctx, bx + 1, by + 1, Math.max(1, bw * charge - 2), bh * 0.40, bh * 0.2);
      ctx.fill();
    }
  }

  // 新手提示
  if (gameState === 'playing' && !tutorialDone && !charging) {
    const fs = (land ? 14 : 16) * k;
    const pulse = 0.72 + Math.sin(now / 380) * 0.22;
    const hy = H - (land ? 62 : 86) * k - safeBottom;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = pulse;
    ctx.font = fontOf(fs);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(18, 44, 26, 0.50)';
    ctx.strokeText('按住屏幕蓄力，松开跳跃', W / 2, hy);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('按住屏幕蓄力，松开跳跃', W / 2, hy);

    // 呼吸的小箭头
    const ay = hy + fs * 1.3 + Math.sin(now / 320) * 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(W / 2, ay - 7);
    ctx.lineTo(W / 2, ay + 6);
    ctx.moveTo(W / 2 - 6, ay);
    ctx.lineTo(W / 2, ay + 6);
    ctx.lineTo(W / 2 + 6, ay);
    ctx.stroke();
    ctx.restore();
  }

  drawButtons();
}

/* 通用圆角胶囊按钮 */
function drawPill(bx, by, bw, bh, c1, c2, label, labelSize) {
  const r = bh / 2;
  const g = ctx.createLinearGradient(0, by, 0, by + bh);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.fillStyle = g;
  rr(ctx, bx, by, bw, bh, r);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  rr(ctx, bx + 2, by + 2, bw - 4, bh * 0.44, r * 0.8);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf(labelSize, 'bold');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, bx + bw / 2, by + bh / 2 + 1);
}

/* 小号开关胶囊 */
function drawToggle(x, y, w, h, on, label) {
  const r = h / 2;
  ctx.fillStyle = on ? 'rgba(126, 222, 156, 0.92)' : 'rgba(255,255,255,0.14)';
  rr(ctx, x, y, w, h, r);
  ctx.fill();
  ctx.fillStyle = on ? '#12331e' : 'rgba(255,255,255,0.68)';
  ctx.font = fontOf(h * 0.44, 'bold');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 0.5);
}

function drawPaused() {
  const land = isLandscape();
  const k = uiScale();
  ctx.fillStyle = 'rgba(10, 26, 16, 0.66)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const bw = (land ? 196 : 224) * k;
  const bh = (land ? 44 : 50) * k;
  const gap = 10 * k;
  const colW = (bw - gap) / 2;
  const bh2 = bh * 0.84;
  const bh3 = bh * 0.6;

  const titleY = H * (land ? 0.26 : 0.30);
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf((land ? 28 : 32) * k, 'bold');
  ctx.fillText('已暂停', W / 2, titleY);

  const by = titleY + (land ? 44 : 54) * k;
  drawPill(W / 2 - bw / 2, by, bw, bh, '#63d977', '#38974a', '继续', 17 * k);
  addHit(W / 2 - bw / 2, by, bw, bh, function () { togglePause(); });

  const by2 = by + bh + gap;
  drawPill(W / 2 - bw / 2, by2, colW, bh2,
    'rgba(255,255,255,0.24)', 'rgba(255,255,255,0.12)', '排行榜', 13 * k);
  drawPill(W / 2 + gap / 2, by2, colW, bh2,
    'rgba(255,255,255,0.24)', 'rgba(255,255,255,0.12)', '重新开始', 13 * k);
  addHit(W / 2 - bw / 2, by2, colW, bh2, function () { boardOpen = true; });
  addHit(W / 2 + gap / 2, by2, colW, bh2, function () {
    boardOpen = false;
    reset();
    beep(520, 0.08, 'sine', 0.09);
  });

  const by3 = by2 + bh2 + gap;
  drawToggle(W / 2 - bw / 2, by3, colW, bh3, !muted, muted ? '音效 关' : '音效 开');
  drawToggle(W / 2 + gap / 2, by3, colW, bh3, hapticsOn, hapticsOn ? '震动 开' : '震动 关');
  addHit(W / 2 - bw / 2, by3, colW, bh3, function () { setMuted(!muted); });
  addHit(W / 2 + gap / 2, by3, colW, bh3, function () { setHaptics(!hapticsOn); });

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.60)';
  ctx.font = fontOf((land ? 12 : 13) * k);
  ctx.fillText('点击空白处继续游戏', W / 2, by3 + bh3 + (land ? 22 : 28) * k);
}

function drawOver() {
  const land = isLandscape();
  const k = uiScale();

  // 淡入，避免瞬间糊一脸
  const age = clamp((performance.now() - overAt) / 240, 0, 1);
  const ease = 1 - Math.pow(1 - age, 3);

  ctx.globalAlpha = age;
  ctx.fillStyle = 'rgba(10, 26, 16, 0.66)';
  ctx.fillRect(0, 0, W, H);

  const cw = Math.min(W * 0.84, 340 * k);
  const ch = Math.min(H * 0.78, (land ? 320 : 392) * k);
  const cx = W / 2 - cw / 2;
  const cy = H / 2 - ch / 2 + (1 - ease) * 14;

  // 面板
  const pg = ctx.createLinearGradient(0, cy, 0, cy + ch);
  pg.addColorStop(0, 'rgba(40, 78, 52, 0.96)');
  pg.addColorStop(1, 'rgba(20, 46, 30, 0.96)');
  ctx.fillStyle = pg;
  rr(ctx, cx, cy, cw, ch, 20 * k);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const isRecord = score > runBest && score > 0;

  // 标题
  ctx.fillStyle = isRecord ? '#ffd93b' : 'rgba(255,255,255,0.88)';
  ctx.font = fontOf(13 * k, 'bold');
  ctx.fillText(isRecord ? '★ 新纪录 ★' : '游戏结束', W / 2, cy + ch * 0.12);

  // 分数
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf(Math.min(cw * 0.30, 66 * k), 'bold');
  ctx.fillText(String(score), W / 2, cy + ch * 0.30);

  // 最高分 + 本局名次
  ctx.fillStyle = 'rgba(255,255,255,0.60)';
  ctx.font = fontOf(12 * k);
  ctx.fillText(
    lastRank > 0 ? '最高分 ' + best + '   ·   本局第 ' + lastRank + ' 名' : '最高分  ' + best,
    W / 2, cy + ch * 0.43
  );

  // 差多少分破纪录，比只报一个最高分更能推人再来一局
  if (best > score) {
    ctx.fillStyle = 'rgba(255,255,255,0.40)';
    ctx.font = fontOf(10.5 * k);
    ctx.fillText('距离最高分还差 ' + (best - score) + ' 分', W / 2, cy + ch * 0.472);
  }

  // 分隔线
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx + cw * 0.12, cy + ch * 0.50);
  ctx.lineTo(cx + cw * 0.88, cy + ch * 0.50);
  ctx.stroke();

  // 统计三列
  const stats = [
    ['最高连击', 'x' + maxCombo],
    ['完美', String(perfectCount)],
    ['惊险', String(rescueCount)]
  ];
  const colW = cw / 3;
  for (let i = 0; i < 3; i++) {
    const sx = cx + colW * (i + 0.5);
    ctx.fillStyle = '#ffffff';
    ctx.font = fontOf(15 * k, 'bold');
    ctx.fillText(stats[i][1], sx, cy + ch * 0.585);
    ctx.fillStyle = 'rgba(255,255,255,0.52)';
    ctx.font = fontOf(10.5 * k);
    ctx.fillText(stats[i][0], sx, cy + ch * 0.675);
  }

  // 按钮：再来一次 + 排行榜
  const bh = (land ? 44 : 50) * k;
  const by = cy + ch * 0.775;
  const gap = 10 * k;
  const bw1 = Math.min(cw * 0.50, 152 * k);
  const bw2 = Math.min(cw * 0.32, 98 * k);
  const total = bw1 + gap + bw2;
  const bx1 = W / 2 - total / 2;
  const bx2 = bx1 + bw1 + gap;

  drawPill(bx1, by, bw1, bh, '#63d977', '#38974a', '再来一次', 15.5 * k);
  drawPill(bx2, by, bw2, bh, 'rgba(255,255,255,0.24)', 'rgba(255,255,255,0.12)', '排行榜', 13.5 * k);

  addHit(bx1, by, bw1, bh, restartGame);
  addHit(bx2, by, bw2, bh, function () { boardOpen = true; });

  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.font = fontOf(10.5 * k);
  ctx.fillText('点击空白处重新开始', W / 2, by + bh + 15 * k);

  ctx.globalAlpha = 1;
}

function render(now) {
  const ty = topY();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  ctx.save();
  if (punch > 0.004) {
    // 以角色为中心轻微推近，落地那一瞬间会「实」很多
    const z = 1 + punch * 0.016;
    const px = player.x - camX, py = player.y - 16;
    ctx.translate(px, py);
    ctx.scale(z, z);
    ctx.translate(-px, -py);
  }
  if (shake > 0.12) {
    ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake * 0.7);
  }

  drawSky();
  drawStars(now);
  drawSun();
  drawClouds(now);
  tileLayer(hillFar, 0.10, ty + 30, 1);
  tileLayer(hillNear, 0.20, ty + 40, 1);
  tileLayer(treeFar, 0.30, ty + 26, 0.92);
  tileLayer(treeMid, 0.52, ty + 46, 1);
  drawFog();
  drawGround();

  drawPlatforms(now);
  drawTrajectory(now);
  drawTrail();
  drawPlayer(now);
  drawFx();
  drawLeaves();
  drawFireflies(now);
  drawForeground();

  ctx.restore();

  drawGlows(now);
  drawDuskTint();
  drawVignette();
  drawUI(now);

  clearHits();
  if (boardOpen) drawBoard();
  else if (gameState === 'paused') drawPaused();
  else if (gameState === 'over') drawOver();
}

/* ============================================================
 *  20. 落叶
 * ============================================================ */
function initLeaves() {
  leaves = [];
  const n = perfLevel >= 2 ? 8 : CFG.leafCount;
  for (let i = 0; i < n; i++) {
    leaves.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vy: 20 + Math.random() * 45,
      vx: -10 + Math.random() * 20,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 3,
      size: 4 + Math.random() * 5,
      color: Math.random() < 0.5 ? '#a9cc6b' : '#d8ab4f',
      sway: Math.random() * Math.PI * 2
    });
  }
}

/* ============================================================
 *  21. 主循环
 * ============================================================ */
let lastTime = performance.now();
let acc = 0;

function loop(now) {
  requestAnimationFrame(loop);

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  if (gameState !== 'paused') {
    if (hitstop > 0) {
      hitstop -= dt;
      if (hitstop < 0) hitstop = 0;
      acc = 0;                       // 顿帧期间不攒时间，否则恢复会瞬移
    } else {
      acc += dt;
      if (acc > 0.25) acc = 0.25;    // 长时间卡顿后不要连爆几十步
      let guard = 0;
      while (acc >= CFG.step && guard < 12) {
        fixedUpdate(CFG.step);
        acc -= CFG.step;
        guard++;
      }
      visualUpdate(dt, now);
    }
    updatePerf(now, dt);             // 采样不受顿帧影响
  }

  render(now);
}

/* ============================================================
 *  22. 事件
 * ============================================================ */
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (gameState === 'playing') togglePause();
  }
});

function onResize() {
  resizeCanvas();
  buildScene();
  if (player) {
    if (player.state === 'idle') player.y = topY();
    camX = player.x - W * camAnchor();
  }
  initLeaves();
  initFireflies();
}

let resizeTimer = 0;
function scheduleResize() {
  if (nameEditing) return;
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(onResize, 140);
}

document.addEventListener('fullscreenchange', scheduleResize);
document.addEventListener('webkitfullscreenchange', scheduleResize);
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', scheduleResize);
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', scheduleResize);
}

/* ============================================================
 *  23. 启动
 * ============================================================ */
resizeCanvas();
buildScene();
reset();
initLeaves();
requestAnimationFrame(loop);

})();
</script>
