
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#79c6e8">
<title>跳一跳 · 森林</title>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; height: 100dvh; overflow: hidden;
    position: fixed; inset: 0;
    background: #1b2a1f;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }

  /* 昵称输入框：平时隐藏，点“昵称”那行才浮出来 */
  #nameInput {
    position: fixed; left: 50%; transform: translateX(-50%);
    display: none;
    width: min(70vw, 260px);
    padding: 9px 14px;
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 12px;
    background: rgba(18, 42, 27, 0.97);
    color: #fff;
    font-size: 16px;           /* 小于 16px 时 iOS 会放大页面 */
    font-family: inherit;
    text-align: center;
    outline: none;
    z-index: 10;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #nameInput.on { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<input id="nameInput" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">

<script>
(function () {
'use strict';

/* ============================================================
 *  1. 画布 / 尺寸 / 安全区
 * ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;   // DPR = 实际使用的像素比（屏幕 DPR × 降级系数）
let baseDPR = 1;             // 屏幕原始像素比（上限 2.5，避免 3x 屏过度铺像素）
let resScale = 1;            // 性能自适应系数：1 / 0.82 / 0.68
let safeTop = 0, safeBottom = 0;

function readSafeArea() {
  try {
    const cs = getComputedStyle(document.documentElement);
    const t = parseFloat(cs.getPropertyValue('--sat'));
    const b = parseFloat(cs.getPropertyValue('--sab'));
    safeTop = isNaN(t) ? 0 : t;
    safeBottom = isNaN(b) ? 0 : b;
  } catch (e) { safeTop = 0; safeBottom = 0; }
}

function resizeCanvas() {
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  baseDPR = Math.min(window.devicePixelRatio || 1, 2);
  DPR = baseDPR * resScale;

  const cw = Math.max(1, Math.round(W * DPR));
  const ch = Math.max(1, Math.round(H * DPR));
  // 尺寸没变就不赋值，避免无谓地清空画布
  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  readSafeArea();
}

/* ============================================================
 *  2. 配置
 * ============================================================ */
const CFG = {
  gravity: 2400,
  maxChargeMs: 900,
  minDist: 60,
  maxDist: 430,
  perfectR: 0.12,       // 完美半径 = 平台宽 × 比例（夹在 6.5~11px，窄平台不至于过苛）
  mercyPx: 7,
  hitstopMs: 55,
  step: 1 / 120,
  trailDots: 14,
  trailLife: 0.32,
  springChance: 0.16,
  swayChance: 0.17,      // 会左右摆动的柱子出现概率
  springBonus: 3,
  poolMax: 300,
  fireflyBase: 16,
  duskScore: 60,         // 到达此分数时天色完全进入黄昏
  inputBufferMs: 170,    // 落地前这么久内按下，落地后自动开始蓄力
  previewHintJumps: 8,   // 前几次跳跃显示落点加分预览，之后只显示落点
  popupMax: 24,          // 飘字上限
  ringMax: 14,           // 光环上限
  leafCount: 15,
  starCount: 46
};

/* ============================================================
 *  在线排行榜配置
 *  1) 把服务端跑起来（示例见随附的 leaderboard-server-example.js）
 *  2) 把下面的 url 换成你的地址，enabled 改成 true
 *  协议：GET  返回 { "scores": [ { "name": "小明", "score": 42, "at": 1699999999999 } ] }
 *        POST 提交 { "name": "小明", "score": 42, "at": 1699999999999 }
 *  没配置时一切照旧，只用本机榜，不会报错也不会卡顿
 * ============================================================ */
const ONLINE = {
  enabled: false,
  url: '',
  timeoutMs: 4500
};

/* 不想改代码的话：用 ?api=你的地址 打开一次页面，地址就会记在本地，
   以后直接打开也能用。例如 index.html?api=https://xxx.workers.dev/board */
try {
  if (typeof location !== 'undefined' && location.search) {
    const m = /[?&]api=([^&]+)/.exec(location.search);
    if (m) localStorage.setItem('jf_api', decodeURIComponent(m[1]));
  }
  const savedApi = localStorage.getItem('jf_api');
  if (savedApi && /^https?:\/\//.test(savedApi)) {
    ONLINE.url = savedApi;
    ONLINE.enabled = true;
  }
} catch (e) {}

/* ============================================================
 *  3. 工具 & 屏幕方向
 * ============================================================ */
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* 字体字符串缓存：避免每帧拼字符串 + 重复解析 */
const FONT_FAMILY = '"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif';
const fontCache = Object.create(null);
function fontOf(size, weight) {
  const px = Math.round(size);
  const key = (weight || '') + px;
  let f = fontCache[key];
  if (f === undefined) {
    f = (weight ? weight + ' ' : '') + px + 'px ' + FONT_FAMILY;
    fontCache[key] = f;
  }
  return f;
}

/* UI 整体缩放：小屏不至于糊住画面，大屏不至于太小 */
function uiScale() { return clamp(Math.min(W, H) / 400, 0.82, 1.15); }
function rnd(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function isLandscape() { return W > H; }

function topY() {
  if (isLandscape()) {
    return Math.min(H * 0.70, H - 90);
  }
  return Math.max(H * 0.5, Math.min(H * 0.72, H - 140));
}

function camAnchor() {
  return isLandscape() ? 0.26 : 0.32;
}

function getBtnRadius() {
  return isLandscape() ? 17 : 20;
}

function makeLayerCanvas(w, h, scale) {
  const c = document.createElement('canvas');
  const d = Math.min(DPR, scale || 1.5);
  c.width = Math.max(1, Math.ceil(w * d));
  c.height = Math.max(1, Math.ceil(h * d));
  const g = c.getContext('2d');
  g.scale(d, d);
  return { c: c, g: g, w: w, h: h };
}

// 颜色插值（用于昼夜渐变）
function lerpHex(a, b, t) {
  const na = parseInt(a.slice(1), 16);
  const nb = parseInt(b.slice(1), 16);
  const ar = (na >> 16) & 255, ag = (na >> 8) & 255, ab = na & 255;
  const br = (nb >> 16) & 255, bg = (nb >> 8) & 255, bb = nb & 255;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

/* ============================================================
 *  4. 触觉反馈
 * ============================================================ */
let hapticsOn = true;
try { hapticsOn = localStorage.getItem('jf_haptic') !== '0'; } catch (e) {}

function vibrate(ms) {
  if (!hapticsOn) return;
  if (navigator.vibrate) {
    try { navigator.vibrate(ms); } catch (e) {}
  }
}

function setHaptics(on) {
  hapticsOn = !!on;
  try { localStorage.setItem('jf_haptic', hapticsOn ? '1' : '0'); } catch (e) {}
  if (hapticsOn) vibrate(12);
}

/* ============================================================
 *  5. 音效
 * ============================================================ */
let actx = null, chargeOsc = null, chargeGain = null, muted = false;
try { muted = localStorage.getItem('jf_mute') === '1'; } catch (e) {}

function setMuted(on) {
  muted = !!on;
  try { localStorage.setItem('jf_mute', muted ? '1' : '0'); } catch (e) {}
  if (muted) stopChargeSound();
}

function ensureAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume().catch(function () {});
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { actx = new AC(); } catch (e) { actx = null; }
}

function beep(freq, dur, type, vol, slideTo, delay) {
  if (!actx || muted) return;
  try {
    const t0 = actx.currentTime + (delay || 0);
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  } catch (e) {}
}

function startChargeSound() {
  if (!actx || muted) return;
  stopChargeSound();
  try {
    const t = actx.currentTime;
    chargeOsc = actx.createOscillator();
    chargeGain = actx.createGain();
    chargeOsc.type = 'sine';
    chargeOsc.frequency.setValueAtTime(160, t);
    chargeGain.gain.setValueAtTime(0.0001, t);
    chargeGain.gain.linearRampToValueAtTime(0.045, t + 0.06);
    chargeOsc.connect(chargeGain).connect(actx.destination);
    chargeOsc.start(t);
  } catch (e) { chargeOsc = null; chargeGain = null; }
}

function setChargeFreq(c) {
  if (!chargeOsc || !actx) return;
  try { chargeOsc.frequency.setTargetAtTime(160 + c * 620, actx.currentTime, 0.04); } catch (e) {}
}

function stopChargeSound() {
  if (!chargeOsc || !actx) { chargeOsc = null; chargeGain = null; return; }
  try {
    const t = actx.currentTime;
    chargeGain.gain.cancelScheduledValues(t);
    chargeGain.gain.setValueAtTime(Math.max(0.0001, chargeGain.gain.value), t);
    chargeGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    chargeOsc.stop(t + 0.09);
  } catch (e) {}
  chargeOsc = null;
  chargeGain = null;
}

const COMBO_SCALE = [880, 988, 1047, 1175, 1319, 1480, 1661, 1760];
function comboNote(c) {
  return COMBO_SCALE[Math.min(Math.max(c - 1, 0), COMBO_SCALE.length - 1)];
}

/* ============================================================
 *  6. 对象池
 * ============================================================ */
const particlePool = [];
const popupPool = [];
const ringPool = [];

function acquireParticle() { return particlePool.pop() || {}; }
function releaseParticle(p) { if (particlePool.length < CFG.poolMax) particlePool.push(p); }
function acquirePopup() { return popupPool.pop() || {}; }
function releasePopup(p) { if (popupPool.length < CFG.poolMax) popupPool.push(p); }
function acquireRing() { return ringPool.pop() || {}; }
function releaseRing(p) { if (ringPool.length < CFG.poolMax) ringPool.push(p); }

/* ============================================================
 *  7. 性能自适应
 * ============================================================ */
let perfLevel = 0;
let perfSum = 0, perfCount = 0, perfStart = 0, perfHold = 0;

const RES_SCALE = [1, 0.82, 0.68];   // 三档渲染分辨率

function applyPerfLevel() {
  const target = RES_SCALE[perfLevel];
  if (Math.abs(target - resScale) < 0.001) return;
  resScale = target;
  resizeCanvas();
  // 只重建真正跟分辨率绑定的精灵。
  // 以前这里整场 buildScene()：树林/山丘是几张上千像素长的画布，
  // 偏偏在设备已经开始掉帧的那一刻去重建，越卡越卡。
  playerSprite = buildPlayerSprite();
  cloudSprite = buildCloudSprite();
  platSpriteCache.clear();
  if (player && player.state === 'idle') player.y = topY();
}

function updatePerf(now, dt) {
  if (perfStart === 0) perfStart = now;
  perfSum += dt;
  perfCount++;
  if (now - perfStart < 2000) return;

  const avg = perfCount > 12 ? perfSum / perfCount : 0;
  if (perfHold > 0) {
    perfHold--;
  } else if (avg > 0.027 && perfLevel < 2) {
    perfLevel++;
    perfHold = 2;                     // 降级后先观察两轮，避免来回抖动
    applyPerfLevel();
  } else if (avg < 0.0145 && perfLevel > 0) {
    perfLevel--;
    perfHold = 2;
    applyPerfLevel();
  }
  perfSum = 0; perfCount = 0; perfStart = now;
}

function particleCap() {
  return perfLevel >= 2 ? 70 : (perfLevel >= 1 ? 150 : 260);
}
function fireflyTarget() {
  return perfLevel >= 2 ? 8 : (perfLevel >= 1 ? 12 : CFG.fireflyBase);
}

/* ============================================================
 *  8. 预渲染资源
 * ============================================================ */
let skyGrad = null, groundGrad = null, sunGrad = null, fogGrad = null;
let sunX = 0, sunY = 0, sunR = 0;
let sunCoreColor = '#fff8d0';
let hillFar = null, hillNear = null;
let treeFar = null, treeMid = null;
let groundTex = null, glowSprite = null;
let playerSprite = null, cloudSprite = null;
let vignette = null, starField = null, fgLayer = null;

function drawPineOn(g, x, baseY, h, color, trunk) {
  const w = h * 0.52;
  g.fillStyle = trunk;
  g.fillRect(x - h * 0.034, baseY - h * 0.26, h * 0.068, h * 0.26 + 1);
  g.fillStyle = color;
  const L = [
    [baseY - h * 0.16, baseY - h * 0.60, w],
    [baseY - h * 0.42, baseY - h * 0.83, w * 0.76],
    [baseY - h * 0.63, baseY - h * 1.00, w * 0.52]
  ];
  for (let i = 0; i < 3; i++) {
    const yb = L[i][0], yt = L[i][1], ww = L[i][2];
    g.beginPath();
    g.moveTo(x, yt);
    g.lineTo(x - ww / 2, yb);
    g.lineTo(x + ww / 2, yb);
    g.closePath();
    g.fill();
  }
}

function buildTreeLayer(spacing, hMin, hMax, color, trunk, seed) {
  const count = Math.max(4, Math.round(1600 / spacing));
  const stripW = spacing * count;
  const stripH = Math.ceil(hMax + 22);
  const L = makeLayerCanvas(stripW, stripH, 1.5);
  const g = L.g;
  const halfW = hMax * 0.26 + 6;
  const span = Math.max(1, stripW - halfW * 2);
  for (let i = 0; i < count; i++) {
    const r1 = rnd(i * 1.37 + seed);
    const r2 = rnd(i * 3.11 + seed);
    const x = halfW + ((i + 0.25 + r1 * 0.5) / count) * span;
    const h = hMin + r2 * (hMax - hMin);
    drawPineOn(g, x, stripH, h, color, trunk);
  }
  return { c: L.c, w: stripW, h: stripH };
}

function buildHillLayer(stripW, amp, ks, color) {
  const yMid = amp * 1.6;
  const h = Math.ceil(amp * 2.2);
  const L = makeLayerCanvas(stripW, h, 1.2);
  const g = L.g;
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(0, h);
  for (let x = 0; x <= stripW; x += 5) {
    const u = x / stripW;
    const v = Math.sin(u * Math.PI * 2 * ks[0]) * 0.5 +
              Math.sin(u * Math.PI * 2 * ks[1] + 1.7) * 0.3 +
              Math.sin(u * Math.PI * 2 * ks[2] + 0.9) * 0.12 + 0.55;
    g.lineTo(x, yMid - v * amp);
  }
  g.lineTo(stripW, h);
  g.closePath();
  g.fill();
  return { c: L.c, w: stripW, h: h, yMid: yMid };
}

function buildGroundTexture() {
  const s = 512;
  const L = makeLayerCanvas(s, s, 1.5);
  const g = L.g;
  for (let i = 0; i < 80; i++) {
    const x = rnd(i * 3.1 + 0.5) * s;
    const y = rnd(i * 7.7 + 1.2) * s;
    const r = 3 + rnd(i * 9.3 + 2.6) * 6;
    g.fillStyle = 'rgba(30, 80, 42, 0.18)';
    g.beginPath();
    g.ellipse(x, y, r * 1.7, r * 0.65, 0, 0, Math.PI * 2);
    g.fill();
  }
  g.strokeStyle = 'rgba(24, 62, 34, 0.30)';
  g.lineWidth = 2;
  g.lineCap = 'round';
  for (let i = 0; i < 30; i++) {
    const x = rnd(i * 5.3 + 3.1) * s;
    const y = rnd(i * 11.1 + 4.7) * s;
    g.beginPath();
    g.moveTo(x, y + 12);
    g.quadraticCurveTo(x + 4, y, x + 10, y - 8);
    g.stroke();
  }
  return { c: L.c, s: s };
}

function buildGlowSprite() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0.00, 'rgba(255, 253, 225, 0.55)');
  rg.addColorStop(0.35, 'rgba(255, 248, 195, 0.22)');
  rg.addColorStop(1.00, 'rgba(255, 248, 195, 0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, s, s);
  return c;
}

/* 云朵精灵：预渲染一朵标准云，运行时缩放绘制 */
function buildCloudSprite() {
  const d = Math.min(DPR, 2);
  const size = 180;
  const c = document.createElement('canvas');
  c.width = Math.ceil(size * d);
  c.height = Math.ceil(size * d);
  const g = c.getContext('2d');
  g.scale(d, d);

  const cx = size / 2;
  const cy = size / 2;
  const r = 44;

  g.fillStyle = '#ffffff';
  g.beginPath();
  g.arc(cx, cy, r * 0.62, 0, Math.PI * 2);
  g.arc(cx + r * 0.58, cy - r * 0.12, r * 0.46, 0, Math.PI * 2);
  g.arc(cx - r * 0.58, cy - r * 0.08, r * 0.42, 0, Math.PI * 2);
  g.arc(cx + r * 0.06, cy - r * 0.36, r * 0.46, 0, Math.PI * 2);
  g.fill();

  return { c: c, size: size, baseR: r };
}

/* 暗角：半分辨率即可（本身就是软渐变），每帧只需一次 drawImage */
function buildVignette() {
  const w = Math.max(2, Math.round(W * 0.5));
  const h = Math.max(2, Math.round(H * 0.5));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.scale(w / W, h / H);
  const rg = g.createRadialGradient(
    W * 0.5, H * 0.46, Math.min(W, H) * 0.20,
    W * 0.5, H * 0.50, Math.max(W, H) * 0.80
  );
  rg.addColorStop(0.00, 'rgba(8, 26, 16, 0)');
  rg.addColorStop(0.62, 'rgba(8, 26, 16, 0.10)');
  rg.addColorStop(1.00, 'rgba(8, 26, 16, 0.38)');
  g.fillStyle = rg;
  g.fillRect(0, 0, W, H);
  return c;
}

/* 星空：黄昏后渐显，位置固定，只闪烁不移动 */
function buildStars() {
  const arr = [];
  const n = perfLevel >= 2 ? 24 : CFG.starCount;
  for (let i = 0; i < n; i++) {
    const r1 = rnd(i * 4.7 + 2.1);
    const r2 = rnd(i * 9.1 + 5.3);
    const r3 = rnd(i * 2.3 + 7.7);
    arr.push({
      x: r1 * W,
      y: (0.04 + r2 * 0.46) * H,
      r: 0.6 + r3 * 1.6,
      ph: r1 * Math.PI * 2
    });
  }
  return arr;
}

function buildPlayerSprite() {
  const d = Math.min(DPR, 2);
  const minX = -20, maxX = 20, minY = -52, maxY = 4;
  const w = maxX - minX, h = maxY - minY;
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * d);
  c.height = Math.ceil(h * d);
  const g = c.getContext('2d');
  g.scale(d, d);
  g.translate(-minX, -minY);

  g.fillStyle = '#ff9a72';
  g.beginPath();
  g.arc(-8.58, -35, 5.6, 0, Math.PI * 2);
  g.arc(8.58, -35, 5.6, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = '#ffc9b2';
  g.beginPath();
  g.arc(-8.58, -35.5, 2.8, 0, Math.PI * 2);
  g.arc(8.58, -35.5, 2.8, 0, Math.PI * 2);
  g.fill();

  const bg = g.createLinearGradient(-13, -34, 13, 0);
  bg.addColorStop(0, '#ff9a72');
  bg.addColorStop(1, '#ef5f3c');
  g.fillStyle = bg;
  rr(g, -13, -34, 26, 34, 9);
  g.fill();

  g.fillStyle = 'rgba(255,255,255,0.28)';
  rr(g, -9.5, -30.5, 19, 10.88, 6);
  g.fill();

  g.fillStyle = '#e8543f';
  rr(g, -14, -13.6, 28, 6.5, 3.5);
  g.fill();
  g.fillStyle = '#ffb3a3';
  rr(g, -14, -13.6, 28, 2, 2);
  g.fill();

  g.fillStyle = 'rgba(255,130,110,0.42)';
  g.beginPath();
  g.ellipse(-8.5, -14.96, 3.4, 2.2, 0, 0, Math.PI * 2);
  g.ellipse(8.5, -14.96, 3.4, 2.2, 0, 0, Math.PI * 2);
  g.fill();

  return { c: c, minX: minX, minY: minY, w: w, h: h };
}

/* 根据 dayT 重建天空与太阳，仅在天色变化显著时调用 */
function rebuildSky() {
  const t = dayT;
  const land = isLandscape();

  const c0 = lerpHex('#79c6e8', '#f0a878', t);
  const c1 = lerpHex('#a9ddec', '#f8c890', t);
  const c2 = lerpHex('#cfe9d4', '#fce0b8', t);
  const c3 = lerpHex('#e6f2cf', '#fdf2d8', t);

  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0.00, c0);
  skyGrad.addColorStop(0.35, c1);
  skyGrad.addColorStop(0.65, c2);
  skyGrad.addColorStop(1.00, c3);

  sunX = W * (land ? 0.82 : 0.78);
  sunY = H * (land ? 0.20 : 0.14);
  sunR = Math.min(W, H) * 0.06 + (land ? 16 : 24);
  sunCoreColor = lerpHex('#fff8d0', '#ffc060', t);

  sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 3.6);
  sunGrad.addColorStop(0.00, 'rgba(255, 248, 200, 0.95)');
  sunGrad.addColorStop(0.30, 'rgba(255, 240, 170, 0.42)');
  sunGrad.addColorStop(1.00, 'rgba(255, 240, 170, 0)');
}

/* 最前景的草丛剪影：视差比树林更快，画面一下就有纵深了 */
function buildForeground() {
  const h = Math.max(34, Math.min(96, H * 0.14));
  const stripW = 1200;
  const L = makeLayerCanvas(stripW, h, 1.4);
  const g = L.g;
  const n = 52;
  for (let i = 0; i < n; i++) {
    const x = (i + rnd(i * 2.7 + 1.3) * 0.9) * (stripW / n);
    const hh = h * (0.40 + rnd(i * 5.1 + 2.9) * 0.60);
    const bw = 6 + rnd(i * 8.3 + 4.1) * 12;
    const lean = (rnd(i * 3.3 + 6.7) - 0.5) * 0.55;
    const a = 0.60 + rnd(i * 6.1 + 5.5) * 0.32;
    g.fillStyle = 'rgba(16, 40, 24, ' + a.toFixed(2) + ')';
    g.beginPath();
    g.moveTo(x - bw / 2, h + 2);
    g.quadraticCurveTo(x - bw * 0.2 + lean * 30, h - hh * 0.58, x + lean * 40, h - hh);
    g.quadraticCurveTo(x + bw * 0.24 + lean * 28, h - hh * 0.55, x + bw / 2, h + 2);
    g.closePath();
    g.fill();
  }
  return { c: L.c, w: stripW, h: h };
}

function drawForeground() {
  if (!fgLayer) return;
  let off = (camX * 1.25) % fgLayer.w;
  if (off < 0) off += fgLayer.w;
  const top = H - fgLayer.h;
  for (let x = -off; x < W; x += fgLayer.w) {
    ctx.drawImage(fgLayer.c, x, top, fgLayer.w, fgLayer.h);
  }
}

function buildScene() {
  const ty = topY();

  groundGrad = ctx.createLinearGradient(0, ty, 0, H);
  groundGrad.addColorStop(0.00, '#66b34d');
  groundGrad.addColorStop(0.22, '#4f9c42');
  groundGrad.addColorStop(1.00, '#2b6533');

  fogGrad = ctx.createLinearGradient(0, ty - 100, 0, ty + 70);
  fogGrad.addColorStop(0.00, 'rgba(228, 244, 222, 0)');
  fogGrad.addColorStop(0.55, 'rgba(228, 244, 222, 0.42)');
  fogGrad.addColorStop(1.00, 'rgba(228, 244, 222, 0)');

  hillFar  = buildHillLayer(1200, 150, [2, 5, 11], '#9ec9b4');
  hillNear = buildHillLayer(1000, 108, [3, 7, 13], '#7bb497');
  treeFar  = buildTreeLayer(62, 52, 112, '#5c9463', '#4a6b45', 11.3);
  treeMid  = buildTreeLayer(108, 92, 168, '#3b7a48', '#4a3524', 57.9);

  if (!groundTex) groundTex = buildGroundTexture();
  if (!glowSprite) glowSprite = buildGlowSprite();
  if (!cloudSprite) cloudSprite = buildCloudSprite();

  vignette = buildVignette();
  starField = buildStars();
  fgLayer = buildForeground();

  // 角色精灵依赖 DPR，每次重建都强制刷新
  playerSprite = buildPlayerSprite();

  // 按当前分数重建天色
  rebuildSky();

  platSpriteCache.clear();
  for (let i = 0; i < platforms.length; i++) platforms[i].sprite = null;
}

function loadBoard() {
  try {

    return a.filter(function (e) { return e && typeof e.s === 'number' && e.s > 0; })
            .sort(function (x, y) { return y.s - x.s || x.t - y.t; })
            .slice(0, 10);
  } catch (e) { return []; }
}

/* 把一局的成绩塞进榜里，返回名次（没进前 10 返回 0） */
function addRunToBoard(sc) {
  if (!(sc > 0)) return 0;
  const entry = { s: sc, t: Date.now(), n: playerName };
  onlineSubmit();
  board.push(entry);
  board.sort(function (a, b) { return b.s - a.s || a.t - b.t; });
  if (board.length > 10) board.length = 10;
  saveBoard();
  lastRunAt = entry.t;
  const idx = board.indexOf(entry);
  return idx < 0 ? 0 : idx + 1;
}

function saveName(nm) {

/* 统一成 { s, t, n } 结构，好和本机榜共用一套绘制 */
function normalizeOnline(arr) {
  const out = [];
  for (let i = 0; i < arr.length && out.length < 10; i++) {
    const e = arr[i] || {};
    const sc = Number(e.score !== undefined ? e.score : e.s);
    if (!isFinite(sc) || sc <= 0) continue;
    const t = Number(e.at !== undefined ? e.at : e.t);
    const nm = String(e.name !== undefined ? e.name : (e.n || '玩家')).slice(0, 12);
    out.push({ s: Math.round(sc), t: isFinite(t) ? t : 0, n: nm || '玩家' });
  }
  out.sort(function (a, b) { return b.s - a.s; });
  return out;
}

function onlineTimeoutSignal() {
  if (typeof AbortController === 'undefined') return { signal: undefined, clear: function () {} };
  const ctrl = new AbortController();
  const timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, ONLINE.timeoutMs);
  return { signal: ctrl.signal, clear: function () { clearTimeout(timer); } };
}

/* 提交本局成绩（不阻塞、失败也不提示，不影响游戏） */
function onlineSubmit() {
  if (!ONLINE.enabled || !ONLINE.url || typeof fetch !== 'function') return;
  try {
    const t = onlineTimeoutSignal();
    fetch(ONLINE.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: playerName, score: score, at: Date.now() }),
      signal: t.signal
    }).then(function () { t.clear(); }, function () { t.clear(); });
  } catch (e) {}
}

function onlineLoad() {
  if (!ONLINE.enabled || !ONLINE.url || typeof fetch !== 'function') {
    onlineState = 'off';
    return;
  }
  if (onlineState === 'loading') return;
  onlineState = 'loading';
  onlineMsg = '';
  try {
    const t = onlineTimeoutSignal();
    fetch(ONLINE.url, { method: 'GET', signal: t.signal })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        t.clear();
        const arr = j && (j.scores || j.board || j.list);
        onlineList = normalizeOnline(Array.isArray(arr) ? arr : []);
        onlineState = onlineList.length ? 'ok' : 'ok';
        onlineMsg = '';
      })
      .catch(function () {
        t.clear();
        onlineState = 'error';
        onlineMsg = '连不上服务器';
      });
  } catch (e) {
    onlineState = 'error';
    onlineMsg = '请求失败';
  }
}

function clearHits() { uiHits.length = 0; }

    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.fn;

  return null;
}

/* ---- 全屏 + 横屏锁定 ---- */
/* 在 APK 外壳（WebView）里，Fullscreen API 是废的，screen.orientation.lock() 也就跟着
   永远失败，横屏按钮点了没反应。外壳会注入 window.GameShell，遇到它就把「横屏 + 藏
   状态栏」整个交给原生 Activity 去做；浏览器里还是走原来的全屏 API。 */
const shell = (typeof window !== "undefined" && window.GameShell) || null;
const shellCanOrient = !!(shell && typeof shell.setGameMode === 'function');
let shellGameMode = false;

function isFullscreen() {
  if (shellCanOrient) return shellGameMode;
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function lockLandscape() {
  // 安卓 Chrome 只有在全屏下才允许锁方向；不支持的浏览器静默跳过
  const so = screen.orientation;
  if (so && typeof so.lock === 'function') {
    try { const p = so.lock('landscape'); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
}

function toggleFullscreen() {
  // 外壳里：真正的横屏
  if (shellCanOrient) {
    shellGameMode = !shellGameMode;
    try { shell.setGameMode(shellGameMode); } catch (e) { shellGameMode = false; }
    scheduleResize();     // 转屏后窗口尺寸会变，先自己重排一次，不等 resize 事件
    beep(shellGameMode ? 720 : 520, 0.08, 'sine', 0.10);
    return;
  }
  if (isFullscreen()) {
    try {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch (e) {}
    try {
      const p = document.exitFullscreen
        ? document.exitFullscreen()
        : (document.webkitExitFullscreen && document.webkitExitFullscreen());
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
    return;
  }
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn) return;
  try {
    const p = fn.call(el, { navigationUI: 'hide' });
    if (p && p.then) p.then(lockLandscape).catch(function () {});
    else lockLandscape();
  } catch (e) {}
}

/* ============================================================
 *  10. 平台
 * ============================================================ */
const PLAT_PAD = 14;          // 贴图左右留白
const PLAT_TOP_PAD = 16;      // 贴图顶部留白：给草丛用
const PLAT_BUCKET = 12;       // 宽度分桶粒度
const platSpriteCache = new Map();

/* 深度难度：30 分前是 0，之后到 150 分慢慢推到 1。
   原来 prog 在 30 分就封顶了，30 分之后每一跳的难度一模一样，高分区间很平。 */
function deepProg() {
  return clamp((score - 30) / 120, 0, 1);
}

/* 边缘救援半径：难度越高越不肯帮忙。
   判定和落点预览必须用同一个值，否则预览会骗人。 */
function mercyRadius() {
  return CFG.mercyPx - deepProg() * 2.5;
}

/* 柱子在世界时间 t 的横坐标（静止柱子就是它自己） */
function platXAt(p, t) {
  return p.sway ? p.baseX + Math.sin(t * p.sway.spd + p.sway.ph) * p.sway.amp : p.x;
}

function makePlatform(last) {
  const prog = Math.min(score / 30, 1);
  const deep = deepProg();

  // 连续失误时给一点手感补偿，别让人卡死在同一个距离上
  let help = 0;
  if (recentMisses >= 3) help = Math.min(0.16, (recentMisses - 2) * 0.05);

  const wMin = Math.max(38, 58 - prog * 14 - deep * 7) * (1 + help);
  const wMax = Math.max(52, 112 - prog * 44 - deep * 14) * (1 + help);
  const w = rand(wMin, wMax);
  const gMin = (58 + prog * 12 + deep * 16) * (1 - help);
  const gMax = Math.min(214, 148 + prog * 55 + deep * 14) * (1 - help);
  const gap = rand(gMin, gMax);
  const isSpring = score >= 3 && Math.random() < CFG.springChance;
  // 会左右摆动的柱子：落点预览会按「落地那一刻」的位置算，所以不会骗人
  const sway = (!isSpring && score >= 22 && Math.random() < CFG.swayChance)
    ? {
        amp: 8 + prog * 8 + deep * 4,
        spd: 0.55 + Math.random() * 0.5,
        ph: Math.random() * Math.PI * 2
      }
    : null;
  const bx = last.baseX + last.w + gap;

  return {
    x: sway ? bx + Math.sin(moveT * sway.spd + sway.ph) * sway.amp : bx,
    baseX: bx,
    w: w,
    squash: 0,
    spring: isSpring,
    sway: sway,
    sprite: null,
    spriteH: 0,
    glow: 0
  };
}

function ensurePlatforms() {
  let last = platforms[platforms.length - 1];
  const limit = camX + W + 420;
  while (last.x < limit) {
    last = makePlatform(last);
    platforms.push(last);
  }
  const cut = camX - 420;
  while (platforms.length > 4 && platforms[0].x + platforms[0].w < cut) {
    platforms.shift();
  }
}

function buildPlatformSprite(kind, bucket, columnH) {
  const isSpring = kind === 'spring';
  const isSway = kind === 'sway';
  const padX = 14;
  const top = PLAT_TOP_PAD;
  const w = bucket + padX * 2;
  const h = columnH;
  const L = makeLayerCanvas(w, h + top, 1.4);
  const g = L.g;
  // 先整体下移：草丛画在 y<0 的位置，以前直接落在画布外被裁掉了
  g.translate(0, top);
  const left = padX;
  const width = bucket;

  const grd = g.createLinearGradient(left, 0, left + width, 0);
  if (isSpring) {
    grd.addColorStop(0.00, '#2f6b35');
    grd.addColorStop(0.12, '#4c9145');
    grd.addColorStop(0.52, '#69b556');
    grd.addColorStop(0.88, '#3f7d3a');
    grd.addColorStop(1.00, '#295c2b');
  } else if (isSway) {
    grd.addColorStop(0.00, '#4a5f66');
    grd.addColorStop(0.12, '#708c92');
    grd.addColorStop(0.52, '#93b3b8');
    grd.addColorStop(0.88, '#62808a');
    grd.addColorStop(1.00, '#41565f');
  } else {
    grd.addColorStop(0.00, '#5f3a1c');
    grd.addColorStop(0.12, '#8a5629');
    grd.addColorStop(0.52, '#a56e3c');
    grd.addColorStop(0.88, '#7a4a24');
    grd.addColorStop(1.00, '#55311a');
  }
  g.fillStyle = grd;
  g.fillRect(left, 0, width, h);

  g.save();
  g.beginPath();
  g.rect(left, 0, width, h);
  g.clip();
  g.strokeStyle = isSpring ? 'rgba(20, 60, 25, 0.26)'
    : (isSway ? 'rgba(28, 52, 62, 0.26)' : 'rgba(48, 26, 10, 0.26)');
  g.lineWidth = 1.6;
  for (let i = 1; i <= 3; i++) {
    const lx = left + width * i / 4;
    g.beginPath();
    g.moveTo(lx, 10);
    g.bezierCurveTo(lx + 4, 80, lx - 4, 170, lx + 3, h);
    g.stroke();
  }
  g.restore();

  g.fillStyle = isSpring ? '#a6e07a' : (isSway ? '#9fe0ef' : '#cba06b');
  g.fillRect(left, 0, width, 9);
  g.fillStyle = 'rgba(255, 245, 220, 0.45)';
  g.fillRect(left, 0, width, 2.5);
  g.fillStyle = isSpring ? 'rgba(30, 80, 40, 0.30)'
    : (isSway ? 'rgba(20, 56, 70, 0.30)' : 'rgba(60, 34, 14, 0.28)');
  g.fillRect(left, 9, width, 2);

  if (isSpring) {
    g.fillStyle = 'rgba(190, 240, 140, 0.55)';
    for (let i = 0; i < 4; i++) {
      const mx = left + width * (0.12 + i * 0.24);
      g.beginPath();
      g.arc(mx, 3.5, 2.6, 0, Math.PI * 2);
      g.fill();
    }
  }

  g.strokeStyle = isSpring ? '#3f8a35' : (isSway ? '#57b6c9' : '#4f9b3f');
  g.lineWidth = 2;
  g.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const gx = left + width * (0.18 + i * 0.3);
    const gh = 5 + rnd(i * 3.7 + bucket * 0.13) * 6;
    g.beginPath();
    g.moveTo(gx, 1);
    g.quadraticCurveTo(gx + 3, -gh * 0.55, gx + 6.5, -gh);
    g.stroke();
  }

  return { c: L.c, w: w, h: h + top, top: top, columnH: h };
}

/* 平台贴图按「宽度分桶 + 材质」缓存复用。
   以前每生成一个平台就现场新建一张 (宽度 × 屏幕高度 × 1.4²) 的画布，
   高分时每一两秒就要新建一张，纹理上传和 GC 都会抖一下。 */
function getPlatformSprite(p) {
  const columnH = Math.ceil(H - topY() + 18);
  const bucket = Math.max(24, Math.round(p.w / PLAT_BUCKET) * PLAT_BUCKET);
  const kind = p.spring ? 'spring' : (p.sway ? 'sway' : 'wood');
  const key = kind + ':' + bucket + ':' + columnH;
  let sp = platSpriteCache.get(key);
  if (!sp) {
    if (platSpriteCache.size > 64) platSpriteCache.clear();
    sp = buildPlatformSprite(kind, bucket, columnH);
    platSpriteCache.set(key, sp);
  }
  return sp;
}

/* ============================================================
 *  11. 萤火虫
 * ============================================================ */
function spawnFirefly(initial) {
  return {
    x: Math.random() * W,
    y: initial ? H * 0.1 + Math.random() * H * 0.7 : H * 0.75 + Math.random() * H * 0.2,
    vx: -8 + Math.random() * 16,
    vy: -6 - Math.random() * 8,
    size: 1.6 + Math.random() * 2.2,
    life: 5 + Math.random() * 7,
    phase: Math.random() * Math.PI * 2,
    warm: Math.random() < 0.6
  };
}

function initFireflies() {
  fireflies = [];
  const n = fireflyTarget();
  for (let i = 0; i < n; i++) fireflies.push(spawnFirefly(true));
}

function updateFireflies(dt) {
  const target = fireflyTarget();
  while (fireflies.length > target) fireflies.pop();
  while (fireflies.length < target) fireflies.push(spawnFirefly(false));

  for (let i = 0; i < fireflies.length; i++) {
    const f = fireflies[i];
    f.phase += dt * 1.7;
    f.x += (f.vx + Math.sin(f.phase) * 6) * dt;
    f.y += f.vy * dt;
    f.life -= dt;
    if (f.y < H * 0.04) f.vy = Math.abs(f.vy);
    if (f.y > H * 0.95) f.vy = -Math.abs(f.vy);
    if (f.x < -12) f.x = W + 12;
    if (f.x > W + 12) f.x = -12;
    if (f.life <= 0) fireflies[i] = spawnFirefly(false);
  }
}

function drawFireflies(now) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < fireflies.length; i++) {
    const f = fireflies[i];
    const flicker = Math.sin(now * 0.0025 + f.phase) * 0.35 + 0.6;
    const fade = Math.min(1, f.life / 1.5);
    // 白天只是隐约的光点，黄昏之后才明显
    const a = flicker * fade * (0.28 + 0.72 * dayT);

    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = f.warm ? 'rgba(255, 240, 150, 1)' : 'rgba(190, 255, 170, 1)';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = 'rgba(255, 255, 225, 1)';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 0.55, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
 *  12. 重置
 * ============================================================ */
function reset() {
  stopChargeSound();
  platforms = [];
  const firstW = 112;
  platforms.push({ x: W * 0.2, baseX: W * 0.2, w: firstW, squash: 0, spring: false, sway: null, sprite: null, spriteH: 0, glow: 0 });
  for (let i = 0; i < 4; i++) platforms.push(makePlatform(platforms[platforms.length - 1]));

  player = {
    x: platforms[0].x + firstW / 2,
    y: topY(),
    vx: 0, vy: 0,
    squash: 1, rot: 0, rotSpeed: 0,
    state: 'idle',
    plat: platforms[0]
  };

  camX = player.x - W * camAnchor();
  runBest = best;
  score = 0; combo = 0; scorePop = 0; punch = 0; moveT = 0;
  swayTipShown = false;
  displayScore = 0;
  dayT = 0; skyDayT = 0;
  rebuildSky();                    // 修复：重开一局时天色还停在黄昏
  maxCombo = 0; perfectCount = 0; rescueCount = 0;
  charging = false; charge = 0; shake = 0;
  chargeFullBeeped = false;
  hitstop = 0;
  tutorialDone = false;
  eyeGlow = 0;
  recentMisses = 0;
  milestoneShown = 0;
  newRecordShown = false;
  sparkTimer = 0;
  wantCharge = false; chargeBufferAt = 0;
  jumpCount = 0;
  boardOpen = false;
  lastRank = 0;
  particles = []; popups = []; rings = []; trail = [];
  gameState = 'playing';
  acc = 0;
  lastTime = performance.now();    // 否则会用很久以前的基准算出超大 dt
  ensurePlatforms();
  initFireflies();
}

/* ============================================================
 *  13. 输入
 * ============================================================ */
function hitCircle(x, y, cx, cy, r) {
  const dx = x - cx, dy = y - cy;
  return dx * dx + dy * dy < r * r;
}

function btnSpacing() { return isLandscape() ? 42 : 48; }

function getMuteBtn() {
  const r = getBtnRadius();
  return { x: W - (isLandscape() ? 32 : 36), y: (isLandscape() ? 30 : 36) + safeTop, r: r + 3 };
}
function getPauseBtn() {
  const b = getMuteBtn();
  return { x: b.x, y: b.y + btnSpacing(), r: b.r };
}
function getFullscreenBtn() {
  const b = getPauseBtn();
  return { x: b.x, y: b.y + btnSpacing(), r: b.r };
}

function startCharge() {
  if (gameState !== 'playing' || player.state !== 'idle' || charging) return false;
  // 顿帧只是让画面停一下，不该吞掉玩家输入：
  // 落地那一两帧是按键最密集的时候，以前按下去会没反应。
  charging = true;
  chargeStart = performance.now();
  charge = 0;
  chargeFullBeeped = false;
  startChargeSound();
  return true;
}

function releaseCharge() {
  if (!charging) return;
  charging = false;
  stopChargeSound();

  const elapsed = Math.min(performance.now() - chargeStart, CFG.maxChargeMs);
  charge = 0;

  if (gameState !== 'playing' || player.state !== 'idle') return;

  tutorialDone = true;

  const t = elapsed / CFG.maxChargeMs;
  const dist = CFG.minDist + t * (CFG.maxDist - CFG.minDist);
  const vy0 = -(560 + dist * 0.75);
  const T = (2 * Math.abs(vy0)) / CFG.gravity;

  player.vx = dist / T;
  player.vy = vy0;
  player.rot = 0;
  player.rotSpeed = (Math.PI * 2) / T;
  player.state = 'jump';
  player.plat = null;
  jumpCount++;

  spawnDust(player.x, topY(), 5, 0.7);
  vibrate(8);
  beep(520, 0.13, 'triangle', 0.10, 760);
}

function onDown(e) {
  e.preventDefault();
  if (e.isPrimary === false) return;      // 只认第一根手指，别被多点触控打断
  ensureAudio();
  const x = e.clientX || 0, y = e.clientY || 0;

  if (nameEditing) { closeNameEditor(true); return; }

  // 面板上的按钮（结算/暂停/排行榜）优先
  const hit = hitTest(x, y);
  if (hit) { hit(); return; }

  if (boardOpen) { boardOpen = false; return; }   // 点空白处关闭排行榜

  const mb = getMuteBtn();
  if (hitCircle(x, y, mb.x, mb.y, mb.r)) {
    setMuted(!muted);
    return;
  }

  const pb = getPauseBtn();
  if (hitCircle(x, y, pb.x, pb.y, pb.r)) {
    togglePause();
    return;
  }

  const fb = getFullscreenBtn();
  if (hitCircle(x, y, fb.x, fb.y, fb.r)) {
    toggleFullscreen();
    return;
  }

  if (gameState === 'paused') { togglePause(); return; }

  if (gameState === 'over') { restartGame(); return; }
  // 空中按下先记下来，落地立刻接上蓄力（跟手很多）
  if (!startCharge() && player.state === 'jump') {
    wantCharge = true;
    chargeBufferAt = performance.now();
  }
}

function onUp(e) {
  if (e) e.preventDefault();
  if (e && e.isPrimary === false) return;
  wantCharge = false;          // 手指已抬起，缓冲作废
  releaseCharge();
}

canvas.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointerup', onUp, { passive: false });
window.addEventListener('pointercancel', onUp, { passive: false });

window.addEventListener('keydown', function (e) {
  if (nameEditing || document.activeElement === nameInputEl) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (e.repeat) return;
    ensureAudio();
    if (gameState === 'paused') { togglePause(); return; }
    if (gameState === 'over') { restartGame(); return; }
    if (!startCharge() && player.state === 'jump') {
      wantCharge = true;
      chargeBufferAt = performance.now();
    }
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    e.preventDefault();
    if (boardOpen) { boardOpen = false; return; }
    if (gameState === 'playing' || gameState === 'paused') togglePause();
  } else if (e.code === 'KeyF') {
    e.preventDefault();
    toggleFullscreen();
  }
}, { passive: false });

window.addEventListener('keyup', function (e) {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (gameState === 'playing') releaseCharge();
  }
}, { passive: false });

window.addEventListener('blur', function () {
  if (charging) releaseCharge();
  if (gameState === 'playing') togglePause();
});

/* ============================================================
 *  14. 暂停
 * ============================================================ */
function restartGame() {
  if (performance.now() - overAt < 420) return;
  boardOpen = false;
  reset();
  beep(520, 0.08, 'sine', 0.10);
  beep(780, 0.12, 'sine', 0.09, null, 0.09);
}

function togglePause() {
  if (gameState === 'over') return;
  boardOpen = false;

  if (gameState === 'playing') {
    if (charging) { charging = false; charge = 0; stopChargeSound(); }
    gameState = 'paused';
    pauseAt = performance.now();
  } else if (gameState === 'paused') {
    const delta = performance.now() - pauseAt;
    chargeStart += delta;
    lastTime = performance.now();
    acc = 0;
    gameState = 'playing';
  }
}

/* ============================================================
 *  15. 得分 / 结束
 * ============================================================ */
function spawnDust(x, y, count, scale) {
  const cap = particleCap();
  if (particles.length >= cap) return;
  const n = count || 7;
  const sc = scale || 1;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
    const sp = (35 + Math.random() * 90) * sc;
    const p = acquireParticle();
    p.x = x;
    p.y = y - 2;
    p.vx = Math.cos(a) * sp;
    p.vy = Math.sin(a) * sp * 0.55;
    p.life = 0.5;
    p.maxLife = 0.5;
    p.size = (2 + Math.random() * 2.6) * sc;
    p.color = '#8a6a44';
    p.grav = 540;
    particles.push(p);
  }
}

function spawnBurst(x, y, color1, color2, count) {
  const cap = particleCap();
  if (particles.length >= cap) return;
  const scale = perfLevel >= 2 ? 0.55 : (perfLevel >= 1 ? 0.8 : 1);
  const n = Math.round(count * scale);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 150;
    const p = acquireParticle();
    p.x = x;
    p.y = y - 18;
    p.vx = Math.cos(a) * sp;
    p.vy = Math.sin(a) * sp - 90;
    p.life = 0.85;
    p.maxLife = 0.85;
    p.size = 2 + Math.random() * 3;
    p.color = Math.random() < 0.55 ? color1 : color2;
    p.grav = 380;
    particles.push(p);
  }
}

function spawnPopup(x, y, text, color, size) {
  if (popups.length >= CFG.popupMax) releasePopup(popups.shift());
  const p = acquirePopup();
  p.x = x;
  p.y = y;
  p.life = 1.1;
  p.maxLife = 1.1;
  p.text = text;
  p.color = color;
  p.size = size;
  popups.push(p);
}

function spawnRing(x, y) {
  if (rings.length >= CFG.ringMax) releaseRing(rings.shift());
  const r = acquireRing();
  r.x = x;
  r.y = y;
  r.life = 0.62;
  r.maxLife = 0.62;
  rings.push(r);
}

function checkMilestone(ty) {
  const next = milestoneShown + 10;
  if (score >= next) {
    milestoneShown = next;
    spawnPopup(W / 2 + camX, ty - 150, '里程碑 ' + next + ' 分!', '#ffd93b', 24);
    spawnRing(player.x, ty);
    beep(1046, 0.10, 'sine', 0.12);
    beep(1568, 0.10, 'sine', 0.10, null, 0.10);
    beep(2093, 0.20, 'sine', 0.09, null, 0.20);
  }
}

/* 完美判定半径：宽平台给多一点，窄平台不至于过苛 */
function perfectRadius(p) {
  return clamp(p.w * CFG.perfectR, 6.5, 11);
}

function doLand(p, ty, rescued) {
  player.y = ty;
  player.vx = 0;
  player.vy = 0;
  player.rot = 0;
  player.rotSpeed = 0;
  player.state = 'idle';
  player.squash = 0.60;

  const samePlat = (p === player.plat);
  player.plat = p;
  player.x = clamp(player.x, p.x + 5, p.x + p.w - 5);

  if (!samePlat) {
    const center = p.x + p.w / 2;
    const perfect = !rescued && Math.abs(player.x - center) < perfectRadius(p);
    p.squash = 0.6;

    const wasBest = best;

    if (rescued) {
      if (combo >= 2) spawnPopup(player.x, ty - 80, '连击中断', '#ff9b7a', 15);
      combo = 0;
      recentMisses++;
      score += 1;
      rescueCount++;
      spawnDust(player.x, ty, 5, 0.8);
      spawnPopup(player.x, ty - 82, '惊险 +1', '#ffd54f', 18);
      shake = Math.min(shake + 2.5, 6);
      vibrate(12);
      beep(240, 0.12, 'triangle', 0.12, 140);
      hitstop = CFG.hitstopMs / 2000;
      punch = Math.max(punch, 0.4);
    } else if (p.spring) {
      const gain = CFG.springBonus + (perfect ? 1 : 0);
      score += gain;
      if (perfect) {
        combo++;
        perfectCount++;
        recentMisses = Math.max(0, recentMisses - 1);
        eyeGlow = 1.2;
      punch = Math.max(punch, 1);
      } else {
        combo = 0;
      }
      spawnRing(center, ty);
      spawnBurst(center, ty, '#a6e07a', '#e0ffb0', 22);
      spawnPopup(center, ty - 80, '弹簧 +' + gain, '#a6e07a', 22);
      shake = Math.min(shake + 4.5, 9);
      vibrate([12, 30, 18]);
      beep(1046, 0.10, 'sine', 0.13);
      beep(1568, 0.20, 'sine', 0.10, null, 0.08);
      hitstop = CFG.hitstopMs / 1000;
    } else if (perfect) {
      combo++;
      perfectCount++;
      maxCombo = Math.max(maxCombo, combo);
      recentMisses = Math.max(0, recentMisses - 1);
      const bonus = combo >= 2 ? Math.min(combo - 1, 5) : 0;
      const gain = 2 + bonus;
      score += gain;
      eyeGlow = 1;
      punch = Math.max(punch, 0.85);
      spawnRing(center, ty);
      spawnBurst(center, ty, '#ffd93b', '#fff3a0', 18);
      spawnPopup(center, ty - 80, '完美 +' + gain, '#ffd93b', 22);
      if (combo >= 2) spawnPopup(center, ty - 112, '连击 x' + combo, '#9ef07a', 17);
      shake = Math.min(shake + 2.5, 6);
      vibrate(15);
      beep(comboNote(combo), 0.09, 'sine', 0.13);
      if (combo >= 3) beep(comboNote(combo + 1), 0.10, 'sine', 0.08, null, 0.06);
      hitstop = CFG.hitstopMs / 1000;
    } else {
      if (combo >= 2) spawnPopup(player.x, ty - 80, '连击中断', '#ff9b7a', 15);
      combo = 0;
      recentMisses++;
      score += 1;
      spawnDust(player.x, ty, 7, 1);
      shake = Math.min(shake + 3.4, 7);
      vibrate(10);
      beep(170, 0.09, 'sine', 0.14, 82);
    }

    scorePop = 1;

    if (score > best) { best = score; saveBest(); }
    if (!newRecordShown && score > wasBest && wasBest > 0) {
      newRecordShown = true;
      spawnPopup(W / 2 + camX, ty - 190, '新纪录!', '#ffd93b', 26);
      beep(1568, 0.12, 'sine', 0.10);
    }

    checkMilestone(ty);
  } else if (rescued) {
    spawnPopup(player.x, ty - 82, '差一点', '#ffd54f', 16);
    spawnDust(player.x, ty, 4, 0.7);
    vibrate(8);
    beep(220, 0.10, 'triangle', 0.10, 180);
  } else {
    // 落回原平台：不加分，但给一点触感反馈，避免“按了没反应”的空落感
    spawnDust(player.x, ty, 4, 0.6);
    vibrate(6);
  }
  ensurePlatforms();

  // 第一次遇到会动的柱子，提示一句
  if (!swayTipShown) {
    const at = platforms.indexOf(p);
    const nx = platforms[at + 1];
    if (nx && nx.sway) {
      swayTipShown = true;
      spawnPopup(nx.baseX + nx.w / 2, ty - 118, '蓝色柱子会左右移动', '#9fe0ef', 15);
    }
  }
}

function gameOver() {
  if (gameState === 'over') return;
  gameState = 'over';
  overAt = performance.now();
  player.state = 'dead';
  if (score > best) { best = score; saveBest(); }
  lastRank = addRunToBoard(score);     // 进榜才返回名次
  spawnPopup(camX + W / 2, H * 0.36, '失足...', '#ff9b7a', 24);
  vibrate([30, 60, 40]);
  beep(400, 0.45, 'sawtooth', 0.09, 80);
}

/* ============================================================
 *  16. 固定步长物理
 * ============================================================ */
function fixedUpdate(dt) {
  const ty = topY();

  // 摆动的柱子先动：落地判定用的是动完之后的位置
  moveT += dt;
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    if (!p.sway) continue;
    const before = p.x;
    p.x = p.baseX + Math.sin(moveT * p.sway.spd + p.sway.ph) * p.sway.amp;
    // 站在上面的人跟着一起走，不会平白滑下去
    if (player.state === 'idle' && player.plat === p) player.x += p.x - before;
  }

  if (player.state === 'jump' || player.state === 'fall') {
    const prevY = player.y;

    player.vy += CFG.gravity * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.rot += player.rotSpeed * dt;

    if (player.state === 'jump' && player.vy > 0 && prevY <= ty && player.y >= ty) {
      let hit = null;
      let rescue = null;
      let rescueDist = Infinity;
      const MERCY = mercyRadius();

      for (let i = 0; i < platforms.length; i++) {
        const p = platforms[i];
        if (player.x >= p.x && player.x <= p.x + p.w) { hit = p; break; }
        const dl = Math.abs(player.x - p.x);
        const dr = Math.abs(player.x - (p.x + p.w));
        const d = Math.min(dl, dr);
        if (d < MERCY && d < rescueDist) {
          rescueDist = d;
          rescue = p;
        }
      }

      if (hit) {
        doLand(hit, ty, false);
      } else if (rescue) {
        player.x = clamp(player.x, rescue.x + 4, rescue.x + rescue.w - 4);
        doLand(rescue, ty, true);
      } else {
        player.state = 'fall';
        player.rotSpeed = Math.PI * 2 * 0.9;
        player.vx *= 0.82;
      }
    }

    if (player.state === 'fall' && player.y > H + 60) gameOver();
  }

  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    if (p.squash > 0) {
      p.squash += -p.squash * Math.min(1, dt * 9);
      if (p.squash < 0.004) p.squash = 0;
    }
    if (p.spring) {
      p.glow += dt * 2.4;
      if (p.glow > Math.PI * 2) p.glow -= Math.PI * 2;
    }
  }

  // 输入缓冲：落地瞬间自动接手蓄力
  if (wantCharge) {
    if (performance.now() - chargeBufferAt > CFG.inputBufferMs) {
      wantCharge = false;
    } else if (player.state === 'idle') {
      wantCharge = false;
      startCharge();
    }
  }
}

/* ============================================================
 *  17. 视觉更新
 * ============================================================ */
function visualUpdate(dt, now) {
  if (gameState === 'paused') return;

  // 分数滚动
  displayScore += (score - displayScore) * Math.min(1, dt * 14);
  if (Math.abs(score - displayScore) < 0.05) displayScore = score;

  // 昼夜渐变：只有变化足够大才重建天空（rebuildSky 要重算渐变对象）
  dayT = clamp(score / CFG.duskScore, 0, 1);
  if (Math.abs(dayT - skyDayT) > 0.02) {
    skyDayT = dayT;
    rebuildSky();
  }

  // 蓄力
  if (charging && gameState === 'playing') {
    charge = Math.min(1, (now - chargeStart) / CFG.maxChargeMs);
    setChargeFreq(charge);

    if (charge >= 0.995 && !chargeFullBeeped) {
      chargeFullBeeped = true;
      beep(1600, 0.07, 'sine', 0.09);
      vibrate(22);                 // 蓄满给一次触感，闭着眼睛也能感觉到
    }

    if (player.plat) player.plat.squash = Math.max(player.plat.squash, charge * 0.7);
  }

  // 落地回弹
  if (player.state === 'idle' || player.state === 'dead') {
    player.squash += (1 - player.squash) * Math.min(1, dt * 14);
  }

  // 眼部光效
  if (eyeGlow > 0) {
    eyeGlow -= eyeGlow * Math.min(1, dt * 5);
    if (eyeGlow < 0.02) eyeGlow = 0;
  }

  // 连击火花：连击达到 4 以上时头顶持续冒火星
  sparkTimer -= dt;
  if (combo >= 4 && player.state === 'idle' && sparkTimer <= 0 && particles.length < particleCap()) {
    sparkTimer = 0.08;
    const p = acquireParticle();
    p.x = player.x + (Math.random() - 0.5) * 14;
    p.y = player.y - 42 - Math.random() * 6;
    p.vx = (Math.random() - 0.5) * 26;
    p.vy = -40 - Math.random() * 30;
    p.life = 0.55;
    p.maxLife = 0.55;
    p.size = 1.8 + Math.random() * 1.8;
    p.color = Math.random() < 0.6 ? '#ffd93b' : '#ffb060';
    p.grav = -30;
    particles.push(p);
  }

  // 跳跃残影（复用对象，不产生垃圾）
  if (player.state === 'jump' || player.state === 'fall') {
    const t = trail.length >= CFG.trailDots
      ? trail.shift()
      : (trailPool.pop() || { x: 0, y: 0, life: 0, maxLife: 1 });
    t.x = player.x; t.y = player.y;
    t.life = CFG.trailLife; t.maxLife = CFG.trailLife;
    trail.push(t);
  } else if (trail.length) {
    for (let i = 0; i < trail.length; i++) if (trailPool.length < 32) trailPool.push(trail[i]);
    trail.length = 0;
  }
  for (let i = trail.length - 1; i >= 0; i--) {
    const t = trail[i];
    t.life -= dt;
    if (t.life <= 0) {
      trail.splice(i, 1);
      if (trailPool.length < 32) trailPool.push(t);
    }
  }

  // 相机
  if (gameState === 'playing') {
    const target = player.x - W * camAnchor();
    camX += (target - camX) * Math.min(1, dt * 6.5);
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles[i] = particles[particles.length - 1];
      particles.pop();
      releaseParticle(p);
      continue;
    }
    p.vy += (p.grav || 380) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  // 飘字
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life -= dt;
    if (p.life <= 0) {
      popups[i] = popups[popups.length - 1];
      popups.pop();
      releasePopup(p);
      continue;
    }
    p.y -= 42 * dt;
  }

  // 圆环
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt;
    if (r.life <= 0) {
      rings[i] = rings[rings.length - 1];
      rings.pop();
      releaseRing(r);
    }
  }

  // 落叶
  for (let i = 0; i < leaves.length; i++) {
    const l = leaves[i];
    l.sway += dt * 2.2;
    l.x += (l.vx + Math.sin(l.sway) * 18) * dt;
    l.y += l.vy * dt;
    l.rot += l.vr * dt;
    if (l.y > H + 24) { l.x = Math.random() * W; l.y = -24; }
    if (l.x < -40) l.x += W + 80;
    if (l.x > W + 40) l.x -= W + 80;
  }

  updateFireflies(dt);

  if (shake > 0) {
    shake -= shake * Math.min(1, dt * 11);
    if (shake < 0.12) shake = 0;
  }

  if (scorePop > 0) {
    scorePop -= scorePop * Math.min(1, dt * 9);
    if (scorePop < 0.01) scorePop = 0;
  }

  if (punch > 0) {
    punch -= punch * Math.min(1, dt * 10);
    if (punch < 0.004) punch = 0;
  }
}

/* ============================================================
 *  18. 渲染
 * ============================================================ */
const clouds = [];
for (let i = 0; i < 9; i++) {
  clouds.push({ x: Math.random(), y: Math.random(), s: 0.55 + Math.random() * 0.85, sp: 0.35 + Math.random() * 0.5 });
}

function drawSky() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
}

/* 黄昏之后星星才慢慢浮出来 */
function drawStars(now) {
  if (!starField || dayT < 0.22) return;
  const t = clamp((dayT - 0.22) / 0.6, 0, 1);
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < starField.length; i++) {
    const st = starField[i];
    const tw = 0.55 + 0.45 * Math.sin(now * 0.0017 + st.ph);
    ctx.globalAlpha = t * tw * 0.85;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* 整体暖色叠一层，让黄昏不只是“换了天空颜色” */
function drawDuskTint() {
  if (dayT <= 0.02) return;
  ctx.fillStyle = 'rgba(255, 146, 62,' + (dayT * 0.10).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
}

function drawVignette() {
  if (!vignette) return;
  ctx.drawImage(vignette, 0, 0, W, H);
}

function drawSun() {
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 3.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = sunCoreColor;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();
}

function drawClouds(now) {
  if (!cloudSprite) return;
  // 循环区间用「屏幕宽 + 两侧余量」，云完全出画之后才回绕。
  // 原来只在 x < -280 时补一次，负得更多时不补，云会在屏幕外闪一下再冒出来。
  const span = W + 360;
  ctx.globalAlpha = 0.88;
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    let x = (c.x * span - camX * 0.09 * c.sp - now * 0.004 * c.sp) % span;
    if (x < 0) x += span;
    x -= 180;
    const y = H * 0.05 + c.y * H * 0.22;
    const targetR = (36 + 34 * c.s) * c.s;
    const drawScale = targetR / cloudSprite.baseR;
    const drawSize = cloudSprite.size * drawScale;
    ctx.drawImage(cloudSprite.c, x - drawSize / 2, y - drawSize / 2, drawSize, drawSize);
  }
  ctx.globalAlpha = 1;
}

function tileLayer(layer, parallax, anchorY, alpha) {
  if (!layer) return;
  let off = (camX * parallax) % layer.w;
  if (off < 0) off += layer.w;
  const top = anchorY - (layer.yMid != null ? layer.yMid : layer.h);
  ctx.globalAlpha = alpha;
  for (let x = -off; x < W; x += layer.w) {
    ctx.drawImage(layer.c, x, top, layer.w, layer.h);
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  const ty = topY();
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, ty, W, H - ty);

  if (groundTex) {
    const s = groundTex.s;
    let off = camX % s;
    if (off < 0) off += s;
    for (let x = -off; x < W; x += s) {
      for (let y = ty; y < H; y += s) {
        ctx.drawImage(groundTex.c, x, y, s, s);
      }
    }
  }

  ctx.fillStyle = '#8ed36a';
  ctx.fillRect(0, ty, W, 5);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(0, ty, W, 2);
}

function drawFog() {
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, topY() - 100, W, 170);
}

function drawPlatforms(now) {
  const ty = topY();
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    const sx = p.x - camX;
    if (sx + p.w < -100 || sx > W + 100) continue;

    if (p.sway) {
      // 滑轨：一眼看出这根柱子会左右跑
      const c0 = p.baseX - camX + p.w / 2;
      const half = p.w / 2 + p.sway.amp + 6;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(150, 236, 255, 0.22)';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(c0 - half, ty + 6);
      ctx.lineTo(c0 + half, ty + 6);
      ctx.stroke();
      ctx.setLineDash([6, 8]);
      ctx.strokeStyle = 'rgba(196, 246, 255, 0.85)';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(c0 - half, ty + 6);
      ctx.lineTo(c0 + half, ty + 6);
      ctx.stroke();
      ctx.setLineDash([]);
      for (let s2 = -1; s2 <= 1; s2 += 2) {
        ctx.fillStyle = 'rgba(196, 246, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(c0 + s2 * half, ty + 6, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const padX = PLAT_PAD;
    const sprite = getPlatformSprite(p);

    const ex = p.squash * 6;
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath();
    ctx.ellipse(sx + p.w / 2, ty + 6, (p.w + ex * 2) * 0.62, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    const d = p.squash * 13;
    const scaleX = (p.w + ex * 2) / p.w;

    if (p.spring && glowSprite) {
      const pulse = 0.5 + Math.sin(p.glow) * 0.3;
      const r = p.w * 0.9 + 12;
      const cx = sx + p.w / 2;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35 * pulse;
      ctx.drawImage(glowSprite, cx - r, ty - r * 0.35, r * 2, r * 0.7);
      ctx.restore();
    }

    if (scaleX === 1 && d === 0) {
      // 没有形变就不必走 save/scale/restore，省掉每帧十几次变换
      ctx.drawImage(sprite.c, sx - padX, ty - sprite.top, p.w + padX * 2, sprite.h);
    } else {
      ctx.save();
      ctx.translate(sx + p.w / 2, ty + d);
      ctx.scale(scaleX, 1);
      ctx.drawImage(sprite.c, -p.w / 2 - padX, -sprite.top, p.w + padX * 2, sprite.h);
      ctx.restore();
    }
  }
}

function drawTrail() {
  if (!trail.length) return;
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i];
    const a = (t.life / t.maxLife) * 0.34;
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffb08c';
    ctx.beginPath();
    ctx.arc(t.x - camX, t.y - 17, 9 * (t.life / t.maxLife) + 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTrajectory(now) {
  if (!charging || gameState !== 'playing' || player.state !== 'idle') return;

  const ty = topY();
  const dist = CFG.minDist + charge * (CFG.maxDist - CFG.minDist);
  const vy0 = -(560 + dist * 0.75);
  const T = (2 * Math.abs(vy0)) / CFG.gravity;
  const vx = dist / T;

  const startX = player.x - camX;
  const startY = ty;

  // 抛物线引导：浅色虚线上叠一圈深色描边，晴天/黄昏都看得清
  const steps = 26;
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const tt = (i / steps) * T;
    const x = startX + vx * tt;
    const y = startY + vy0 * tt + 0.5 * CFG.gravity * tt * tt;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.setLineDash([7, 8]);
  ctx.lineCap = 'round';
  ctx.lineWidth = 3.8;
  ctx.strokeStyle = 'rgba(28, 58, 40, 0.26)';
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
  ctx.stroke();
  ctx.setLineDash([]);

  // 起跳点加几个实心点，强调起点
  for (let i = 1; i <= 4; i++) {
    const tt = (i / 12) * T;
    const x = startX + vx * tt;
    const y = startY + vy0 * tt + 0.5 * CFG.gravity * tt * tt;
    ctx.globalAlpha = 0.88 - i * 0.16;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, 3.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const landWorldX = player.x + dist;
  let hitPlat = null;
  let rescuePlat = null;
  let rescueDist = Infinity;

  const tLand = moveT + T;
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    const px = platXAt(p, tLand);
    if (landWorldX >= px && landWorldX <= px + p.w) { hitPlat = p; break; }
    const dl = Math.abs(landWorldX - px);
    const dr = Math.abs(landWorldX - (px + p.w));
    const d = Math.min(dl, dr);
    if (d < mercyRadius() && d < rescueDist) {
      rescueDist = d;
      rescuePlat = p;
    }
  }

  let color, fillColor, previewText, previewColor;

  if (hitPlat) {
    const center = hitPlat.x + hitPlat.w / 2;
    const isPerfect = Math.abs(landWorldX - center) < perfectRadius(hitPlat);
    if (hitPlat.spring) {
      const gain = CFG.springBonus + (isPerfect ? 1 : 0);
      color = 'rgba(166, 224, 122, 0.95)';
      fillColor = 'rgba(166, 224, 122, 0.30)';
      previewText = '+' + gain;
      previewColor = '#a6e07a';
    } else if (isPerfect) {
      const nextCombo = combo + 1;
      const bonus = nextCombo >= 2 ? Math.min(nextCombo - 1, 5) : 0;
      color = 'rgba(255, 217, 59, 0.95)';
      fillColor = 'rgba(255, 217, 59, 0.32)';
      previewText = '+' + (2 + bonus);
      previewColor = '#ffd93b';
    } else {
      color = 'rgba(125, 255, 138, 0.92)';
      fillColor = 'rgba(125, 255, 138, 0.26)';
      previewText = '+1';
      previewColor = '#9ef07a';
    }
  } else if (rescuePlat) {
    color = 'rgba(255, 213, 79, 0.92)';
    fillColor = 'rgba(255, 213, 79, 0.24)';
    previewText = '惊险 +1';
    previewColor = '#ffd54f';
  } else {
    color = 'rgba(255, 255, 255, 0.88)';
    fillColor = 'rgba(255, 255, 255, 0.26)';
    previewText = null;
  }

  const landX = startX + dist;
  const drawX = clamp(landX, 20, W - 20);   // 贴边时别把提示画出屏幕
  const pulse = 1 + Math.sin(now / 160) * 0.12;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(drawX, ty + 3, 15 * pulse, 5.5 * pulse, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = fillColor;
  ctx.beginPath();
  ctx.ellipse(drawX, ty + 3, 9 * pulse, 3.2 * pulse, 0, 0, Math.PI * 2);
  ctx.fill();

  if (previewText && jumpCount < CFG.previewHintJumps) {
    ctx.font = fontOf(15 * uiScale(), 'bold');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(40, 40, 10, 0.55)';
    ctx.strokeText(previewText, drawX, ty - 26);
    ctx.fillStyle = previewColor;
    ctx.fillText(previewText, drawX, ty - 26);
  }

  ctx.restore();
}

function drawPlayer(now) {
  const ty = topY();
  const sx = player.x - camX;

  if (player.state !== 'fall' && player.state !== 'dead') {
    const alt = Math.max(0, ty - player.y);
    const alpha = Math.max(0, 0.24 - alt * 0.00055);
    if (alpha > 0.01) {
      ctx.fillStyle = 'rgba(0,0,0,' + alpha.toFixed(3) + ')';
      const sc = Math.max(0.35, 1 - alt * 0.0022);
      ctx.beginPath();
      ctx.ellipse(sx, ty + 3, 16 * sc, 5.5 * sc, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 蓄力时脚下的能量环跟着张开
  if (charging && player.state === 'idle') {
    const ringR = 16 + charge * 30;
    ctx.strokeStyle = 'rgba(255, 236, 150, ' + (0.16 + charge * 0.5).toFixed(3) + ')';
    ctx.lineWidth = 1.6 + charge * 2.6;
    ctx.beginPath();
    ctx.ellipse(sx, ty + 3, ringR, ringR * 0.34, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.save();
  // 待机轻轻呼吸，画面不至于「死」在那里
  const bob = (player.state === 'idle' && !charging) ? Math.sin(now * 0.0024) * 1.1 : 0;
  ctx.translate(sx, player.y + bob);

  if (player.state === 'jump' || player.state === 'fall') {
    ctx.translate(0, -17);
    ctx.rotate(player.rot);
    ctx.translate(0, 17);
  }

  let sxs = 1, sys = 1;
  if (charging && player.state === 'idle') {
    sys = 1 - charge * 0.38;
    sxs = 1 + charge * 0.26;
  } else if (player.state === 'idle') {
    sys = player.squash;
    sxs = 1 + (1 - player.squash) * 0.55;
  } else if (player.state === 'jump') {
    const st = Math.min(1, Math.abs(player.vy) / 900);
    sys = 1 + st * 0.14;
    sxs = 1 - st * 0.09;
  }
  ctx.scale(sxs, sys);

  if (playerSprite) {
    ctx.drawImage(
      playerSprite.c,
      playerSprite.minX, playerSprite.minY,
      playerSprite.w, playerSprite.h
    );
  }

  const look = charging ? 1.6 * charge : 0;
  const g = eyeGlow;

  ctx.fillStyle = '#2b2320';
  ctx.beginPath();
  ctx.arc(-5.5 + look, -20.4, 3.1, 0, Math.PI * 2);
  ctx.arc(5.5 + look, -20.4, 3.1, 0, Math.PI * 2);
  ctx.fill();

  const glR = 1.25 + g * 2.2;
  ctx.fillStyle = g > 0.35 ? 'rgba(255, 250, 220, 1)' : '#ffffff';
  ctx.beginPath();
  ctx.arc(-4.4 + look, -21.6, glR, 0, Math.PI * 2);
  ctx.arc(6.6 + look, -21.6, glR, 0, Math.PI * 2);
  ctx.fill();

  if (g > 0.05) {
    ctx.globalAlpha = g * 0.55;
    ctx.fillStyle = 'rgba(255, 230, 120, 1)';
    ctx.beginPath();
    ctx.arc(-5.5 + look, -20.4, 5 + g * 4, 0, Math.PI * 2);
    ctx.arc(5.5 + look, -20.4, 5 + g * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawFx() {
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    const t = 1 - r.life / r.maxLife;
    const rad = 8 + t * 62;
    ctx.strokeStyle = 'rgba(255, 217, 59,' + (1 - t).toFixed(3) + ')';
    ctx.lineWidth = 3.5 * (1 - t) + 1;
    ctx.beginPath();
    ctx.ellipse(r.x - camX, r.y, rad, rad * 0.36, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y, p.size * a + 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    ctx.globalAlpha = Math.min(1, (p.life / p.maxLife) * 1.8);
    ctx.font = fontOf(p.size * uiScale(), 'bold');
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(60, 40, 10, 0.55)';
    ctx.strokeText(p.text, p.x - camX, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x - camX, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawLeaves() {
  for (let i = 0; i < leaves.length; i++) {
    const l = leaves[i];
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = l.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, l.size, l.size * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = 'rgba(60, 70, 30, 0.5)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-l.size * 0.8, 0);
    ctx.lineTo(l.size * 0.8, 0);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* 归一化坐标，运行时再换算，只建一次 */
const GLOW_SPOTS = [
  { nx: 0.16, ny: 0.08, nr: 0.34, sp: 0.00013, ph: 0.0 },
  { nx: 0.60, ny: 0.03, nr: 0.28, sp: 0.00009, ph: 2.1 },
  { nx: 0.86, ny: 0.25, nr: 0.22, sp: 0.00017, ph: 4.2 }
];

function drawGlows(now) {
  if (!glowSprite || perfLevel >= 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const base = Math.min(W, H);
  for (let i = 0; i < GLOW_SPOTS.length; i++) {
    const s = GLOW_SPOTS[i];
    const r = base * s.nr;
    const ox = Math.sin(now * s.sp + s.ph) * W * 0.05;
    const oy = Math.cos(now * s.sp * 1.3 + s.ph) * H * 0.03;
    ctx.globalAlpha = 0.40 + Math.sin(now * s.sp * 2 + s.ph) * 0.13;
    ctx.drawImage(glowSprite, s.nx * W + ox - r, s.ny * H + oy - r, r * 2, r * 2);
  }
  ctx.restore();
}

/* 圆形按钮底板：半透明玻璃感 */
function drawBtnBase(cx, cy, r) {
  ctx.fillStyle = 'rgba(14, 34, 22, 0.38)';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

/* 喇叭：矢量绘制，不再依赖 emoji（各机型渲染差异大且每帧走字体排版） */
function drawSpeakerIcon(cx, cy, r, on) {
  const u = r * 0.5;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(cx - u * 0.95, cy - u * 0.32);
  ctx.lineTo(cx - u * 0.42, cy - u * 0.32);
  ctx.lineTo(cx + u * 0.16, cy - u * 0.86);
  ctx.lineTo(cx + u * 0.16, cy + u * 0.86);
  ctx.lineTo(cx - u * 0.42, cy + u * 0.32);
  ctx.lineTo(cx - u * 0.95, cy + u * 0.32);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = Math.max(1.4, r * 0.10);
  ctx.lineCap = 'round';
  if (on) {
    ctx.beginPath();
    ctx.arc(cx + u * 0.24, cy, u * 0.62, -0.85, 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + u * 0.24, cy, u * 1.05, -0.72, 0.72);
    ctx.stroke();
  } else {
    const d = u * 0.62;
    ctx.beginPath();
    ctx.moveTo(cx + d * 1.05, cy - d);
    ctx.lineTo(cx + d * 2.05, cy + d);
    ctx.moveTo(cx + d * 2.05, cy - d);
    ctx.lineTo(cx + d * 1.05, cy + d);
    ctx.stroke();
  }
}

function drawPauseIcon(cx, cy, r, showPlay) {
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  if (showPlay) {
    const u = r * 0.46;
    ctx.beginPath();
    ctx.moveTo(cx - u * 0.62, cy - u);
    ctx.lineTo(cx + u * 1.05, cy);
    ctx.lineTo(cx - u * 0.62, cy + u);
    ctx.closePath();
    ctx.fill();
  } else {
    const u = r * 0.42, bw = r * 0.26, br = 1.4;
    rr(ctx, cx - u - bw / 2, cy - u, bw, u * 2, br);
    ctx.fill();
    rr(ctx, cx + u - bw / 2, cy - u, bw, u * 2, br);
    ctx.fill();
  }
}

/* 全屏 / 退出全屏 图标：四角括号 */
function drawExpandIcon(cx, cy, r, fullscreen) {
  const u = r * 0.46;
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = Math.max(1.5, r * 0.095);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 0; i < 4; i++) {
    const sx = (i & 1) ? 1 : -1;
    const sy = (i & 2) ? 1 : -1;
    ctx.beginPath();
    if (fullscreen) {
      // 朝内 → 点一下退出全屏
      ctx.moveTo(cx + sx * u * 0.40, cy + sy * u);
      ctx.lineTo(cx + sx * u * 0.40, cy + sy * u * 0.40);
      ctx.lineTo(cx + sx * u, cy + sy * u * 0.40);
    } else {
      // 朝外 → 点一下进全屏（并尝试锁横屏）
      ctx.moveTo(cx + sx * u, cy + sy * u * 0.42);
      ctx.lineTo(cx + sx * u, cy + sy * u);
      ctx.lineTo(cx + sx * u * 0.42, cy + sy * u);
    }
    ctx.stroke();
  }
}

function drawButtons() {
  const r = getBtnRadius();
  const mb = getMuteBtn();
  const pb = getPauseBtn();
