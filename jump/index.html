  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    let x = (c.x * span - camX * 0.09 * c.sp - now * 0.004 * c.sp) % span;
    if (x < 0) x += span;
    x -= 180;
    const y = H * 0.05 + c.y * H * 0.22;
    const targetR = (36 + 34 * c.s) * c.s;
    const drawScale = targetR / cloudSprite.baseR;
    const drawSize = cloudSprite.size * drawScale;
    ctx.drawImage(cloudSprite.c, x - drawSize / 2, y - drawSize / 2, drawSize, drawSize);
  }
  ctx.globalAlpha = 1;
}

function tileLayer(layer, parallax, anchorY, alpha) {
  if (!layer) return;
  let off = (camX * parallax) % layer.w;
  if (off < 0) off += layer.w;
  const top = anchorY - (layer.yMid != null ? layer.yMid : layer.h);
  ctx.globalAlpha = alpha;
  for (let x = -off; x < W; x += layer.w) {
    ctx.drawImage(layer.c, x, top, layer.w, layer.h);
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  const ty = topY();
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, ty, W, H - ty);

  if (groundTex) {
    const s = groundTex.s;
    let off = camX % s;
    if (off < 0) off += s;
    for (let x = -off; x < W; x += s) {
      for (let y = ty; y < H; y += s) {
        ctx.drawImage(groundTex.c, x, y, s, s);
      }
    }
  }

  ctx.fillStyle = '#8ed36a';
  ctx.fillRect(0, ty, W, 5);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(0, ty, W, 2);
}

function drawFog() {
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, topY() - 100, W, 170);
}

function drawPlatforms(now) {
  const ty = topY();
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    const sx = p.x - camX;
    if (sx + p.w < -100 || sx > W + 100) continue;

    if (p.sway) {
      // 滑轨：一眼看出这根柱子会左右跑
      const c0 = p.baseX - camX + p.w / 2;
      const half = p.w / 2 + p.sway.amp + 6;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(150, 236, 255, 0.22)';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(c0 - half, ty + 6);
      ctx.lineTo(c0 + half, ty + 6);
      ctx.stroke();
      ctx.setLineDash([6, 8]);
      ctx.strokeStyle = 'rgba(196, 246, 255, 0.85)';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(c0 - half, ty + 6);
      ctx.lineTo(c0 + half, ty + 6);
      ctx.stroke();
      ctx.setLineDash([]);
      for (let s2 = -1; s2 <= 1; s2 += 2) {
        ctx.fillStyle = 'rgba(196, 246, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(c0 + s2 * half, ty + 6, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const padX = PLAT_PAD;
    const sprite = getPlatformSprite(p);

    const ex = p.squash * 6;
    if (shadowSprite) {
      // 软阴影贴图：中间深、边缘化开，比一圈硬边的椭圆自然
      const shW = (p.w + ex * 2) * 1.9;
      ctx.globalAlpha = 0.62;
      ctx.drawImage(shadowSprite, sx + p.w / 2 - shW / 2, ty - 9, shW, 30);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.beginPath();
      ctx.ellipse(sx + p.w / 2, ty + 6, (p.w + ex * 2) * 0.62, 7, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    const d = p.squash * 13;
    const scaleX = (p.w + ex * 2) / p.w;

    if (p.spring && glowSprite) {
      const pulse = 0.5 + Math.sin(p.glow) * 0.3;
      const r = p.w * 0.9 + 12;
      const cx = sx + p.w / 2;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35 * pulse;
      ctx.drawImage(glowSprite, cx - r, ty - r * 0.35, r * 2, r * 0.7);
      ctx.restore();
    }

    if (scaleX === 1 && d === 0) {
      // 没有形变就不必走 save/scale/restore，省掉每帧十几次变换
      ctx.drawImage(sprite.c, sx - padX, ty - sprite.top, p.w + padX * 2, sprite.h);
    } else {
      ctx.save();
      ctx.translate(sx + p.w / 2, ty + d);
      ctx.scale(scaleX, 1);
      ctx.drawImage(sprite.c, -p.w / 2 - padX, -sprite.top, p.w + padX * 2, sprite.h);
      ctx.restore();
    }
  }
}

function drawTrail() {
  if (!trail.length) return;
  const trailColor = SKIN().trail || '#ffb08c';
  const glide = player.state === 'glide';       // 直线冲刺：残影拉成横向的速度线
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i];
    const k2 = t.life / t.maxLife;
    const a = k2 * (glide ? 0.55 : 0.34);
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = trailColor;
    ctx.beginPath();
    if (glide) {
      ctx.ellipse(t.x - camX, t.y - 20, 17 * k2 + 6, 3.2 * k2 + 1.2, 0, 0, SKIN_TAU);
    } else {
      ctx.arc(t.x - camX, t.y - 20, 9 * k2 + 2, 0, Math.PI * 2);
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* 困难模式蓄力时的引导：一条水平直线，只画前面一小段。
   它告诉你「往哪个方向飞」，但故意不画到终点 —— 落点全靠手感。 */
function drawStraightGuide(dist, ty, now) {
  const startX = player.x - camX;
  const y = ty - 15;
  const len = Math.min(dist, 132);
  const segs = 9;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 0; i < segs; i++) {
    const a0 = i / segs;
    const x0 = startX + len * a0;
    const x1 = startX + len * ((i + 1) / segs) - 5;
    if (x1 <= x0) continue;
    ctx.globalAlpha = 0.85 * (1 - a0 * 0.92);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3.4 * (1 - a0 * 0.45);
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    ctx.stroke();
  }
  // 箭头，强调「直线」这件事
  const pulse = 0.75 + Math.sin(now / 170) * 0.25;
  ctx.globalAlpha = 0.8 * pulse;
  ctx.fillStyle = '#ffb060';
  const ax = startX + len + 6;
  ctx.beginPath();
  ctx.moveTo(ax, y);
  ctx.lineTo(ax - 11, y - 6.5);
  ctx.lineTo(ax - 11, y + 6.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawTrajectory(now) {
  if (!charging || gameState !== 'playing' || player.state !== 'idle') return;

  const ty = topY();
  const dist = CFG.minDist + charge * (CFG.maxDist - CFG.minDist);

  // 困难模式没有抛物线，也就不给抛物线预览
  if (!MODE().arc) {
    drawStraightGuide(dist, ty, now);
    return;
  }

  const vy0 = -(560 + dist * 0.75);
  const T = (2 * Math.abs(vy0)) / CFG.gravity;
  const vx = dist / T;

  const startX = player.x - camX;
  const startY = ty;

  // 抛物线引导：浅色虚线上叠一圈深色描边，晴天/黄昏都看得清
  const steps = 26;
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const tt = (i / steps) * T;
    const x = startX + vx * tt;
    const y = startY + vy0 * tt + 0.5 * CFG.gravity * tt * tt;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.setLineDash([7, 8]);
  ctx.lineCap = 'round';
  ctx.lineWidth = 3.8;
  ctx.strokeStyle = 'rgba(28, 58, 40, 0.26)';
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
  ctx.stroke();
  ctx.setLineDash([]);

  // 起跳点加几个实心点，强调起点
  for (let i = 1; i <= 4; i++) {
    const tt = (i / 12) * T;
    const x = startX + vx * tt;
    const y = startY + vy0 * tt + 0.5 * CFG.gravity * tt * tt;
    ctx.globalAlpha = 0.88 - i * 0.16;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, 3.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const landWorldX = player.x + dist;
  let hitPlat = null;
  let rescuePlat = null;
  let rescueDist = Infinity;

  const tLand = moveT + T;
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    const px = platXAt(p, tLand);
    if (landWorldX >= px && landWorldX <= px + p.w) { hitPlat = p; break; }
    const dl = Math.abs(landWorldX - px);
    const dr = Math.abs(landWorldX - (px + p.w));
    const d = Math.min(dl, dr);
    if (d < mercyRadius() && d < rescueDist) {
      rescueDist = d;
      rescuePlat = p;
    }
  }

  let color, fillColor, previewText, previewColor;

  if (hitPlat) {
    const center = hitPlat.x + hitPlat.w / 2;
    const isPerfect = Math.abs(landWorldX - center) < perfectRadius(hitPlat);
    if (hitPlat.spring) {
      const gain = CFG.springBonus + (isPerfect ? 1 : 0);
      color = 'rgba(166, 224, 122, 0.95)';
      fillColor = 'rgba(166, 224, 122, 0.30)';
      previewText = '+' + gain;
      previewColor = '#a6e07a';
    } else if (isPerfect) {
      const nextCombo = combo + 1;
      const bonus = nextCombo >= 2 ? Math.min(nextCombo - 1, 5) : 0;
      color = 'rgba(255, 217, 59, 0.95)';
      fillColor = 'rgba(255, 217, 59, 0.32)';
      previewText = '+' + (2 + bonus);
      previewColor = '#ffd93b';
    } else {
      color = 'rgba(125, 255, 138, 0.92)';
      fillColor = 'rgba(125, 255, 138, 0.26)';
      previewText = '+1';
      previewColor = '#9ef07a';
    }
  } else if (rescuePlat) {
    color = 'rgba(255, 213, 79, 0.92)';
    fillColor = 'rgba(255, 213, 79, 0.24)';
    previewText = '惊险 +1';
    previewColor = '#ffd54f';
  } else {
    color = 'rgba(255, 255, 255, 0.88)';
    fillColor = 'rgba(255, 255, 255, 0.26)';
    previewText = null;
  }

  const landX = startX + dist;
  const drawX = clamp(landX, 20, W - 20);   // 贴边时别把提示画出屏幕
  const pulse = 1 + Math.sin(now / 160) * 0.12;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(drawX, ty + 3, 15 * pulse, 5.5 * pulse, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = fillColor;
  ctx.beginPath();
  ctx.ellipse(drawX, ty + 3, 9 * pulse, 3.2 * pulse, 0, 0, Math.PI * 2);
  ctx.fill();

  if (previewText && jumpCount < CFG.previewHintJumps) {
    ctx.font = fontOf(15 * uiScale(), 'bold');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(40, 40, 10, 0.55)';
    ctx.strokeText(previewText, drawX, ty - 26);
    ctx.fillStyle = previewColor;
    ctx.fillText(previewText, drawX, ty - 26);
  }

  ctx.restore();
}

function drawPlayer(now) {
  const ty = topY();
  const sx = player.x - camX;

  // 直线冲刺：从起跳点拉一条水平虚线到脚下，把「这条线是直的」画明白
  if (player.state === 'glide') {
    const fromX = player.dashFromX === undefined ? player.x : player.dashFromX;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 8]);
    ctx.beginPath();
    ctx.moveTo(fromX - camX, ty - 15);
    ctx.lineTo(sx, ty - 15);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  if (player.state !== 'fall' && player.state !== 'dead') {
    const alt = Math.max(0, ty - player.y);
    const alpha = Math.max(0, 0.24 - alt * 0.00055);
    if (alpha > 0.01) {
      const sc = Math.max(0.35, 1 - alt * 0.0022);
      if (shadowSprite) {
        const shW = 50 * sc, shH = 21 * sc;
        ctx.globalAlpha = Math.min(1, alpha * 2.4);
        ctx.drawImage(shadowSprite, sx - shW / 2, ty + 3 - shH / 2, shW, shH);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = 'rgba(0,0,0,' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.ellipse(sx, ty + 3, 16 * sc, 5.5 * sc, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 蓄力时脚下的能量环跟着张开
  if (charging && player.state === 'idle') {
    const ringR = 16 + charge * 30;
    ctx.strokeStyle = 'rgba(255, 236, 150, ' + (0.16 + charge * 0.5).toFixed(3) + ')';
    ctx.lineWidth = 1.6 + charge * 2.6;
    ctx.beginPath();
    ctx.ellipse(sx, ty + 3, ringR, ringR * 0.34, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.save();
  // 待机轻轻呼吸，画面不至于「死」在那里
  const bob = (player.state === 'idle' && !charging) ? Math.sin(now * 0.0024) * 1.1 : 0;
  // 直线冲刺时整条轨迹贴地飞，画的时候抬高一点、影子留在原位，
  // 一眼就能看出「从柱顶掠过去」而不是贴着地面滑
  const dashLift = player.state === 'glide' ? 15 : 0;
  ctx.translate(sx, player.y - dashLift + bob);

  if (player.state === 'jump' || player.state === 'fall') {
    // 旋转支点放在身体中心（精灵里大约 -26），转起来才是「翻跟头」而不是甩脚
    ctx.translate(0, -26);
    ctx.rotate(player.rot);
    ctx.translate(0, 26);
  }

  let sxs = 1, sys = 1;
  if (charging && player.state === 'idle') {
    sys = 1 - charge * 0.38;
    sxs = 1 + charge * 0.26;
  } else if (player.state === 'idle') {
    sys = player.squash;
    sxs = 1 + (1 - player.squash) * 0.55;
  } else if (player.state === 'jump') {
    const st = Math.min(1, Math.abs(player.vy) / 900);
    sys = 1 + st * 0.14;
    sxs = 1 - st * 0.09;
  } else if (player.state === 'glide') {
    // 冲刺：横向拉长、纵向压扁，像被弹射出去
    sxs = 1.18; sys = 0.88;
  }
  ctx.scale(sxs, sys);

  const sk = SKIN();

  // 皮肤自带的光晕，画在身体底下
  if (sk.glow) {
    const gg = ctx.createRadialGradient(0, -21, 2, 0, -21, 35);
    gg.addColorStop(0, sk.glow);
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(0, -21, 35, 0, SKIN_TAU);
    ctx.fill();
  }

  /* 姿态：四肢每帧画，身体用缓存精灵。
     起跳 / 下落 / 冲刺 / 蓄力各一套端点，不用写三段动画。 */
  const P = heroPose(now);
  drawHeroLimb(sk, 'leg', -5.8, P.backLegX, P.backLegY, true);
  drawHeroLimb(sk, 'leg', 5.8, P.frontLegX, P.frontLegY, false);
  drawHeroLimb(sk, 'arm', -11.2, P.backArmX, P.backArmY, true);

  if (playerSprite) {
    ctx.drawImage(
      playerSprite.c,
      playerSprite.minX, playerSprite.minY,
      playerSprite.w, playerSprite.h
    );
  }

  drawHeroLimb(sk, 'arm', 11.2, P.frontArmX, P.frontArmY, false);
  drawHeroFace(sk, now);

  ctx.restore();
}

/* 四肢端点：anchor 是肩/胯的本地坐标，返回值是手/脚落点。
   坐标原点在脚底中线，y 向上为负，和角色精灵同一套本地坐标。 */
function heroPose(now) {
  const air = player.state === 'jump' || player.state === 'fall';
  const glide = player.state === 'glide';
  const rise = air ? clamp(-player.vy / 800, -1, 1) : 0;
  const spread = air ? clamp(Math.abs(player.vy) / 900, 0, 1) : 0;
  const swing = (player.state === 'idle' && !charging) ? Math.sin(now * 0.0024) : 0;

  let frontLegX = 6.9, frontLegY = -1.5;
  let backLegX = -6.9, backLegY = -1.5;
  let frontArmX = 13.6 + swing * 0.5, frontArmY = -16.9 + swing * 0.9;
  let backArmX = -13.6 - swing * 0.5, backArmY = -16.9 - swing * 0.9;

  if (glide) {
    // 冲刺：四肢全往身后拖，身体被弹射出去
    frontLegX = 1.4; frontLegY = -1.8;
    backLegX = -8.2; backLegY = -3.4;
    frontArmX = 5.2; frontArmY = -20.4;
    backArmX = -3.8; backArmY = -21.8;
  } else if (air) {
    // 腾空：上升时收腿抬臂，下落时张开准备落地
    frontLegX = 6.2 + spread * 2.4; frontLegY = -1.6 - spread * 3.6;
    backLegX = -5.4 - spread * 3.2; backLegY = -1.6 - spread * 1.8;
    frontArmX = 13.8 + rise * 2.6; frontArmY = -18 - rise * 7.4;
    backArmX = -13.8 - rise * 2.6; backArmY = -18 - rise * 7.4;
  } else if (charging) {
    // 蓄力：手臂往后背，重心往下压
    frontArmX = 13.2 + charge * 1.6; frontArmY = -16 + charge * 1.8;
    backArmX = -13.2 - charge * 1.6; backArmY = -16 + charge * 1.8;
    frontLegY = -1.4 - charge * 0.5;
    backLegY = -1.4 - charge * 0.5;
  }

  return {
    frontLegX: frontLegX, frontLegY: frontLegY,
    backLegX: backLegX, backLegY: backLegY,
    frontArmX: frontArmX, frontArmY: frontArmY,
    backArmX: backArmX, backArmY: backArmY
  };
}

/* 一条腿 / 一条手臂：圆头直线 + 脚（鞋）或手掌。
   back = true 的那一侧压暗，前后层次一眼就能看出来。 */
function drawHeroLimb(sk, kind, anchorX, x, y, back) {
  const isLeg = kind === 'leg';
  const anchorY = isLeg ? -11 : -25.8;
  const base = isLeg ? sk.body[1] : sk.body[0];

  ctx.strokeStyle = back
    ? lerpHex(base, '#000000', 0.26)
    : lerpHex(base, '#ffffff', isLeg ? 0.02 : 0.10);
  ctx.lineWidth = isLeg ? 6.6 : 5.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(anchorX, anchorY);
  ctx.lineTo(x, y);
  ctx.stroke();

  if (isLeg) {
    ctx.fillStyle = back ? lerpHex(sk.band[0], '#000000', 0.22) : sk.band[0];
    ctx.beginPath();
    ctx.ellipse(x + (back ? -0.6 : 0.9), y - 0.2, 4.4, 2.9, 0, 0, SKIN_TAU);
    ctx.fill();
  } else {
    ctx.fillStyle = back ? lerpHex(sk.body[0], sk.body[1], 0.55) : lerpHex(sk.body[0], '#ffffff', 0.22);
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, SKIN_TAU);
    ctx.fill();
  }
}

/* 表情：瞳孔看方向、4.2 秒眨一次眼、死亡时变 X 眼。
   精灵里已经烘焙了眼白，这里只叠最上层的那点东西。 */
function drawHeroFace(sk, now) {
  const ey = -38.9;

  if (player.state === 'dead') {
    ctx.strokeStyle = sk.eye || '#2b2320';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let s2 = -1; s2 <= 1; s2 += 2) {
      const cx2 = s2 * 5.4;
      ctx.moveTo(cx2 - 3.2, ey - 3.2); ctx.lineTo(cx2 + 3.2, ey + 3.2);
      ctx.moveTo(cx2 + 3.2, ey - 3.2); ctx.lineTo(cx2 - 3.2, ey + 3.2);
    }
    ctx.stroke();
    return;
  }

  if ((now % 4200) > 4110) {          // 眨眼
    ctx.strokeStyle = sk.eye || '#2b2320';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(-5.4, ey - 1.2, 4.2, Math.PI * 0.16, Math.PI * 0.84);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(5.4, ey - 1.2, 4.2, Math.PI * 0.16, Math.PI * 0.84);
    ctx.stroke();
    return;
  }

  const look = charging ? 1.7 * charge : 0;
  const g = eyeGlow;

  ctx.fillStyle = sk.eye || '#2b2320';
  ctx.beginPath();
  ctx.ellipse(-5.4 + look, ey, 2.6, 3.1, 0, 0, SKIN_TAU);
  ctx.ellipse(5.4 + look, ey, 2.6, 3.1, 0, 0, SKIN_TAU);
  ctx.fill();

  const glR = 1.15 + g * 2.0;
  ctx.fillStyle = g > 0.35 ? 'rgba(255, 250, 220, 1)' : '#ffffff';
  ctx.beginPath();
  ctx.arc(-4.4 + look, ey - 1.3, glR, 0, SKIN_TAU);
  ctx.arc(6.4 + look, ey - 1.3, glR, 0, SKIN_TAU);
  ctx.fill();

  if (g > 0.05) {
    ctx.globalAlpha = g * 0.5;
    ctx.fillStyle = 'rgba(255, 230, 120, 1)';
    ctx.beginPath();
    ctx.arc(-5.4 + look, ey, 6 + g * 4, 0, SKIN_TAU);
    ctx.arc(5.4 + look, ey, 6 + g * 4, 0, SKIN_TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawFx() {
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    const t = 1 - r.life / r.maxLife;
    const rad = 8 + t * 62;
    ctx.strokeStyle = 'rgba(255, 217, 59,' + (1 - t).toFixed(3) + ')';
    ctx.lineWidth = 3.5 * (1 - t) + 1;
    ctx.beginPath();
    ctx.ellipse(r.x - camX, r.y, rad, rad * 0.36, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y, p.size * a + 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    ctx.globalAlpha = Math.min(1, (p.life / p.maxLife) * 1.8);
    ctx.font = fontOf(p.size * uiScale(), 'bold');
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(60, 40, 10, 0.55)';
    ctx.strokeText(p.text, p.x - camX, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x - camX, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawLeaves() {
  for (let i = 0; i < leaves.length; i++) {
    const l = leaves[i];
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = l.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, l.size, l.size * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = 'rgba(60, 70, 30, 0.5)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-l.size * 0.8, 0);
    ctx.lineTo(l.size * 0.8, 0);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* 归一化坐标，运行时再换算，只建一次 */
const GLOW_SPOTS = [
  { nx: 0.16, ny: 0.08, nr: 0.34, sp: 0.00013, ph: 0.0 },
  { nx: 0.60, ny: 0.03, nr: 0.28, sp: 0.00009, ph: 2.1 },
  { nx: 0.86, ny: 0.25, nr: 0.22, sp: 0.00017, ph: 4.2 }
];

function drawGlows(now) {
  if (!glowSprite || perfLevel >= 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const base = Math.min(W, H);
  for (let i = 0; i < GLOW_SPOTS.length; i++) {
    const s = GLOW_SPOTS[i];
    const r = base * s.nr;
    const ox = Math.sin(now * s.sp + s.ph) * W * 0.05;
    const oy = Math.cos(now * s.sp * 1.3 + s.ph) * H * 0.03;
    ctx.globalAlpha = 0.40 + Math.sin(now * s.sp * 2 + s.ph) * 0.13;
    ctx.drawImage(glowSprite, s.nx * W + ox - r, s.ny * H + oy - r, r * 2, r * 2);
  }
  ctx.restore();
}

/* 圆形按钮底板：半透明玻璃感 */
function drawBtnBase(cx, cy, r) {
  ctx.fillStyle = 'rgba(14, 34, 22, 0.38)';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

/* 喇叭：矢量绘制，不再依赖 emoji（各机型渲染差异大且每帧走字体排版） */
function drawSpeakerIcon(cx, cy, r, on) {
  const u = r * 0.5;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(cx - u * 0.95, cy - u * 0.32);
  ctx.lineTo(cx - u * 0.42, cy - u * 0.32);
  ctx.lineTo(cx + u * 0.16, cy - u * 0.86);
  ctx.lineTo(cx + u * 0.16, cy + u * 0.86);
  ctx.lineTo(cx - u * 0.42, cy + u * 0.32);
  ctx.lineTo(cx - u * 0.95, cy + u * 0.32);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = Math.max(1.4, r * 0.10);
  ctx.lineCap = 'round';
  if (on) {
    ctx.beginPath();
    ctx.arc(cx + u * 0.24, cy, u * 0.62, -0.85, 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + u * 0.24, cy, u * 1.05, -0.72, 0.72);
    ctx.stroke();
  } else {
    const d = u * 0.62;
    ctx.beginPath();
    ctx.moveTo(cx + d * 1.05, cy - d);
    ctx.lineTo(cx + d * 2.05, cy + d);
    ctx.moveTo(cx + d * 2.05, cy - d);
    ctx.lineTo(cx + d * 1.05, cy + d);
    ctx.stroke();
  }
}

function drawPauseIcon(cx, cy, r, showPlay) {
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  if (showPlay) {
    const u = r * 0.46;
    ctx.beginPath();
    ctx.moveTo(cx - u * 0.62, cy - u);
    ctx.lineTo(cx + u * 1.05, cy);
    ctx.lineTo(cx - u * 0.62, cy + u);
    ctx.closePath();
    ctx.fill();
  } else {
    const u = r * 0.42, bw = r * 0.26, br = 1.4;
    rr(ctx, cx - u - bw / 2, cy - u, bw, u * 2, br);
    ctx.fill();
    rr(ctx, cx + u - bw / 2, cy - u, bw, u * 2, br);
    ctx.fill();
  }
}

/* 全屏 / 退出全屏 图标：四角括号 */
function drawExpandIcon(cx, cy, r, fullscreen) {
  const u = r * 0.46;
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = Math.max(1.5, r * 0.095);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 0; i < 4; i++) {
    const sx = (i & 1) ? 1 : -1;
    const sy = (i & 2) ? 1 : -1;
    ctx.beginPath();
    if (fullscreen) {
      // 朝内 → 点一下退出全屏
      ctx.moveTo(cx + sx * u * 0.40, cy + sy * u);
      ctx.lineTo(cx + sx * u * 0.40, cy + sy * u * 0.40);
      ctx.lineTo(cx + sx * u, cy + sy * u * 0.40);
    } else {
      // 朝外 → 点一下进全屏（并尝试锁横屏）
      ctx.moveTo(cx + sx * u, cy + sy * u * 0.42);
      ctx.lineTo(cx + sx * u, cy + sy * u);
      ctx.lineTo(cx + sx * u * 0.42, cy + sy * u);
    }
    ctx.stroke();
  }
}

function drawButtons() {
  const r = getBtnRadius();
  const mb = getMuteBtn();
  const pb = getPauseBtn();
  const fb = getFullscreenBtn();
  drawBtnBase(mb.x, mb.y, r);
  drawSpeakerIcon(mb.x, mb.y, r, !muted);
  drawBtnBase(pb.x, pb.y, r);
  drawPauseIcon(pb.x, pb.y, r, gameState === 'paused');
  drawBtnBase(fb.x, fb.y, r);
  drawExpandIcon(fb.x, fb.y, r, isFullscreen());
}

/* ============================================================
 *  18b. 排行榜面板
 * ============================================================ */
function two(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(t) {
  const d = new Date(t);
  return two(d.getMonth() + 1) + '/' + two(d.getDate()) + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
}

function fitText(txt, maxW) {
  const t0 = String(txt);
  if (ctx.measureText(t0).width <= maxW) return t0;
  let t = t0;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

function stamp(d) {
  return d.getFullYear() + '/' + two(d.getMonth() + 1) + '/' + two(d.getDate());
}

/* 把排行榜画成一张竖版长图，点了直接下载 */
function exportBoardImage() {
  try {
    const PW = 420, SC = 2;
    const rows = Math.max(1, board.length);
    const PH = 140 + rows * 34 + 90;      // 高度跟着条目数走，不留大片空白
    const cv = document.createElement('canvas');
    cv.width = PW * SC;
    cv.height = PH * SC;
    const g = cv.getContext('2d');
    if (!g) return;
    g.scale(SC, SC);

    const bg = g.createLinearGradient(0, 0, 0, PH);
    bg.addColorStop(0, '#2f6b46');
    bg.addColorStop(1, '#122c1c');
    g.fillStyle = bg;
    g.fillRect(0, 0, PW, PH);

    g.fillStyle = 'rgba(255,255,255,0.055)';
    g.beginPath(); g.arc(PW - 30, 70, 140, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(10, PH - 30, 120, 0, Math.PI * 2); g.fill();

    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillStyle = '#ffffff';
    g.font = 'bold 25px ' + FONT_FAMILY;
    g.fillText('跳一跳 · 森林', 30, 52);

    g.fillStyle = 'rgba(255,255,255,0.60)';
    g.font = '13px ' + FONT_FAMILY;
    g.fillText('排行榜 · ' + stamp(new Date()), 30, 82);

    g.strokeStyle = 'rgba(255,255,255,0.16)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(30, 106); g.lineTo(PW - 30, 106); g.stroke();

    const list = board;
    const medal = ['#ffd93b', '#cfd8e3', '#f0a86a'];
    let y = 140;
    const rowH = 34;

    if (!list.length) {
      g.textAlign = 'center';
      g.fillStyle = 'rgba(255,255,255,0.55)';
      g.font = '14px ' + FONT_FAMILY;
      g.fillText('还没有记录，先去跳几次吧', PW / 2, 260);
    }

    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      const mid = y + rowH / 2;

      if (i % 2 === 0) {
        g.fillStyle = 'rgba(255,255,255,0.045)';
        g.fillRect(22, y + 2, PW - 44, rowH - 4);
      }

      if (i < 3) {
        g.fillStyle = medal[i];
        g.beginPath(); g.arc(42, mid, 12, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(24,46,28,0.95)';
        g.font = 'bold 13px ' + FONT_FAMILY;
      } else {
        g.fillStyle = 'rgba(255,255,255,0.55)';
        g.font = 'bold 14px ' + FONT_FAMILY;
      }
      g.textAlign = 'center';
      g.fillText(String(i + 1), 42, mid + 0.5);

      g.textAlign = 'left';
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.font = 'bold 15px ' + FONT_FAMILY;
      g.fillText(String(e.n || '玩家').slice(0, 12) + (e.m === 'hard' ? ' [难]' : ''), 66, mid);

      g.textAlign = 'right';
      g.fillStyle = '#ffffff';
      g.font = 'bold 17px ' + FONT_FAMILY;
      g.fillText(String(e.s), PW - 110, mid);

      g.fillStyle = 'rgba(255,255,255,0.38)';
      g.font = '11px ' + FONT_FAMILY;
      g.fillText(fmtTime(e.t), PW - 30, mid + 0.5);

      y += rowH;
    }

    const footTop = y + 16;

    g.strokeStyle = 'rgba(255,255,255,0.14)';
    g.beginPath(); g.moveTo(30, footTop); g.lineTo(PW - 30, footTop); g.stroke();

    g.textAlign = 'left';
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.font = 'bold 15px ' + FONT_FAMILY;
    g.fillText('最高分 ' + best, 30, footTop + 26);

    g.textAlign = 'right';
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.font = '12px ' + FONT_FAMILY;
    g.fillText('昵称 ' + playerName, PW - 30, footTop + 26);

    g.textAlign = 'center';
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.font = '11px ' + FONT_FAMILY;
    g.fillText('按住屏幕蓄力，松开跳跃 · 用手机浏览器打开就能玩', PW / 2, footTop + 54);

    const url = cv.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = '跳一跳-排行榜-' + stamp(new Date()).replace(/\//g, '') + '.png';
    if (document.body) document.body.appendChild(a);
    a.click();
    if (document.body && a.parentNode) {
      setTimeout(function () { try { a.parentNode.removeChild(a); } catch (e) {} }, 300);
    }
  } catch (e) {}
}

function drawBoard() {
  const land = isLandscape();
  const k = uiScale();
  const online = boardTab === 1;

  if (online && onlineState === 'idle') onlineLoad();

  ctx.fillStyle = 'rgba(8, 22, 14, 0.74)';
  ctx.fillRect(0, 0, W, H);

  const list = online ? onlineList : board;
  const n = list.length;

  const cw = Math.min(W * 0.9, (land ? 490 : 348) * k);
  const headerH = 96 * k;
  const footerH = 42 * k;
  const rowH0 = 34 * k;
  const naturalH = headerH + footerH + Math.max(1, n) * rowH0 + 10 * k;
  const ch = Math.min(H * 0.92, Math.max(196 * k, naturalH));
  const cx = W / 2 - cw / 2;
  const cy = H / 2 - ch / 2;

  const pg = ctx.createLinearGradient(0, cy, 0, cy + ch);
  pg.addColorStop(0, 'rgba(40, 78, 52, 0.97)');
  pg.addColorStop(1, 'rgba(20, 46, 30, 0.97)');
  ctx.fillStyle = pg;
  rr(ctx, cx, cy, cw, ch, 20 * k);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 标题
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf(17 * k, 'bold');
  ctx.fillText('排行榜', cx + 20 * k, cy + 26 * k);

  // 在线状态
  if (online) {
    ctx.textAlign = 'right';
    ctx.font = fontOf(10 * k);
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    const st = onlineState === 'loading' ? '连接中'
      : onlineState === 'ok' ? '已连接'
      : onlineState === 'off' ? '未配置' : (onlineState === 'error' ? '离线' : '');
    if (st) ctx.fillText(st, cx + cw - 48 * k, cy + 27 * k);
  }

  // 关闭
  const closeR = 13 * k;
  const ccx = cx + cw - 24 * k;
  const ccy = cy + 26 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(ccx, ccy, closeR, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = Math.max(1.5, 2 * k);
  ctx.lineCap = 'round';
  const xr = closeR * 0.42;
  ctx.beginPath();
  ctx.moveTo(ccx - xr, ccy - xr); ctx.lineTo(ccx + xr, ccy + xr);
  ctx.moveTo(ccx + xr, ccy - xr); ctx.lineTo(ccx - xr, ccy + xr);
  ctx.stroke();
  addHit(ccx - closeR - 10, ccy - closeR - 10, (closeR + 10) * 2, (closeR + 10) * 2, function () { boardOpen = false; });

  // 分页
  const tabW = 50 * k, tabH = 22 * k, tabY = cy + 44 * k;
  for (let i = 0; i < 2; i++) {
    const tx = cx + 20 * k + i * (tabW + 6 * k);
    const on = boardTab === i;
    ctx.fillStyle = on ? 'rgba(126, 222, 156, 0.9)' : 'rgba(255,255,255,0.10)';
    rr(ctx, tx, tabY, tabW, tabH, tabH / 2);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = on ? '#12331e' : 'rgba(255,255,255,0.75)';
    ctx.font = fontOf(11.5 * k, on ? 'bold' : '');
    ctx.fillText(i === 0 ? '本机' : '在线', tx + tabW / 2, tabY + tabH / 2 + 0.5);
    (function (idx) {
      addHit(tx, tabY - 5 * k, tabW, tabH + 10 * k, function () {
        boardTab = idx;
        if (idx === 1 && onlineState !== 'ok') { onlineState = 'idle'; onlineLoad(); }
      });
    })(i);
  }

  // 昵称行
  const nameY = cy + 76 * k;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.font = fontOf(11 * k);
  ctx.fillText('昵称', cx + 20 * k, nameY);
  const nmX = cx + 52 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = fontOf(12.5 * k, 'bold');
  ctx.fillText(playerName, nmX, nameY);
  const nmW = ctx.measureText(playerName).width;

  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = Math.max(1.1, 1.5 * k);
  ctx.lineCap = 'round';
  const penX = nmX + nmW + 12 * k, penY = nameY;
  ctx.beginPath();
  ctx.moveTo(penX - 4 * k, penY + 3.5 * k);
  ctx.lineTo(penX + 3 * k, penY - 3.5 * k);
  ctx.stroke();

  addHit(cx + 18 * k, nameY - 14 * k, Math.min(cw - 36 * k, nmW + 52 * k), 28 * k, function () {
    openNameEditor(nameY - 26 * k);
  });

  // 分隔线
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx + 16 * k, cy + headerH - 8 * k);
  ctx.lineTo(cx + cw - 16 * k, cy + headerH - 8 * k);
  ctx.stroke();

  // 列表
  const listTop = cy + headerH;
  const listH = Math.max(20, ch - headerH - footerH);
  const padX = 18 * k;
  const scoreX = cx + cw * 0.62;
  const timeX = cx + cw - padX;
  const medalColor = ['#ffd93b', '#cfd8e3', '#f0a86a'];

  if (!n) {
    ctx.textAlign = 'center';
    if (online) {
      if (onlineState === 'off') {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = fontOf(12 * k);
        ctx.fillText('还没有配置在线榜', W / 2, cy + headerH + listH * 0.30);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = fontOf(10.5 * k);
        ctx.fillText('用 ?api=你的接口地址 打开一次页面即可', W / 2, cy + headerH + listH * 0.30 + 22 * k);
        ctx.fillText('也可以直接改脚本里的 ONLINE 配置', W / 2, cy + headerH + listH * 0.30 + 40 * k);
      } else if (onlineState === 'loading') {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = fontOf(12 * k);
        ctx.fillText('加载中…', W / 2, cy + headerH + listH * 0.36);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = fontOf(12 * k);
        ctx.fillText(onlineMsg || '暂时连不上服务器', W / 2, cy + headerH + listH * 0.32);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = fontOf(10.5 * k);
        ctx.fillText('点这里重试', W / 2, cy + headerH + listH * 0.32 + 22 * k);
        addHit(cx + 16 * k, cy + headerH, cw - 32 * k, listH, function () {
          onlineState = 'idle';
          onlineLoad();
        });
      }
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = fontOf(12.5 * k);
      ctx.fillText('还没有记录', W / 2, cy + headerH + listH * 0.34);
      ctx.fillText('先跳几次吧', W / 2, cy + headerH + listH * 0.34 + 22 * k);
    }
  } else {
    const rowH = Math.min(rowH0, listH / n);
    const fMain = Math.min(15 * k, rowH * 0.46);
    const fSub = Math.min(10 * k, rowH * 0.32);
    const nameX = cx + padX + 26 * k;
    const nameMax = scoreX - nameX - 14 * k;

    for (let i = 0; i < n; i++) {
      const e = list[i];
      const ry = listTop + rowH * i;
      const midY = ry + rowH * 0.5;
      const isLast = !online && lastRunAt > 0 && e.t === lastRunAt;

      const rowBg = isLast
        ? 'rgba(255,217,59,0.16)'
        : (i % 2 === 0 ? 'rgba(255,255,255,0.04)' : null);
      if (rowBg) {
        ctx.fillStyle = rowBg;
        rr(ctx, cx + 10 * k, ry + rowH * 0.07, cw - 20 * k, rowH * 0.86, 8 * k);
        ctx.fill();
      }

      const rcx = cx + padX + 9 * k;
      if (i < 3) {
        ctx.fillStyle = medalColor[i];
        ctx.beginPath();
        ctx.arc(rcx, midY, Math.min(11 * k, rowH * 0.34), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(28, 50, 30, 0.92)';
        ctx.font = fontOf(Math.min(12 * k, rowH * 0.36), 'bold');
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.52)';
        ctx.font = fontOf(Math.min(13 * k, rowH * 0.40), 'bold');
      }
      ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), rcx, midY + 0.5);

      ctx.textAlign = 'left';
      ctx.fillStyle = isLast ? '#ffe57a' : 'rgba(255,255,255,0.92)';
      ctx.font = fontOf(fMain, 'bold');
      // 条目带了模式标记就在名字后面点一个小胶囊（简 / 难，每日挑战再标「每日」）
      const tag = e.d ? '每日' : (e.m === 'hard' ? '难' : (e.m === 'easy' ? '简' : ''));
      const tagW = tag ? (e.d ? 30 * k : 16 * k) : 0;
      const nmTxt = fitText(e.n || '玩家', nameMax - tagW);
      ctx.fillText(nmTxt, nameX, midY);
      if (tag) {
        const tx0 = nameX + ctx.measureText(nmTxt).width + 5 * k;
        const th = Math.min(14 * k, rowH * 0.46);
        ctx.fillStyle = e.d ? 'rgba(255,217,59,0.92)'
          : (e.m === 'hard' ? 'rgba(255,176,96,0.92)' : 'rgba(126,233,168,0.88)');
        rr(ctx, tx0, midY - th / 2, tagW - 3 * k, th, th / 2);
        ctx.fill();
        ctx.fillStyle = '#16301f';
        ctx.font = fontOf(th * (e.d ? 0.52 : 0.66), 'bold');
        ctx.textAlign = 'center';
        ctx.fillText(tag, tx0 + (tagW - 3 * k) / 2, midY + 0.5);
        ctx.textAlign = 'left';
      }

      ctx.textAlign = 'right';
      ctx.fillStyle = isLast ? '#ffe57a' : '#ffffff';
      ctx.font = fontOf(fMain, 'bold');
      ctx.fillText(String(e.s), scoreX, midY);

      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255,255,255,0.38)';
      ctx.font = fontOf(fSub);
      ctx.fillText(fmtTime(e.t), timeX, midY + 0.5);
    }
  }

  // 底部：保存长图 + 提示
  const sbW = Math.min(112 * k, cw * 0.36);
  const sbH = 27 * k;
  const sbX = cx + 18 * k;
  const sbY = cy + ch - footerH + 7 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  rr(ctx, sbX, sbY, sbW, sbH, sbH / 2);
  ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.font = fontOf(11.5 * k, 'bold');
  ctx.fillText('保存长图', sbX + sbW / 2, sbY + sbH / 2 + 0.5);
  addHit(sbX - 4 * k, sbY - 4 * k, sbW + 8 * k, sbH + 8 * k, exportBoardImage);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.34)';
  ctx.font = fontOf(9.5 * k);
  ctx.fillText('点击空白处关闭', cx + cw - 18 * k, sbY + sbH / 2);
}

/* ============================================================
 *  19. 自适应 UI
 * ============================================================ */
/* 帧率胶囊：右上角按钮列下面，点一下切换 隐藏 / FPS / FPS+ms。
   数字用平滑值，且等宽对齐，60 → 59 的时候数字不会左右跳。 */
function drawFpsChip() {
  if (!fpsMode) return;
  if (settingsOpen || boardOpen || achOpen) return;   // 面板开着就别挡视线
  const k = uiScale();
  const fb = getFullscreenBtn();
  const fs = (isLandscape() ? 10 : 11) * k;
  const h = (isLandscape() ? 20 : 22) * k;
  ctx.font = fontOf(fs, 'bold');
  const txt = fpsShown + ' FPS' + (fpsMode === 2 ? '  ' + fpsMsShown.toFixed(1) + 'ms' : '');
  const w = ctx.measureText(txt).width + 22 * k;

  // 右对齐到按钮列；屏幕太窄时也不越界
  let x = Math.min(W - 10 * k - w, fb.x + fb.r - w);
  x = Math.max(8 * k, x);
  const y = fb.y + fb.r + 8 * k;

  ctx.save();
  const bg = ctx.createLinearGradient(0, y, 0, y + h);
  bg.addColorStop(0, 'rgba(10, 32, 20, 0.52)');
  bg.addColorStop(1, 'rgba(10, 32, 20, 0.34)');
  ctx.fillStyle = bg;
  rr(ctx, x, y, w, h, h / 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = fpsColor();
  ctx.beginPath();
  ctx.arc(x + 9.5 * k, y + h / 2, 2.6 * k, 0, SKIN_TAU);
  ctx.fill();

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = fontOf(fs, 'bold');
  ctx.fillText(txt, x + 15.5 * k, y + h / 2 + 0.5);

  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  rr(ctx, x + 2, y + 1.5, w - 4, h * 0.42, h * 0.21);
  ctx.fill();
  ctx.restore();

  addHit(x - 6, y - 6, w + 12, h + 12, function () { setFpsMode((fpsMode + 1) % 3); });
}

function drawUI(now) {
  const land = isLandscape();
  const k = uiScale();
  const uiTop = (land ? 12 : 16) * k + safeTop;

  const scoreSize = (land ? 36 : 46) * k;
  const subSize = (land ? 12 : 14) * k;
  const comboSize = (land ? 15 : 18) * k;

  // 分数（滚动动画 + 圆角描边，比直角描边干净）
  ctx.save();
  ctx.translate((land ? 22 : 26) * k, uiTop);
  const sc = 1 + scorePop * 0.25;
  ctx.scale(sc, sc);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';
  ctx.font = fontOf(scoreSize, 'bold');
  ctx.lineWidth = Math.max(4, scoreSize * 0.14);
  ctx.strokeStyle = 'rgba(24, 58, 34, 0.45)';
  ctx.strokeText(String(Math.round(displayScore)), 0, 0);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(Math.round(displayScore)), 0, 0);
  ctx.restore();

  // 最高分 + 连击
  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';

  const subX = (land ? 24 : 28) * k;
  const subY = uiTop + scoreSize * 0.99 + (land ? 4 : 6) * k;

  const bestTxt = '最高 ' + best;
  ctx.font = fontOf(subSize);
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(24, 58, 34, 0.34)';
  ctx.strokeText(bestTxt, subX, subY);
  ctx.fillStyle = 'rgba(255,255,255,0.86)';
  ctx.fillText(bestTxt, subX, subY);

  // 难度徽标：跟着「最高」后面，一眼看出这局是哪个模式
  {
    const M = MODE();
    const chipH = subSize * 1.22;
    const chipY = subY + subSize * 0.06;
    const chipX = subX + ctx.measureText(bestTxt).width + 8 * k;
    const chipTxt = dailyKey ? '每日 · ' + M.name : M.name;
    ctx.font = fontOf(subSize * 0.82, 'bold');
    const chipW = ctx.measureText(chipTxt).width + 15 * k;
    ctx.fillStyle = dailyKey ? 'rgba(255,217,59,0.95)'
      : (M.arc ? 'rgba(126,233,168,0.92)' : 'rgba(255,176,96,0.94)');
    rr(ctx, chipX, chipY, chipW, chipH, chipH / 2);
    ctx.fill();
    ctx.fillStyle = '#12331e';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(chipTxt, chipX + chipW / 2, chipY + chipH / 2 + 0.5);
    // 每日挑战：后面跟今天的最好成绩
    if (dailyKey) {
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,231,150,0.92)';
      ctx.font = fontOf(subSize * 0.82);
      ctx.fillText('今日 ' + dailyBest, chipX + chipW + 7 * k, chipY + chipH / 2 + 0.5);
    } else if (!M.arc) {
      // 困难模式再点一个小字，说明「没有抛物线」
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,214,160,0.92)';
      ctx.font = fontOf(subSize * 0.82);
      ctx.fillText('直线', chipX + chipW + 7 * k, chipY + chipH / 2 + 0.5);
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    ctx.font = fontOf(subSize);
  }

  if (combo >= 2) {
    const cy2 = subY + subSize * 1.75;
    const pulse = 1 + Math.max(0, Math.sin(now / 230)) * 0.045;
    ctx.save();
    ctx.translate(subX, cy2);
    ctx.scale(pulse, pulse);
    ctx.font = fontOf(comboSize, 'bold');
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(24, 58, 34, 0.40)';
    ctx.strokeText('连击 x' + combo, 0, 0);
    ctx.fillStyle = '#9ef07a';
    ctx.fillText('连击 x' + combo, 0, 0);
    ctx.restore();
  }
  ctx.restore();

  // 蓄力条
  if (charging) {
    const bw = Math.min(W * (land ? 0.34 : 0.50), (land ? 300 : 280) * k);
    const bx = (W - bw) / 2;
    const bh = (land ? 8 : 10) * k;
    const by = H - (land ? 32 : 48) * k - safeBottom;

    // 底槽
    ctx.fillStyle = 'rgba(10, 30, 18, 0.28)';
    rr(ctx, bx - 2, by - 2, bw + 4, bh + 4, (bh + 4) / 2);
    ctx.fill();

    const full = charge > 0.985;
    const blink = full && Math.floor(now / 90) % 2 === 0;

    const cg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    cg.addColorStop(0, blink ? '#fff9c4' : '#8ee06a');
    cg.addColorStop(0.6, blink ? '#fff59d' : '#ffd93b');
    cg.addColorStop(1, blink ? '#ffd54f' : '#ff6b4a');
    ctx.fillStyle = cg;
    rr(ctx, bx, by, Math.max(bh, bw * charge), bh, bh / 2);
    ctx.fill();

    // 25% 刻度：给“按多久跳多远”一个参照
    ctx.strokeStyle = 'rgba(255,255,255,0.40)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 1; i < 4; i++) {
      const tx = bx + bw * i / 4;
      ctx.moveTo(tx, by - 1.5);
      ctx.lineTo(tx, by + bh + 1.5);
    }
    ctx.stroke();

    // 顶部高光
    if (charge > 0.04) {
      ctx.fillStyle = 'rgba(255,255,255,0.26)';
      rr(ctx, bx + 1, by + 1, Math.max(1, bw * charge - 2), bh * 0.40, bh * 0.2);
      ctx.fill();
    }
  }

  // 新手提示
  if (gameState === 'playing' && !tutorialDone && !charging) {
    const fs = (land ? 14 : 16) * k;
    const pulse = 0.72 + Math.sin(now / 380) * 0.22;
    const hy = H - (land ? 62 : 86) * k - safeBottom;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = pulse;
    ctx.font = fontOf(fs);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(18, 44, 26, 0.50)';
    ctx.strokeText('按住屏幕蓄力，松开跳跃', W / 2, hy);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('按住屏幕蓄力，松开跳跃', W / 2, hy);

    // 呼吸的小箭头
    const ay = hy + fs * 1.3 + Math.sin(now / 320) * 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(W / 2, ay - 7);
    ctx.lineTo(W / 2, ay + 6);
    ctx.moveTo(W / 2 - 6, ay);
    ctx.lineTo(W / 2, ay + 6);
    ctx.lineTo(W / 2 + 6, ay);
    ctx.stroke();
    ctx.restore();
  }

  drawButtons();
  drawFpsChip();
}

/* 通用圆角胶囊按钮 */
function drawPill(bx, by, bw, bh, c1, c2, label, labelSize) {
  const r = bh / 2;
  const g = ctx.createLinearGradient(0, by, 0, by + bh);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.fillStyle = g;
  rr(ctx, bx, by, bw, bh, r);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  rr(ctx, bx + 2, by + 2, bw - 4, bh * 0.44, r * 0.8);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf(labelSize, 'bold');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, bx + bw / 2, by + bh / 2 + 1);
}

/* 小号开关胶囊 */
function drawToggle(x, y, w, h, on, label) {
  const r = h / 2;
  ctx.fillStyle = on ? 'rgba(126, 222, 156, 0.92)' : 'rgba(255,255,255,0.14)';
  rr(ctx, x, y, w, h, r);
  ctx.fill();
  ctx.fillStyle = on ? '#12331e' : 'rgba(255,255,255,0.68)';
  ctx.font = fontOf(h * 0.44, 'bold');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 0.5);
}

function drawPaused() {
  const land = isLandscape();
  const k = uiScale();
  ctx.fillStyle = 'rgba(10, 26, 16, 0.66)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const bw = (land ? 196 : 224) * k;
  const bh = (land ? 44 : 50) * k;
  const gap = 10 * k;
  const colW = (bw - gap) / 2;
  const bh2 = bh * 0.84;
  const bh3 = bh * 0.6;

  const titleY = H * (land ? 0.26 : 0.30);
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf((land ? 28 : 32) * k, 'bold');
  ctx.fillText('已暂停', W / 2, titleY);

  const by = titleY + (land ? 44 : 54) * k;
  drawPill(W / 2 - bw / 2, by, bw, bh, '#63d977', '#38974a', '继续', 17 * k);
  addHit(W / 2 - bw / 2, by, bw, bh, function () { togglePause(); });

  const by2 = by + bh + gap;
  drawPill(W / 2 - bw / 2, by2, colW, bh2,
    'rgba(255,255,255,0.24)', 'rgba(255,255,255,0.12)', '排行榜', 13 * k);
  drawPill(W / 2 + gap / 2, by2, colW, bh2,
    'rgba(255,255,255,0.24)', 'rgba(255,255,255,0.12)', '重新开始', 13 * k);
  addHit(W / 2 - bw / 2, by2, colW, bh2, function () { boardOpen = true; });
  addHit(W / 2 + gap / 2, by2, colW, bh2, function () {
    boardOpen = false;
    reset();
    beep(520, 0.08, 'sine', 0.09);
  });

  const by3 = by2 + bh2 + gap;
  drawPill(W / 2 - bw / 2, by3, bw, bh3,
    'rgba(255,255,255,0.24)', 'rgba(255,255,255,0.12)',
    '设置 · ' + MODE().name + ' / ' + SKIN().name, 12.5 * k);
  addHit(W / 2 - bw / 2, by3, bw, bh3, function () { settingsOpen = true; });

  const by4 = by3 + bh3 + gap;
  drawToggle(W / 2 - bw / 2, by4, colW, bh3, !muted, muted ? '音效 关' : '音效 开');
  drawToggle(W / 2 + gap / 2, by4, colW, bh3, hapticsOn, hapticsOn ? '震动 开' : '震动 关');
  addHit(W / 2 - bw / 2, by4, colW, bh3, function () { setMuted(!muted); });
  addHit(W / 2 + gap / 2, by4, colW, bh3, function () { setHaptics(!hapticsOn); });

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.60)';
  ctx.font = fontOf((land ? 12 : 13) * k);
  ctx.fillText('点击空白处继续游戏', W / 2, by4 + bh3 + (land ? 20 : 26) * k);
}

function drawOver() {
  const land = isLandscape();
  const k = uiScale();

  // 淡入，避免瞬间糊一脸
  const age = clamp((performance.now() - overAt) / 240, 0, 1);
  const ease = 1 - Math.pow(1 - age, 3);

  ctx.globalAlpha = age;
  ctx.fillStyle = 'rgba(10, 26, 16, 0.66)';
  ctx.fillRect(0, 0, W, H);

  const cw = Math.min(W * 0.84, 340 * k);
  const ch = Math.min(H * 0.78, (land ? 320 : 392) * k);
  const cx = W / 2 - cw / 2;
  const cy = H / 2 - ch / 2 + (1 - ease) * 14;

  // 面板
  const pg = ctx.createLinearGradient(0, cy, 0, cy + ch);
  pg.addColorStop(0, 'rgba(40, 78, 52, 0.96)');
  pg.addColorStop(1, 'rgba(20, 46, 30, 0.96)');
  ctx.fillStyle = pg;
  rr(ctx, cx, cy, cw, ch, 20 * k);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const isRecord = score > runBest && score > 0;

  // 标题
  ctx.fillStyle = isRecord ? '#ffd93b' : 'rgba(255,255,255,0.88)';
  ctx.font = fontOf(13 * k, 'bold');
  ctx.fillText(isRecord ? '★ 新纪录 ★' : '游戏结束', W / 2, cy + ch * 0.12);

  // 每日挑战：把这局的日期和今天的最好成绩一并报出来
  if (dailyKey) {
    ctx.fillStyle = 'rgba(255,217,59,0.90)';
    ctx.font = fontOf(10.5 * k, 'bold');
    ctx.fillText('每日挑战 · ' + dailyKey + ' · 今日最高 ' + dailyBest, W / 2, cy + ch * 0.19);
  }

  // 分数
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf(Math.min(cw * 0.30, 66 * k), 'bold');
  ctx.fillText(String(score), W / 2, cy + ch * 0.30);

  // 最高分 + 本局名次
  ctx.fillStyle = 'rgba(255,255,255,0.60)';
  ctx.font = fontOf(12 * k);
  ctx.fillText(
    (MODE().name + ' · ') + (lastRank > 0 ? '最高分 ' + best + '   ·   第 ' + lastRank + ' 名' : '最高分  ' + best),
    W / 2, cy + ch * 0.43
  );

  // 差多少分破纪录，比只报一个最高分更能推人再来一局
  if (best > score) {
    ctx.fillStyle = 'rgba(255,255,255,0.40)';
    ctx.font = fontOf(10.5 * k);
    ctx.fillText('距离最高分还差 ' + (best - score) + ' 分', W / 2, cy + ch * 0.472);
  }

  // 分隔线
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx + cw * 0.12, cy + ch * 0.50);
  ctx.lineTo(cx + cw * 0.88, cy + ch * 0.50);
  ctx.stroke();

  // 统计三列
  const stats = [
    ['最高连击', 'x' + maxCombo],
    ['完美', String(perfectCount)],
    ['惊险', String(rescueCount)]
  ];
  const colW = cw / 3;
  for (let i = 0; i < 3; i++) {
    const sx = cx + colW * (i + 0.5);
    ctx.fillStyle = '#ffffff';
    ctx.font = fontOf(15 * k, 'bold');
    ctx.fillText(stats[i][1], sx, cy + ch * 0.585);
    ctx.fillStyle = 'rgba(255,255,255,0.52)';
    ctx.font = fontOf(10.5 * k);
    ctx.fillText(stats[i][0], sx, cy + ch * 0.675);
  }

  // 按钮：再来一次 + 排行榜 + 设置
  const bh = (land ? 44 : 50) * k;
  const by = cy + ch * 0.775;
  const gap = 9 * k;
  const bw1 = Math.min(cw * 0.42, 132 * k);
  const bw2 = Math.min(cw * 0.28, 92 * k);
  const bw3 = Math.min(cw * 0.24, 82 * k);
  const total = bw1 + bw2 + bw3 + gap * 2;
  const bx1 = W / 2 - total / 2;
  const bx2 = bx1 + bw1 + gap;
  const bx3 = bx2 + bw2 + gap;

  drawPill(bx1, by, bw1, bh, '#63d977', '#38974a', '再来一次', 15 * k);
  drawPill(bx2, by, bw2, bh, 'rgba(255,255,255,0.24)', 'rgba(255,255,255,0.12)', '排行榜', 12.5 * k);
  drawPill(bx3, by, bw3, bh, 'rgba(255,255,255,0.24)', 'rgba(255,255,255,0.12)', '设置', 12.5 * k);

  addHit(bx1, by, bw1, bh, restartGame);
  addHit(bx2, by, bw2, bh, function () { boardOpen = true; });
  addHit(bx3, by, bw3, bh, function () { settingsOpen = true; });

  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.font = fontOf(10.5 * k);
  ctx.fillText('点击空白处重新开始', W / 2, by + bh + 15 * k);

  ctx.globalAlpha = 1;
}

/* 皮肤小头像：设置面板里用，跟场景里的小人同一套配色 */
function drawSkinAvatar(cx, cy, r, sk, unlocked) {
  ctx.save();
  ctx.globalAlpha = unlocked ? 1 : 0.40;

  /* 半身像：头部按实战比例缩小，身体只画到腰 —— 皮肤选择那种小格子里
     塞全身会糊，塞半身反而更像「这个角色长什么样」。 */
  const sc = (r * 0.68) / 14.6;
  ctx.translate(cx, cy - r * 0.18);
  ctx.scale(sc, sc);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const light = sk.body[0], dark = sk.body[1];
  const face = sk.face || '#ffe0c8';
  const deep = lerpHex(dark, '#000000', 0.42);

  if (sk.glow) {
    const gg = ctx.createRadialGradient(0, 0, 2, 0, 0, 40);
    gg.addColorStop(0, sk.glow);
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, SKIN_TAU);
    ctx.fill();
  }

  /* 耳朵 / 叶子 / 触角 */
  if (sk.ears === 'round' || sk.ears === 'leaf') {
    const onlyRight = sk.ears === 'leaf';
    for (let i = onlyRight ? 1 : 0; i < 2; i++) {
      const ex = (i === 0 ? -1 : 1) * 13.2;
      ctx.fillStyle = sk.ear[0];
      ctx.beginPath();
      ctx.ellipse(ex, -2, 5.7, 6.1, 0, 0, SKIN_TAU);
      ctx.fill();
      ctx.fillStyle = sk.ear[1];
      ctx.beginPath();
      ctx.ellipse(ex, -2, 2.8, 3.2, 0, 0, SKIN_TAU);
      ctx.fill();
    }
  }
  if (sk.ears === 'leaf') {
    ctx.fillStyle = sk.band[0];
    ctx.beginPath();
    ctx.moveTo(-4.6, -11);
    ctx.quadraticCurveTo(-17.5, -17.5, -9.4, -22);
    ctx.quadraticCurveTo(-2, -15.5, -4.6, -11);
    ctx.fill();
  }
  if (sk.ears === 'antenna') {
    ctx.strokeStyle = sk.band[0];
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-6.4, -11); ctx.quadraticCurveTo(-9.4, -16, -10, -20);
    ctx.moveTo(6.4, -11); ctx.quadraticCurveTo(9.4, -16, 10, -20);
    ctx.stroke();
    ctx.fillStyle = sk.ear[1];
    ctx.beginPath();
    ctx.arc(-10, -21.6, 3.2, 0, SKIN_TAU);
    ctx.arc(10, -21.6, 3.2, 0, SKIN_TAU);
    ctx.fill();
  }

  /* 身体 */
  const bg = ctx.createLinearGradient(-9, 8, 9, 30);
  bg.addColorStop(0, lerpHex(light, '#ffffff', 0.18));
  bg.addColorStop(0.52, light);
  bg.addColorStop(1, dark);
  ctx.fillStyle = bg;
  rr(ctx, -11.8, 8.5, 23.6, 22.5, 9.5);
  ctx.fill();
  ctx.fillStyle = sk.belly;
  rr(ctx, -7.8, 11, 15.6, 10.2, 5.1);
  ctx.fill();

  if (sk.pattern === 'stripe') {
    ctx.save();
    rr(ctx, -11.8, 8.5, 23.6, 22.5, 9.5);
    ctx.clip();
    ctx.fillStyle = sk.band[0];
    ctx.fillRect(-12, 18.4, 24, 4.8);
    ctx.fillRect(-12, 26.8, 24, 4.8);
    ctx.restore();
  } else {
    ctx.fillStyle = sk.band[0];
    rr(ctx, -12.8, 24, 25.6, 6.4, 3.2);
    ctx.fill();
    ctx.fillStyle = sk.band[1];
    rr(ctx, -12.8, 24, 25.6, 2.1, 1.6);
    ctx.fill();
  }

  /* 头 */
  const hg = ctx.createRadialGradient(-5.5, -7, 2, -1, 0, 21);
  hg.addColorStop(0, lerpHex(light, '#ffffff', 0.36));
  hg.addColorStop(0.55, light);
  hg.addColorStop(1, dark);
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(0, 0, 14.6, 0, SKIN_TAU);
  ctx.fill();

  ctx.fillStyle = face;
  ctx.beginPath();
  ctx.ellipse(0, 2.4, 10.9, 9.7, 0, 0, SKIN_TAU);
  ctx.fill();

  /* 眼睛 + 嘴 */
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(-5.4, 0.1, 4.5, 5.1, 0, 0, SKIN_TAU);
  ctx.ellipse(5.4, 0.1, 4.5, 5.1, 0, 0, SKIN_TAU);
  ctx.fill();
  ctx.fillStyle = sk.eye || '#2b2320';
  ctx.beginPath();
  ctx.ellipse(-5.4, 0.3, 2.6, 3.1, 0, 0, SKIN_TAU);
  ctx.ellipse(5.4, 0.3, 2.6, 3.1, 0, 0, SKIN_TAU);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-4.4, -0.8, 1.2, 0, SKIN_TAU);
  ctx.arc(6.4, -0.8, 1.2, 0, SKIN_TAU);
  ctx.fill();
  ctx.strokeStyle = lerpHex(deep, '#000000', 0.15);
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.arc(0, 6.2, 3.5, Math.PI * 0.18, Math.PI * 0.82);
  ctx.stroke();
  ctx.fillStyle = sk.cheek;
  ctx.beginPath();
  ctx.ellipse(-9.7, 5.6, 3.5, 2.3, 0, 0, SKIN_TAU);
  ctx.ellipse(9.7, 5.6, 3.5, 2.3, 0, 0, SKIN_TAU);
  ctx.fill();

  /* 帽子 */
  if (sk.hat === 'crown') {
    ctx.fillStyle = '#ffd94a';
    ctx.beginPath();
    ctx.moveTo(-7.6, -13.2);
    ctx.lineTo(-7.6, -18.6);
    ctx.lineTo(-3.2, -15.6);
    ctx.lineTo(0, -20.6);
    ctx.lineTo(3.2, -15.6);
    ctx.lineTo(7.6, -18.6);
    ctx.lineTo(7.6, -13.2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff5f5f';
    ctx.beginPath();
    ctx.arc(0, -16.6, 1.6, 0, SKIN_TAU);
    ctx.fill();
  } else if (sk.hat === 'band') {
    ctx.fillStyle = sk.band[0];
    rr(ctx, -14, -10.4, 28, 5.6, 2.8);
    ctx.fill();
    ctx.fillStyle = sk.band[1];
    rr(ctx, -14, -10.4, 28, 1.8, 1.4);
    ctx.fill();
  } else if (sk.hat === 'beanie') {
    ctx.fillStyle = sk.band[0];
    ctx.beginPath();
    ctx.arc(0, -6, 13, Math.PI * 1.02, Math.PI * 1.98);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = sk.band[1];
    rr(ctx, -14.2, -8.6, 28.4, 4.8, 2.4);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, -19.4, 3.6, 0, SKIN_TAU);
    ctx.fill();
  }

  ctx.restore();
}

/* ============================================================
 *  19b. 设置面板（难度 + 皮肤 + 帧率）
 * ============================================================ */
function drawSettings() {
  const land = isLandscape();
  const k = uiScale();
  const M = MODE();

  ctx.fillStyle = 'rgba(8, 22, 14, 0.80)';
  ctx.fillRect(0, 0, W, H);

  const cw = Math.min(W * 0.92, (land ? 470 : 336) * k);
  const cols = land ? 6 : 3;
  const chipH = (land ? 56 : 76) * k;
  const rows = Math.ceil(SKINS.length / cols);
  const gapY = 9 * k;
  const headH = (land ? 190 : 198) * k;
  const footH = (land ? 58 : 62) * k;
  const rowExtra = ((land ? 34 : 38) + 27) * k;   // 「每日挑战 / 成就」这一行（含下面的小字）
  const fpsRowH = (land ? 32 : 36) * k;           // 「帧率显示」开关这一行
  const ch = Math.min(H * 0.94, headH + rows * chipH + (rows - 1) * gapY + footH + rowExtra + fpsRowH + 10 * k);
  const cx = W / 2 - cw / 2;
  const cy = H / 2 - ch / 2;
  const padX = 18 * k;

  const pg = ctx.createLinearGradient(0, cy, 0, cy + ch);
  pg.addColorStop(0, 'rgba(42, 80, 54, 0.98)');
  pg.addColorStop(1, 'rgba(20, 46, 30, 0.98)');
  ctx.fillStyle = pg;
  rr(ctx, cx, cy, cw, ch, 20 * k);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 点面板本身不吃到「关闭」
  addHit(cx, cy, cw, ch, function () {});

  // 标题
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf(17 * k, 'bold');
  ctx.fillText('设置', cx + padX, cy + 26 * k);

  // 临时提示（解锁 / 换装）
  if (settingsMsg && performance.now() - settingsMsgAt < 2000) {
    const fade = 1 - clamp((performance.now() - settingsMsgAt - 1400) / 600, 0, 1);
    ctx.textAlign = 'right';
    ctx.globalAlpha = fade;
    ctx.fillStyle = '#ffd93b';
    ctx.font = fontOf(10.5 * k, 'bold');
    ctx.fillText(settingsMsg, cx + cw - 52 * k, cy + 26 * k);
    ctx.globalAlpha = 1;
  }

  // 关闭
  const closeR = 13 * k;
  const ccx = cx + cw - 24 * k;
  const ccy = cy + 26 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.arc(ccx, ccy, closeR, 0, SKIN_TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = Math.max(1.5, 2 * k);
  ctx.lineCap = 'round';
  const xr = closeR * 0.42;
  ctx.beginPath();
  ctx.moveTo(ccx - xr, ccy - xr); ctx.lineTo(ccx + xr, ccy + xr);
  ctx.moveTo(ccx + xr, ccy - xr); ctx.lineTo(ccx - xr, ccy + xr);
  ctx.stroke();
  addHit(ccx - closeR - 10, ccy - closeR - 10, (closeR + 10) * 2, (closeR + 10) * 2, function () {
    settingsOpen = false;
  });

  /* ---------------- 难度 ---------------- */
  let y = cy + 50 * k;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = fontOf(11.5 * k, 'bold');
  ctx.fillText('难度', cx + padX, y);
  if (!land) {
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.font = fontOf(9.5 * k);
    ctx.fillText('切换会重开一局', cx + cw - padX, y);
  }
  y += 14 * k;

  const gap = 10 * k;
  const mw = (cw - padX * 2 - gap) / 2;
  const mh = (land ? 46 : 54) * k;
  for (let i = 0; i < MODE_LIST.length; i++) {
    const m = MODES[MODE_LIST[i]];
    const bx = cx + padX + i * (mw + gap);
    const on = modeKey === m.id;
    ctx.fillStyle = on
      ? (m.id === 'hard' ? 'rgba(255,176,96,0.20)' : 'rgba(126,233,168,0.20)')
      : 'rgba(255,255,255,0.06)';
    rr(ctx, bx, y, mw, mh, 12 * k);
    ctx.fill();
    ctx.strokeStyle = on ? m.color : 'rgba(255,255,255,0.14)';
    ctx.lineWidth = on ? 2 : 1;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = on ? '#ffffff' : 'rgba(255,255,255,0.72)';
    ctx.font = fontOf((land ? 14 : 15.5) * k, 'bold');
    ctx.fillText(m.name, bx + mw / 2, y + mh * 0.36);
    ctx.fillStyle = on ? m.color : 'rgba(255,255,255,0.40)';
    ctx.font = fontOf((land ? 9.5 : 10.5) * k);
    ctx.fillText(m.sub, bx + mw / 2, y + mh * 0.73);
    (function (key) {
      addHit(bx, y, mw, mh, function () {
        if (key !== modeKey) applyMode(key);
      });
    })(m.id);
  }
  y += mh + (land ? 12 : 16) * k;

  // 说明
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.44)';
  ctx.font = fontOf((land ? 9.5 : 10.5) * k);
  ctx.fillText(M.arc ? '简单：抛物线跳跃 · 落点预览 · 平台更宽'
                     : '困难：取消抛物线，直线冲刺 · 无落点预览 · 平台更窄',
               cx + padX, y);
  y += (land ? 20 : 24) * k;

  /* ---------------- 每日挑战 / 成就 ---------------- */
  {
    const rw = (cw - padX * 2 - gap) / 2;
    const rh = (land ? 34 : 38) * k;
    const ry = y;
    const onDaily = !!dailyKey;
    drawPill(cx + padX, ry, rw, rh,
      onDaily ? 'rgba(255,217,59,0.92)' : 'rgba(255,217,59,0.22)',
      onDaily ? 'rgba(214,154,18,0.92)' : 'rgba(255,217,59,0.12)',
      onDaily ? '重开今日挑战' : '每日挑战', 12.5 * k);
    addHit(cx + padX, ry, rw, rh, function () { startDaily(); });

    drawPill(cx + padX + rw + gap, ry, rw, rh,
      'rgba(255,255,255,0.24)', 'rgba(255,255,255,0.12)',
      '成就 ' + achCount() + '/' + ACHS.length, 12.5 * k);
    addHit(cx + padX + rw + gap, ry, rw, rh, function () {
      settingsOpen = false;
      achOpen = true;
    });

    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,217,59,0.62)';
    ctx.font = fontOf(9.5 * k);
    ctx.fillText('今日最高 ' + dailyBest + ' 分', cx + padX + 2 * k, ry + rh + 9 * k);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.fillText('同一套平台，全球同题', cx + cw - padX - 2 * k, ry + rh + 9 * k);
    y += rowExtra;
  }

  /* ---------------- 帧率显示 ---------------- */
  {
    const rw = (cw - padX * 2 - gap) / 2;
    const rh = (land ? 30 : 34) * k;
    const on = fpsMode > 0;
    drawPill(cx + padX, y, rw, rh,
      on ? 'rgba(126,233,168,0.34)' : 'rgba(255,255,255,0.12)',
      on ? 'rgba(46,140,88,0.26)' : 'rgba(255,255,255,0.05)',
      '帧率显示 ' + (fpsMode === 0 ? '关' : (fpsMode === 1 ? '开' : '开+毫秒')), 12 * k);
    addHit(cx + padX, y, rw, rh, function () { setFpsMode(fpsMode ? 0 : 1); });

    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.font = fontOf(9.5 * k);
    ctx.fillText('点右上角胶囊也能切', cx + padX + rw + gap + 2 * k, y + rh / 2);
    y += rh + 10 * k;
  }

  /* ---------------- 皮肤 ---------------- */
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = fontOf(11.5 * k, 'bold');
  ctx.fillText('皮肤', cx + padX, y);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.34)';
  ctx.font = fontOf(9.5 * k);
  ctx.fillText('历史最高 ' + overallBest() + ' 分', cx + cw - padX, y);
  y += 13 * k;

  const chipW = (cw - padX * 2 - gap * (cols - 1)) / cols;
  for (let i = 0; i < SKINS.length; i++) {
    const sk = SKINS[i];
    const bx = cx + padX + (i % cols) * (chipW + gap);
    const by = y + Math.floor(i / cols) * (chipH + gapY);
    const unlocked = skinUnlocked(sk);
    const sel = skinId === sk.id;

    ctx.fillStyle = sel ? 'rgba(255,217,59,0.14)' : 'rgba(255,255,255,0.05)';
    rr(ctx, bx, by, chipW, chipH, 12 * k);
    ctx.fill();
    if (sel) {
      ctx.strokeStyle = 'rgba(255,217,59,0.85)';
      ctx.lineWidth = 2 * k;
      ctx.stroke();
    }

    const ar = Math.min(chipW * 0.27, (land ? 15 : 19) * k);
    drawSkinAvatar(bx + chipW / 2, by + chipH * (land ? 0.44 : 0.42), ar, sk, unlocked);

    ctx.textAlign = 'center';
    ctx.fillStyle = unlocked ? (sel ? '#ffe57a' : 'rgba(255,255,255,0.86)') : 'rgba(255,255,255,0.32)';
    ctx.font = fontOf((land ? 9 : 10.5) * k, sel ? 'bold' : '');
    ctx.fillText(sk.name, bx + chipW / 2, by + chipH * (land ? 0.80 : 0.79));

    if (!unlocked) {
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      ctx.font = fontOf((land ? 7.5 : 8.5) * k);
      ctx.fillText(sk.unlock + ' 分解锁', bx + chipW / 2, by + chipH * (land ? 0.93 : 0.92));
    }

    (function (skin) {
      addHit(bx, by, chipW, chipH, function () { applySkin(skin); });
    })(sk);
  }
  y += rows * chipH + (rows - 1) * gapY + 12 * k;

  // 完成
  const cbw = Math.min(cw * 0.6, 180 * k);
  const cbh = (land ? 36 : 40) * k;
  const cbx = W / 2 - cbw / 2;
  drawPill(cbx, y, cbw, cbh, '#63d977', '#38974a', '好了', 14 * k);
  addHit(cbx, y, cbw, cbh, function () { settingsOpen = false; });
}

/* ============================================================
 *  19c. 成就面板
 * ============================================================ */
function drawAch() {
  const land = isLandscape();
  const k = uiScale();

  ctx.fillStyle = 'rgba(8, 22, 14, 0.84)';
  ctx.fillRect(0, 0, W, H);

  const cols = 2;
  const gap = 9 * k;
  const rows = Math.ceil(ACHS.length / cols);
  const cw = Math.min(W * 0.92, (land ? 470 : 344) * k);
  const cardH = (land ? 40 : 52) * k;
  const headH = (land ? 56 : 66) * k;
  const footH = (land ? 52 : 58) * k;
  const ch = Math.min(H * 0.94, headH + rows * cardH + (rows - 1) * gap + footH);
  const cx = W / 2 - cw / 2;
  const cy = H / 2 - ch / 2;
  const padX = 16 * k;

  const pg = ctx.createLinearGradient(0, cy, 0, cy + ch);
  pg.addColorStop(0, 'rgba(40, 78, 52, 0.98)');
  pg.addColorStop(1, 'rgba(20, 46, 30, 0.98)');
  ctx.fillStyle = pg;
  rr(ctx, cx, cy, cw, ch, 20 * k);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  addHit(cx, cy, cw, ch, function () {});

  // 标题 + 进度
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.font = fontOf((land ? 15 : 17) * k, 'bold');
  ctx.fillText('成就', cx + padX, cy + 26 * k);
  const got = achCount();
  ctx.textAlign = 'right';
  ctx.fillStyle = got >= ACHS.length ? '#ffd93b' : 'rgba(255,255,255,0.52)';
  ctx.font = fontOf(11 * k, 'bold');
  ctx.fillText('已解锁 ' + got + ' / ' + ACHS.length, cx + cw - padX - 32 * k, cy + 26 * k);

  // 关闭
  const closeR = 12 * k;
  const ccx = cx + cw - padX + 1 * k;
  const ccy = cy + 26 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.arc(ccx, ccy, closeR, 0, SKIN_TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = Math.max(1.4, 1.8 * k);
  ctx.lineCap = 'round';
  const xr = closeR * 0.42;
  ctx.beginPath();
  ctx.moveTo(ccx - xr, ccy - xr); ctx.lineTo(ccx + xr, ccy + xr);
  ctx.moveTo(ccx + xr, ccy - xr); ctx.lineTo(ccx - xr, ccy + xr);
  ctx.stroke();
  addHit(ccx - closeR - 8, ccy - closeR - 8, (closeR + 8) * 2, (closeR + 8) * 2, function () {
    achOpen = false;
    settingsOpen = true;
  });

  // 卡片
  const cardW = (cw - padX * 2 - gap) / cols;
  const top = cy + headH - 8 * k;
  for (let i = 0; i < ACHS.length; i++) {
    const a = ACHS[i];
    const on = !!achUnlocked[a.id];
    const bx = cx + padX + (i % cols) * (cardW + gap);
    const by = top + Math.floor(i / cols) * (cardH + gap);

    ctx.fillStyle = on ? 'rgba(255,217,59,0.13)' : 'rgba(255,255,255,0.045)';
    rr(ctx, bx, by, cardW, cardH, 11 * k);
    ctx.fill();
    if (on) {
      ctx.strokeStyle = 'rgba(255,217,59,0.60)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    // 左边的星：解锁=金色实心，未解锁=空心
    const sr = (land ? 5 : 6) * k;
    const sx = bx + 13 * k, sy = by + cardH / 2;
    ctx.beginPath();
    for (let p = 0; p < 10; p++) {
      const ang = -Math.PI / 2 + p * Math.PI / 5;
      const rr2 = p % 2 === 0 ? sr : sr * 0.45;
      const px2 = sx + Math.cos(ang) * rr2, py2 = sy + Math.sin(ang) * rr2;
      if (p === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.closePath();
    if (on) { ctx.fillStyle = '#ffd93b'; ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.2; ctx.stroke(); }

    ctx.textAlign = 'left';
    ctx.fillStyle = on ? '#ffe57a' : 'rgba(255,255,255,0.58)';
    ctx.font = fontOf((land ? 10.5 : 11.5) * k, 'bold');
    ctx.fillText(a.name, bx + 24 * k, by + cardH * (land ? 0.34 : 0.36));

    ctx.fillStyle = on ? 'rgba(255,255,255,0.66)' : 'rgba(255,255,255,0.34)';
    ctx.font = fontOf((land ? 8 : 9) * k);
    ctx.fillText(a.desc, bx + 24 * k, by + cardH * (land ? 0.70 : 0.71));
  }

  // 返回
  const bw = Math.min(cw * 0.52, 168 * k);
  const bh = (land ? 32 : 36) * k;
  drawPill(W / 2 - bw / 2, cy + ch - footH + 2 * k, bw, bh, '#63d977', '#38974a', '返回', 13 * k);
  addHit(W / 2 - bw / 2, cy + ch - footH + 2 * k, bw, bh, function () {
    achOpen = false;
    settingsOpen = true;
  });
}

function render(now) {
  const ty = topY();

  /* 暂停时用上一帧的整屏快照当背景：天空、树林、柱子、粒子都不用再画一遍。
     设置/排行榜/成就这些面板本来就要自己铺一层半透明底，铺在快照上正合适。 */
  if (gameState === 'paused' && pauseSnap) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(pauseSnap, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    clearHits();
    if (achOpen) drawAch();
    else if (settingsOpen) drawSettings();
    else if (boardOpen) drawBoard();
    else drawPaused();
    drawToast(now);
    return;
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  ctx.save();
  if (punch > 0.004) {
    // 以角色为中心轻微推近，落地那一瞬间会「实」很多
    const z = 1 + punch * 0.016;
    const px = player.x - camX, py = player.y - 16;
    ctx.translate(px, py);
    ctx.scale(z, z);
    ctx.translate(-px, -py);
  }
  if (shake > 0.12) {
    ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake * 0.7);
  }

  drawSky();
  drawStars(now);
  drawSun(now);
  drawClouds(now);
  tileLayer(hillFar, 0.10, ty + 30, 1);
  tileLayer(hillNear, 0.20, ty + 40, 1);
  tileLayer(treeFar, 0.30, ty + 26, 0.92);
  tileLayer(treeMid, 0.52, ty + 46, 1);
  drawFog();
  drawGround();

  drawPlatforms(now);
  drawTrajectory(now);
  drawTrail();
  drawPlayer(now);
  drawFx();
  drawLeaves();
  drawFireflies(now);
  drawForeground();

  ctx.restore();

  drawGlows(now);
  drawDuskTint();
  drawVignette();
  clearHits();          // 先清再画：HUD 和面板都能注册可点区域
  drawUI(now);
  if (achOpen) drawAch();
  else if (settingsOpen) drawSettings();
  else if (boardOpen) drawBoard();
  else if (gameState === 'paused') drawPaused();
  else if (gameState === 'over') drawOver();
  drawToast(now);
}

/* ============================================================
 *  20. 落叶
 * ============================================================ */
function initLeaves() {
  leaves = [];
  const n = perfLevel >= 2 ? 8 : CFG.leafCount;
  for (let i = 0; i < n; i++) {
    leaves.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vy: 20 + Math.random() * 45,
      vx: -10 + Math.random() * 20,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 3,
      size: 4 + Math.random() * 5,
      color: Math.random() < 0.5 ? '#a9cc6b' : '#d8ab4f',
      sway: Math.random() * Math.PI * 2
    });
  }
}

/* ============================================================
 *  21. 主循环
 * ============================================================ */
let lastTime = performance.now();
let acc = 0;

let lastDrawAt = 0, lastLoopState = '';

function loop(now) {
  requestAnimationFrame(loop);

  const rawDt = (now - lastTime) / 1000;
  let dt = rawDt;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  sampleFps(now, rawDt);          // 帧率显示用真实帧间隔，不受顿帧/降档影响

  if (gameState !== 'paused') {
    if (hitstop > 0) {
      hitstop -= dt;
      if (hitstop < 0) hitstop = 0;
      acc = 0;                       // 顿帧期间不攒时间，否则恢复会瞬移
    } else {
      acc += dt;
      if (acc > 0.25) acc = 0.25;    // 长时间卡顿后不要连爆几十步
      let guard = 0;
      while (acc >= CFG.step && guard < 12) {
        fixedUpdate(CFG.step);
        acc -= CFG.step;
        guard++;
      }
      visualUpdate(dt, now);
    }
    updatePerf(now, dt);             // 采样不受顿帧影响
  }

  /* 暂停 / 结算 / 面板：画面基本是静止的，没必要跟着屏幕 120Hz 重画。
     压到 ~30fps，可点区域和动画都还在，手感没区别，发热和耗电明显低。
     状态刚变的那一帧必须马上画，不然按了暂停要等 30ms 才见到面板。 */
  if (lastLoopState !== gameState) { lastLoopState = gameState; lastDrawAt = 0; }
  const idleScene = gameState !== 'playing';
  if (idleScene && lastDrawAt > 0 && now - lastDrawAt < 32) return;
  lastDrawAt = now;

  render(now);
}

/* ============================================================
 *  22. 事件
 * ============================================================ */
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (gameState === 'playing') togglePause();
  }
});

function onResize() {
  resizeCanvas();
  buildScene();
  if (player) {
    if (player.state === 'idle') player.y = topY();
    camX = player.x - W * camAnchor();
  }
  initLeaves();
  initFireflies();
  pauseSnap = null;          // 尺寸变了，旧快照对不上
}

let resizeTimer = 0;
function scheduleResize() {
  if (nameEditing) return;
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(onResize, 140);
}

document.addEventListener('fullscreenchange', scheduleResize);
document.addEventListener('webkitfullscreenchange', scheduleResize);
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', scheduleResize);
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', scheduleResize);
}

/* ============================================================
 *  23. 启动
 * ============================================================ */
loadAch();           // 成就 / 累计数据 / 每日记录要在第一次 reset 之前读
loadStats();
loadDailyRecord();
resizeCanvas();
buildScene();
reset();
initLeaves();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
